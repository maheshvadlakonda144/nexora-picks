<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Add Product | NEXORA PICKS
</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033
}

header{
background:#2874f0;
color:white;
padding:18px 20px;
display:flex;
align-items:center;
gap:15px
}

header a{
color:white;
text-decoration:none;
font-size:28px
}

header h1{
margin:0;
font-size:23px
}

.wrap{
max-width:700px;
margin:auto;
padding:20px
}

.card{
background:white;
border-radius:14px;
padding:22px;
box-shadow:0 2px 10px #00000010
}

.card h2{
margin-top:0
}

.subtitle{
color:#667085;
line-height:1.5
}

label{
display:block;
font-weight:bold;
margin-top:18px;
margin-bottom:7px
}

input,
textarea,
select{
width:100%;
padding:14px;
border:1px solid #d0d5dd;
border-radius:8px;
font-size:16px;
font-family:Arial,sans-serif
}

input:focus,
textarea:focus,
select:focus{
outline:none;
border-color:#2874f0
}

textarea{
resize:vertical;
min-height:110px
}

.imagePreview{
width:100%;
height:220px;
margin-top:12px;
border:2px dashed #d0d5dd;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#f7f9fc;
color:#667085
}

.imagePreview img{
width:100%;
height:100%;
object-fit:contain
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:8px;
background:#2874f0;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
margin-top:18px;
padding:13px;
border-radius:8px;
font-weight:bold
}

.success{
background:#e8f5e9;
color:#16803c
}

.error{
background:#ffebee;
color:#c62828
}

@media(max-width:600px){

.wrap{
padding:12px
}

.row{
grid-template-columns:1fr
}

.card{
padding:18px
}

}

</style>

</head>

<body>

<header>

<a href="seller-dashboard.html">
‹
</a>

<h1>
➕ Add Product
</h1>

</header>

<div class="wrap">

<div class="card">

<h2>
Add a New Product
</h2>

<p class="subtitle">
Enter your product details to list it on NEXORA PICKS.
</p>

<form id="productForm">

<label>
Product Name
</label>

<input
type="text"
id="name"
placeholder="Example: Wireless Bluetooth Headphones"
required
>

<label>
Product Image URL
</label>

<input
type="url"
id="image"
placeholder="Paste product image URL"
required
>

<div
class="imagePreview"
id="imagePreview">

📷 Product image preview

</div>

<label>
Product Description
</label>

<textarea
id="description"
placeholder="Write product details..."
required
></textarea>

<label>
Category
</label>

<select
id="category"
required>

<option value="">
Select Category
</option>

<option value="Electronics">
Electronics
</option>

<option value="Fashion">
Fashion
</option>

<option value="Home">
Home & Kitchen
</option>

<option value="Beauty">
Beauty & Personal Care
</option>

<option value="Sports">
Sports
</option>

<option value="Books">
Books
</option>

<option value="Other">
Other
</option>

</select>

<div class="row">

<div>

<label>
Price ₹
</label>

<input
type="number"
id="price"
placeholder="999"
min="1"
required
>

</div>

<div>

<label>
Stock Quantity
</label>

<input
type="number"
id="stock"
placeholder="10"
min="0"
required
>

</div>

</div>

<button
type="submit"
id="addBtn">

➕ Add Product

</button>

</form>

<div
id="message"
class="message">

</div>

</div>

</div>

<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import{
getFirestore,
doc,
getDoc,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};


const app=
initializeApp(firebaseConfig);


const auth=
getAuth(app);


const db=
getFirestore(app);


const form=
document.getElementById("productForm");


const addBtn=
document.getElementById("addBtn");


const message=
document.getElementById("message");


const imageInput=
document.getElementById("image");


const imagePreview=
document.getElementById("imagePreview");


let currentSeller=null;


/* CHECK SELLER LOGIN */

onAuthStateChanged(

auth,

async user=>{

if(!user){

location.href=
"seller-register.html";

return;

}

try{

const sellerSnap=

await getDoc(

doc(
db,
"sellers",
user.uid
)

);


if(

!sellerSnap.exists()

){

alert(
"Only registered sellers can add products."
);

location.href=
"seller-register.html";

return;

}


/* ONLY KEEP SELLER ID */

currentSeller={

id:user.uid

};


}catch(error){

console.error(error);

showMessage(

"Unable to verify seller account.",

"error"

);

}

}

);


/* IMAGE PREVIEW */

imageInput.addEventListener(

"input",

function(){

const url=
imageInput.value.trim();


if(!url){

imagePreview.innerHTML=
"📷 Product image preview";

return;

}


imagePreview.innerHTML=

`<img src="${escapeHtml(url)}" alt="Product Preview">`;

}

);


/* ADD PRODUCT */

form.addEventListener(

"submit",

async function(e){

e.preventDefault();


if(!currentSeller){

showMessage(

"Seller account is still loading. Please wait.",

"error"

);

return;

}


const name=
document.getElementById("name").value.trim();


const image=
document.getElementById("image").value.trim();


const description=
document.getElementById("description").value.trim();


const category=
document.getElementById("category").value;


const price=

Number(

document.getElementById("price").value

);


const stock=

Number(

document.getElementById("stock").value

);


addBtn.disabled=true;


addBtn.textContent=
"Adding Product...";


try{


await addDoc(

collection(
db,
"products"
),

{


name:name,


image:image,


description:description,


category:category,


price:price,


stock:stock,


/* SELLER ID IS INTERNAL ONLY */

sellerId:
currentSeller.id,


status:
"active",


createdAt:
serverTimestamp()

}

);


showMessage(

"✅ Product added successfully!",

"success"

);


form.reset();


imagePreview.innerHTML=
"📷 Product image preview";


setTimeout(

function(){

location.href=
"seller-dashboard.html";

},

1500

);


}catch(error){

console.error(error);


showMessage(

"❌ Unable to add product: "+error.message,

"error"

);


addBtn.disabled=false;


addBtn.textContent=
"➕ Add Product";

}

}

);


/* MESSAGE */

function showMessage(
text,
type
){

message.style.display=
"block";


message.className=
"message "+type;


message.textContent=
text;

}


/* ESCAPE HTML */

function escapeHtml(
value
){

return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

</script>

</body>

  </html>
