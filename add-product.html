<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Add Product | NEXORA PICKS
</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033
}

header{
background:#2874f0;
color:white;
padding:18px 20px;
display:flex;
align-items:center;
gap:15px
}

header a{
color:white;
text-decoration:none;
font-size:28px
}

header h1{
margin:0;
font-size:23px
}

.wrap{
max-width:700px;
margin:auto;
padding:20px
}

.card{
background:white;
border-radius:14px;
padding:22px;
box-shadow:0 2px 10px #00000010
}

.card h2{
margin-top:0
}

.subtitle{
color:#667085;
line-height:1.5
}

label{
display:block;
font-weight:bold;
margin-top:18px;
margin-bottom:7px
}

input,
textarea,
select{
width:100%;
padding:14px;
border:1px solid #d0d5dd;
border-radius:8px;
font-size:16px;
font-family:Arial,sans-serif
}

input:focus,
textarea:focus,
select:focus{
outline:none;
border-color:#2874f0
}

textarea{
resize:vertical;
min-height:110px
}

.imagePreview{
width:100%;
height:220px;
margin-top:12px;
border:2px dashed #d0d5dd;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#f7f9fc;
color:#667085
}

.imagePreview img{
width:100%;
height:100%;
object-fit:contain
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:8px;
background:#2874f0;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
margin-top:18px;
padding:13px;
border-radius:8px;
font-weight:bold
}

.success{
background:#e8f5e9;
color:#16803c
}

.error{
background:#ffebee;
color:#c62828
}

.info{
background:#e8f0fe;
color:#1a5cc8
}

.uploadNote{
font-size:13px;
color:#667085;
margin-top:7px;
line-height:1.5
}

@media(max-width:600px){

.wrap{
padding:12px
}

.row{
grid-template-columns:1fr
}

.card{
padding:18px
}

}

</style>

</head>

<body>

<header>

<a href="seller-dashboard.html">
‹
</a>

<h1>
➕ Add Product
</h1>

</header>


<div class="wrap">

<div class="card">

<h2>
Add a New Product
</h2>

<p class="subtitle">

Enter your product details and upload a product image.

Your product will be published immediately.

</p>


<form id="productForm">


<label>
Product Name
</label>

<input
type="text"
id="name"
placeholder="Example: Wireless Bluetooth Headphones"
required
>


<label>
Product Image
</label>

<input
type="file"
id="imageFile"
accept="image/*"
required
>


<div class="uploadNote">

📱 Select a product image from your phone or computer.

</div>


<div
class="imagePreview"
id="imagePreview">

📷 Product image preview

</div>


<label>
Product Description
</label>

<textarea
id="description"
placeholder="Write product details..."
required
></textarea>


<label>
Category
</label>

<select
id="category"
required>

<option value="">
Select Category
</option>

<option value="Electronics">
Electronics
</option>

<option value="Fashion">
Fashion
</option>

<option value="Home & Kitchen">
Home & Kitchen
</option>

<option value="Beauty & Personal Care">
Beauty & Personal Care
</option>

<option value="Mobiles & Accessories">
Mobiles & Accessories
</option>

<option value="Sports">
Sports
</option>

<option value="Books">
Books
</option>

<option value="Other">
Other
</option>

</select>


<div class="row">


<div>

<label>
Price ₹
</label>

<input
type="number"
id="price"
placeholder="999"
min="1"
required
>

</div>


<div>

<label>
Stock Quantity
</label>

<input
type="number"
id="stock"
placeholder="10"
min="0"
required
>

</div>


</div>


<button
type="submit"
id="addBtn">

➕ Add Product

</button>


</form>


<div
id="message"
class="message">

</div>


</div>

</div>


<script type="module">


/* FIREBASE APP */

import{

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


/* FIREBASE AUTH */

import{

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* FIRESTORE */

import{

getFirestore,

collection,

addDoc,

serverTimestamp,

query,

where,

getDocs

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE STORAGE */

import{

getStorage,

ref,

uploadBytes,

getDownloadURL

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};


/* INITIALIZE */

const app=

initializeApp(
firebaseConfig
);


const auth=

getAuth(
app
);


const db=

getFirestore(
app
);


const storage=

getStorage(
app
);


/* ELEMENTS */

const form=

document.getElementById(
"productForm"
);


const addBtn=

document.getElementById(
"addBtn"
);


const message=

document.getElementById(
"message"
);


const imageFile=

document.getElementById(
"imageFile"
);


const imagePreview=

document.getElementById(
"imagePreview"
);


/* CURRENT SELLER */

let currentSeller=null;


/* CHECK LOGIN AND SELLER STATUS */

onAuthStateChanged(

auth,

async user=>{


if(!user){

location.href=
"seller-register.html";

return;

}


try{


const sellerQuery=

query(

collection(
db,
"sellers"
),

where(
"userId",
"==",
user.uid
)

);


const sellerSnapshot=

await getDocs(
sellerQuery
);


if(
sellerSnapshot.empty
){


alert(
"Please register as a seller first."
);


location.href=
"seller-register.html";


return;

}


const sellerDoc=

sellerSnapshot.docs[0];


const sellerData=

sellerDoc.data();


/* CHECK SELLER APPROVAL */

if(
sellerData.status!=="approved"
){


showMessage(

"⏳ Your seller account is not approved yet. Please wait for admin approval.",

"error"

);


form.style.display=
"none";


return;

}


/* SAVE SELLER INFORMATION */

currentSeller={

id:
user.uid,

sellerDocId:
sellerDoc.id,

storeName:
sellerData.storeName||
"Seller"

};


}catch(error){


console.error(
error
);


showMessage(

"❌ Unable to verify seller account: "+error.message,

"error"

);


}

}

);


/* IMAGE PREVIEW */

imageFile.addEventListener(

"change",

function(){


const file=

imageFile.files[0];


if(!file){


imagePreview.innerHTML=

"📷 Product image preview";


return;

}


if(
!file.type.startsWith(
"image/"
)
){


showMessage(

"Please select a valid image file.",

"error"

);


imageFile.value=

"";


return;

}


const imageUrl=

URL.createObjectURL(
file
);


imagePreview.innerHTML=

`<img src="${imageUrl}" alt="Product Preview">`;


}

);


/* ADD PRODUCT */

form.addEventListener(

"submit",

async function(e){


e.preventDefault();


if(!currentSeller){


showMessage(

"Seller account is still loading. Please wait.",

"error"

);


return;

}


const file=

imageFile.files[0];


if(!file){


showMessage(

"Please select a product image.",

"error"

);


return;

}


/* FILE SIZE LIMIT 5MB */

if(
file.size>
5*1024*1024
){


showMessage(

"Image size must be less than 5 MB.",

"error"

);


return;

}


const name=

document
.getElementById(
"name"
)
.value
.trim();


const description=

document
.getElementById(
"description"
)
.value
.trim();


const category=

document
.getElementById(
"category"
)
.value;


const price=

Number(

document
.getElementById(
"price"
)
.value

);


const stock=

Number(

document
.getElementById(
"stock"
)
.value

);


/* DISABLE BUTTON */

addBtn.disabled=

true;


addBtn.textContent=

"📤 Uploading Image...";


try{


/* CREATE UNIQUE IMAGE NAME */

const safeFileName=

file.name

.replace(
/[^a-zA-Z0-9.\-_]/g,
"_"
);


const imagePath=

"products/"

+

currentSeller.id

+

"/"

+

Date.now()

+

"_"

+

safeFileName;


/* STORAGE REFERENCE */

const storageRef=

ref(

storage,

imagePath

);


/* UPLOAD IMAGE */

await uploadBytes(

storageRef,

file

);


/* GET IMAGE URL */

const imageUrl=

await getDownloadURL(

storageRef

);


/* UPDATE BUTTON */

addBtn.textContent=

"💾 Saving Product...";


/* SAVE PRODUCT */

await addDoc(

collection(
db,
"products"
),

{


/* PRODUCT DETAILS */

name:
name,


image:
imageUrl,


imageUrl:
imageUrl,


description:
description,


category:
category,


price:
price,


stock:
stock,


/* SELLER DETAILS */

sellerId:
currentSeller.id,


sellerDocId:
currentSeller.sellerDocId,


sellerName:
currentSeller.storeName,


/* AUTOMATICALLY APPROVED AND VISIBLE */

approvalStatus:
"approved",


status:
"approved",


active:
true,


/* DATE */

createdAt:
serverTimestamp(),


updatedAt:
serverTimestamp()

}

);


/* SUCCESS MESSAGE */

showMessage(

"✅ Product added successfully! Your product is now live.",

"success"

);


/* RESET FORM */

form.reset();


imagePreview.innerHTML=

"📷 Product image preview";


/* GO BACK TO SELLER DASHBOARD */

setTimeout(

function(){


location.href=

"seller-dashboard.html";


},

1500

);


}catch(error){


console.error(
error
);


showMessage(

"❌ Unable to add product: "+error.message,

"error"

);


addBtn.disabled=

false;


addBtn.textContent=

"➕ Add Product";


}

}

);


/* SHOW MESSAGE */

function showMessage(

text,

type

){


message.style.display=

"block";


message.className=

"message "+type;


message.textContent=

text;


}

</script>

</body>

</html>
