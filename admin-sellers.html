<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Seller Management | NEXORA PICKS</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

header{
background:#172033;
color:white;
padding:16px;
position:sticky;
top:0;
z-index:10;
}

.header{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:22px;
font-weight:800;
}

.home{
color:white;
text-decoration:none;
border:1px solid #64748b;
padding:9px 15px;
border-radius:8px;
}

.wrap{
max-width:1200px;
margin:25px auto;
padding:0 15px;
}

.card{
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 4px 20px #00000010;
}

h1{
margin-top:0;
}

.sub{
color:#64748b;
}

.topbar{
display:flex;
gap:12px;
margin-bottom:20px;
flex-wrap:wrap;
}

.filter{
padding:10px 14px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:15px;
}

.refresh{
background:#2874f0;
color:white;
border:0;
padding:10px 16px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.seller{
border:1px solid #e2e8f0;
border-radius:12px;
padding:18px;
margin-bottom:15px;
}

.seller-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
flex-wrap:wrap;
}

.store{
font-size:20px;
font-weight:bold;
}

.name{
margin-top:5px;
color:#475569;
}

.status{
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
display:inline-block;
}

.pending{
background:#fff3cd;
color:#856404;
}

.approved{
background:#d1fae5;
color:#065f46;
}

.rejected{
background:#fee2e2;
color:#991b1b;
}

.details{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:18px;
background:#f8fafc;
padding:14px;
border-radius:10px;
}

.detail b{
display:block;
font-size:12px;
color:#64748b;
margin-bottom:3px;
}

.actions{
display:flex;
gap:10px;
margin-top:18px;
flex-wrap:wrap;
}

.btn{
border:0;
padding:11px 16px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.approve{
background:#169c72;
color:white;
}

.reject{
background:#dc2626;
color:white;
}

.empty{
text-align:center;
padding:40px;
color:#64748b;
}

.loading{
text-align:center;
padding:30px;
}

.login-box{
max-width:450px;
margin:50px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 20px #00000015;
}

input{
width:100%;
padding:13px;
border:1px solid #cbd5e1;
border-radius:8px;
margin:8px 0 15px;
font-size:15px;
}

.login-btn{
width:100%;
background:#2874f0;
color:white;
border:0;
padding:13px;
border-radius:8px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.error{
color:#dc2626;
margin-top:10px;
}

.logout{
background:#dc2626;
color:white;
border:0;
padding:9px 14px;
border-radius:8px;
cursor:pointer;
}

#dashboard{
display:none;
}

@media(max-width:600px){

.details{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div class="header">

<div>

<div class="logo">
NEXORA PICKS
</div>

<small>
Admin Seller Management
</small>

</div>

<div>

<button class="logout" id="logoutBtn">
Logout
</button>

<a class="home" href="index.html">
Home
</a>

</div>

</div>

</header>


<!-- LOGIN -->

<div id="loginSection">

<div class="login-box">

<h2>Admin Login</h2>

<p class="sub">
Login with your NEXORA PICKS admin account.
</p>

<input
type="email"
id="email"
placeholder="Admin Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button
class="login-btn"
onclick="adminLogin()"
>
Login
</button>

<div
id="loginMsg"
class="error"
></div>

</div>

</div>



<!-- DASHBOARD -->

<div
id="dashboard"
class="wrap"
>

<div class="card">

<h1>
Seller Applications
</h1>

<p class="sub">
Manage seller registrations and approvals.
</p>


<div class="topbar">

<select
id="filter"
class="filter"
onchange="loadSellers()"
>

<option value="all">
All Sellers
</option>

<option value="pending">
Pending
</option>

<option value="approved">
Approved
</option>

<option value="rejected">
Rejected
</option>

</select>


<button
class="refresh"
onclick="loadSellers()"
>

↻ Refresh

</button>

</div>


<div id="sellerList">

<div class="loading">

Loading sellers...

</div>

</div>

</div>

</div>



<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{
getFirestore,
collection,
getDocs,
query,
where,
doc,
updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



const firebaseConfig={

apiKey:
"AIzaSyCPpol_Dmj3yTph_PBG59IbwtUqSpbAqwY",

authDomain:
"nexora-picks-be049.firebaseapp.com",

projectId:
"nexora-picks-be049",

storageBucket:
"nexora-picks-be049.firebasestorage.app",

messagingSenderId:
"325932959084",

appId:
"1:325932959084:web:4fd8252e1ba83f82ee1f49",

measurementId:
"G-KMQZXZZCHJ"

};



const app=
initializeApp(firebaseConfig);


const auth=
getAuth(app);


const db=
getFirestore(app);



const $=
id=>document.getElementById(id);



window.adminLogin=
async()=>{

let email=
$("email").value.trim();

let password=
$("password").value;


if(!email||!password){

$("loginMsg").textContent=
"Enter email and password.";

return;

}


try{

await signInWithEmailAndPassword(

auth,
email,
password

);

}

catch(error){

$("loginMsg").textContent=

error.message
.replace("Firebase: ","");

}

};



$("logoutBtn").onclick=
async()=>{

await signOut(auth);

};



onAuthStateChanged(

auth,

user=>{

if(user){

$("loginSection").style.display=
"none";


$("dashboard").style.display=
"block";


loadSellers();

}

else{

$("loginSection").style.display=
"block";


$("dashboard").style.display=
"none";

}

}

);



window.loadSellers=
async()=>{


const list=
$("sellerList");


list.innerHTML=

'<div class="loading">Loading sellers...</div>';



try{


const filter=
$("filter").value;


let q;


if(filter==="all"){

q=
collection(
db,
"sellers"
);

}

else{

q=
query(

collection(
db,
"sellers"
),

where(
"status",
"==",
filter
)

);

}



const snapshot=
await getDocs(q);



if(snapshot.empty){

list.innerHTML=

'<div class="empty">No sellers found.</div>';

return;

}



let html="";



snapshot.forEach(

documentSnapshot=>{


const seller=
documentSnapshot.data();


const id=
documentSnapshot.id;



html+=`

<div class="seller">


<div class="seller-top">


<div>

<div class="store">

${seller.storeName||"No Store Name"}

</div>


<div class="name">

${seller.fullName||""}

</div>


</div>



<div>

<span class="status ${seller.status||"pending"}">

${seller.status||"pending"}

</span>

</div>


</div>



<div class="details">


<div class="detail">

<b>Email</b>

${seller.email||""}

</div>



<div class="detail">

<b>Mobile</b>

${seller.phone||""}

</div>



<div class="detail">

<b>Seller Type</b>

${seller.sellerType||""}

</div>



<div class="detail">

<b>Legal Name</b>

${seller.legalName||""}

</div>



<div class="detail">

<b>City</b>

${seller.city||""}

</div>



<div class="detail">

<b>State</b>

${seller.state||""}

</div>



<div class="detail">

<b>Pincode</b>

${seller.pincode||""}

</div>



<div class="detail">

<b>Active</b>

${seller.active ? "Yes" : "No"}

</div>


</div>



<div class="actions">


<button

class="btn approve"

onclick="approveSeller('${id}')"

>

✓ Approve

</button>



<button

class="btn reject"

onclick="rejectSeller('${id}')"

>

✕ Reject

</button>


</div>


</div>

`;

}

);



list.innerHTML=
html;


}

catch(error){


console.error(error);


list.innerHTML=

'<div class="empty">Error loading sellers: '+
error.message+
'</div>';

}

};



window.approveSeller=
async id=>{


if(

!confirm(
"Approve this seller?"
)

){

return;

}


try{


await updateDoc(

doc(
db,
"sellers",
id
),

{

status:
"approved",

active:
true

}

);


alert(
"Seller approved successfully!"
);


loadSellers();


}

catch(error){


alert(

"Error: "+

error.message

);

}

};



window.rejectSeller=
async id=>{


if(

!confirm(
"Reject this seller?"
)

){

return;

}


try{


await updateDoc(

doc(
db,
"sellers",
id
),

{

status:
"rejected",

active:
false

}

);


alert(
"Seller rejected."
);


loadSellers();


}

catch(error){


alert(

"Error: "+

error.message

);

}

};


</script>


</body>
  </html>
