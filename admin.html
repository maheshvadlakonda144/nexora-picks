<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA PICKS — Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}
body{margin:0;background:#07090e;color:#f5f7fb;font-family:Arial,sans-serif}
header{padding:18px 16px;border-bottom:1px solid #252d39;position:sticky;top:0;background:#07090e;z-index:5}
.brand{font-weight:900;letter-spacing:2px}.brand span{color:#ff3150}
main{max-width:950px;margin:auto;padding:18px 14px 50px}
.box{background:#10141c;border:1px solid #252d39;border-radius:16px;padding:18px;margin-bottom:16px}
input,textarea,select{width:100%;padding:13px;margin:6px 0 12px;background:#0a0d13;color:#fff;border:1px solid #2a3340;border-radius:9px}
textarea{min-height:90px}
button,.btn{border:0;background:#ff3150;color:#fff;padding:12px 16px;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.secondary{background:#252d39}.approve{background:#16803c}.danger{background:#b52b3e}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{display:none;padding:10px;border-radius:9px;margin:0 0 12px}
.ok{display:block;background:#17251d;color:#a9e2b6}.err{display:block;background:#30151b;color:#ffb2bd}
.muted{color:#929cab}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:#252d39}.tab.active{background:#ff3150}
.section{display:none}.section.active{display:block}
.item{background:#0b0f16;border:1px solid #252d39;border-radius:12px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}
.actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}
.pending{background:#332a12;color:#ffd86b}.approved{background:#17351f;color:#9ee7ae}.rejected{background:#35171d;color:#ffadb8}
@media(max-width:650px){.row{grid-template-columns:1fr}.item{align-items:flex-start;flex-wrap:wrap}.actions{margin-left:0;width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<header><div class="brand">NEXORA <span>PICKS</span> — ADMIN</div></header>

<main>
<div id="loginBox" class="box">
  <h1>Admin Login</h1>
  <p class="muted">Sign in with your authorized Firebase admin account.</p>
  <div id="loginStatus" class="status"></div>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Admin email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button>Login</button>
  </form>
</div>

<div id="panel" style="display:none">
  <div class="box">
    <div class="tabs">
      <button class="tab active" onclick="showTab('sellers',this)">👥 Sellers</button>
      <button class="tab" onclick="showTab('products',this)">📦 Products</button>
    </div>
  </div>

  <section id="sellers" class="section active">
    <div class="box">
      <h2>Seller Approvals</h2>
      <p class="muted">Review seller accounts. Only approved sellers can publish products.</p>
      <div id="sellerStatus" class="status"></div>
      <div id="sellerList">Loading sellers…</div>
    </div>
  </section>

  <section id="products" class="section">
    <div class="box">
      <h1 id="formTitle">Add Product</h1>
      <div id="status" class="status"></div>
      <form id="productForm">
        <input type="hidden" id="docId">
        <label>Product name</label>
        <input id="name" placeholder="Wireless Earphones" required>
        <label>Description</label>
        <textarea id="description" placeholder="Short description"></textarea>
        <div class="row">
          <div><label>Category</label><input id="category" placeholder="Electronics"></div>
          <div><label>Button text</label><input id="buttonText" value="Check Price"></div>
        </div>
        <label>Product image URL</label>
        <input id="imageUrl" type="url" placeholder="https://...jpg">
        <label>Price / shopping URL</label>
        <input id="priceUrl" type="url" placeholder="https://...">
        <div class="row">
          <div><label>Emoji fallback</label><input id="emoji" value="🛍️"></div>
          <div><label>Active</label><select id="active"><option value="true">Yes — show</option><option value="false">No — hide</option></select></div>
        </div>
        <button>Save Product</button>
        <button type="button" class="secondary" id="cancel" style="display:none">Cancel Edit</button>
      </form>
    </div>
    <div class="box">
      <h2>Products</h2>
      <p class="muted">Add, edit or delete products.</p>
      <div id="list">Loading…</div>
    </div>
  </section>

  <div class="box">
    <button id="logout" class="secondary">Logout</button>
    <a class="btn secondary" href="./">Open Website</a>
  </div>
</div>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",
 authDomain:"nexora-picks-e887f.firebaseapp.com",
 projectId:"nexora-picks-e887f",
 storageBucket:"nexora-picks-e887f.firebasestorage.app",
 messagingSenderId:"621359003619",
 appId:"1:621359003619:web:483add8bfcd0241f4192d",
 measurementId:"G-LSMJ6QLLPW"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);

function stat(id,t,e=false){
  $(id).textContent=t;
  $(id).className='status '+(e?'err':'ok');
}

window.showTab=(id,btn)=>{
 document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 $(id).classList.add('active');btn.classList.add('active');
};

$('loginForm').onsubmit=async e=>{
 e.preventDefault();
 try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);stat('loginStatus','Login successful.')}
 catch(x){stat('loginStatus',x.message,true)}
};

onAuthStateChanged(auth,u=>{
 $('loginBox').style.display=u?'none':'block';
 $('panel').style.display=u?'block':'none';
 if(u){loadSellers();loadProducts()}
});

$('logout').onclick=()=>signOut(auth);

function loadSellers(){
 onSnapshot(collection(db,'users'),s=>{
  const sellers=s.docs.map(d=>({id:d.id,...d.data()}))
    .filter(x=>x.role==='seller')
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));

  if(!sellers.length){
   $('sellerList').innerHTML='<p class="muted">No seller registrations yet.</p>';return;
  }

  $('sellerList').innerHTML=sellers.map(s=>{
   const state=s.approved===true?'approved':(s.sellerStatus==='rejected'?'rejected':'pending');
   const label=state==='approved'?'Approved':state==='rejected'?'Rejected':'Pending approval';
   return `<div class="item">
    <div>
      <b>${esc(s.name||'Seller')}</b>
      <div class="muted">${esc(s.email||'')} • ${esc(s.uid||s.id)}</div>
      <span class="badge ${state}">${label}</span>
    </div>
    <div class="actions">
      ${state!=='approved'?`<button class="approve" onclick="approveSeller('${escAttr(s.id)}')">✓ Approve</button>`:''}
      ${state==='approved'?`<button class="danger" onclick="rejectSeller('${escAttr(s.id)}')">Block</button>`:`<button class="danger" onclick="rejectSeller('${escAttr(s.id)}')">Reject</button>`}
    </div>
   </div>`;
  }).join('');
 },x=>stat('sellerStatus',x.message,true));
}

window.approveSeller=async id=>{
 try{
  await updateDoc(doc(db,'users',id),{approved:true,sellerStatus:'approved',approvedAt:serverTimestamp()});
  stat('sellerStatus','Seller approved ✓');
 }catch(x){stat('sellerStatus',x.message,true)}
};

window.rejectSeller=async id=>{
 if(!confirm('Block/reject this seller?'))return;
 try{
  await updateDoc(doc(db,'users',id),{approved:false,sellerStatus:'rejected',rejectedAt:serverTimestamp()});
  stat('sellerStatus','Seller blocked/rejected.');
 }catch(x){stat('sellerStatus',x.message,true)}
};

function reset(){
 $('productForm').reset();$('docId').value='';$('buttonText').value='Check Price';
 $('emoji').value='🛍️';$('active').value='true';$('formTitle').textContent='Add Product';
 $('cancel').style.display='none';
}
$('cancel').onclick=reset;

$('productForm').onsubmit=async e=>{
 e.preventDefault();
 let id=$('docId').value,d={
  name:$('name').value.trim(),description:$('description').value.trim(),
  category:$('category').value.trim(),buttonText:$('buttonText').value.trim()||'Check Price',
  imageUrl:$('imageUrl').value.trim(),priceUrl:$('priceUrl').value.trim(),
  emoji:$('emoji').value.trim()||'🛍️',active:$('active').value==='true'
 };
 try{
  if(id)await updateDoc(doc(db,'products',id),d);
  else{d.createdAt=serverTimestamp();await addDoc(collection(db,'products'),d)}
  stat('status',id?'Product updated.':'Product added.');reset();
 }catch(x){stat('status',x.message,true)}
};

function loadProducts(){
 onSnapshot(collection(db,'products'),s=>{
  let a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));
  $('list').innerHTML=a.length?a.map(p=>`<div class="item">
   <div><b>${esc(p.name||'Unnamed')}</b><div class="muted">${esc(p.category||'')} • ${p.active===false?'Hidden':'Live'}</div></div>
   <div class="actions"><button class="secondary" onclick='edit(${JSON.stringify(p)})'>Edit</button><button class="danger" onclick='removeP(${JSON.stringify(p.id)})'>Delete</button></div>
  </div>`).join(''):'<p class="muted">No products yet.</p>';
 },x=>stat('status',x.message,true))
}

window.edit=p=>{
 $('docId').value=p.id;$('name').value=p.name||'';$('description').value=p.description||'';
 $('category').value=p.category||'';$('buttonText').value=p.buttonText||'Check Price';
 $('imageUrl').value=p.imageUrl||'';$('priceUrl').value=p.priceUrl||'';
 $('emoji').value=p.emoji||'🛍️';$('active').value=String(p.active!==false);
 $('formTitle').textContent='Edit Product';$('cancel').style.display='inline-block';
 showTab('products',document.querySelectorAll('.tab')[1]);scrollTo({top:0,behavior:'smooth'});
};

window.removeP=async id=>{
 if(confirm('Delete this product?'))try{await deleteDoc(doc(db,'products',id));stat('status','Product deleted.')}
 catch(x){stat('status',x.message,true)}
};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(v){return String(v??'').replace(/['\\]/g,'')}
</script>
</body>
  </html>
