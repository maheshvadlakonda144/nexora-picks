<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora Picks — Admin</title><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;background:#07090e;color:#f5f7fb;font-family:Arial,sans-serif}header{padding:20px;border-bottom:1px solid #252d39}.brand{font-weight:900;letter-spacing:2px}.brand span{color:#ff3150}main{max-width:900px;margin:auto;padding:20px 15px 50px}.box{background:#10141c;border:1px solid #252d39;border-radius:16px;padding:20px;margin-bottom:18px}input,textarea,select{width:100%;padding:13px;margin:7px 0 13px;background:#0a0d13;color:#fff;border:1px solid #2a3340;border-radius:9px}textarea{min-height:90px}button,.btn{border:0;background:#ff3150;color:#fff;padding:12px 16px;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#252d39}.danger{background:#b52b3e}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{display:none;padding:10px;border-radius:9px;margin-bottom:12px}.ok{display:block;background:#17251d;color:#a9e2b6}.err{display:block;background:#30151b;color:#ffb2bd}.product{background:#0b0f16;border:1px solid #252d39;border-radius:12px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}.thumb{width:70px;height:70px;border-radius:8px;background:#171d27;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px}.thumb img{width:100%;height:100%;object-fit:cover}.actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.muted{color:#929cab}@media(max-width:650px){.row{grid-template-columns:1fr}.product{align-items:flex-start;flex-wrap:wrap}.actions{margin-left:0}}</style></head><body><header><div class="brand">NEXORA <span>PICKS</span> — ADMIN</div></header><main><div id="loginBox" class="box"><h1>Admin Login</h1><p class="muted">Sign in with the Firebase account you will authorize as the administrator.</p><div id="loginStatus" class="status"></div><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form></div><div id="panel" style="display:none"><div class="box"><h1 id="formTitle">Add Product</h1><div id="status" class="status"></div><form id="productForm"><input type="hidden" id="docId"><label>Product name</label><input id="name" placeholder="Wireless Earphones" required><label>Description</label><textarea id="description" placeholder="Short description"></textarea><div class="row"><div><label>Category</label><input id="category" placeholder="Electronics"></div><div><label>Button text</label><input id="buttonText" value="Check Price"></div></div><label>Product image URL</label><input id="imageUrl" type="url" placeholder="https://...jpg"><label>Price / shopping URL</label><input id="priceUrl" type="url" placeholder="https://..."><div class="row"><div><label>Emoji fallback</label><input id="emoji" value="🛍️"></div><div><label>Active</label><select id="active"><option value="true">Yes — show</option><option value="false">No — hide</option></select></div></div><button>Save Product</button> <button type="button" class="secondary" id="cancel" style="display:none">Cancel Edit</button></form></div><div class="box"><h2>Products</h2><p class="muted">Add, edit or delete products. Changes appear automatically on the website.</p><div id="list">Loading…</div></div><div class="box"><button id="logout" class="secondary">Logout</button> <a class="btn secondary" href="./">Open Website</a></div></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",authDomain:"nexora-picks-e887f.firebaseapp.com",projectId:"nexora-picks-e887f",storageBucket:"nexora-picks-e887f.firebasestorage.app",messagingSenderId:"621359003619",appId:"1:621359003619:web:483add8bfcd0241f4192d6",measurementId:"G-LSMJ6QLLPW"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);function stat(id,t,e=false){$(id).textContent=t;$(id).className='status '+(e?'err':'ok')}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);stat('loginStatus','Login successful.')}catch(x){stat('loginStatus',x.message,true)}};onAuthStateChanged(auth,u=>{$('loginBox').style.display=u?'none':'block';$('panel').style.display=u?'block':'none';if(u)load()});$('logout').onclick=()=>signOut(auth);function reset(){$('productForm').reset();$('docId').value='';$('buttonText').value='Check Price';$('emoji').value='🛍️';$('active').value='true';$('formTitle').textContent='Add Product';$('cancel').style.display='none'}$('cancel').onclick=reset;$('productForm').onsubmit=async e=>{e.preventDefault();let id=$('docId').value,d={name:$('name').value.trim(),description:$('description').value.trim(),category:$('category').value.trim(),buttonText:$('buttonText').value.trim()||'Check Price',imageUrl:$('imageUrl').value.trim(),priceUrl:$('priceUrl').value.trim(),emoji:$('emoji').value.trim()||'🛍️',active:$('active').value==='true'};try{if(id)await updateDoc(doc(db,'products',id),d);else{d.createdAt=serverTimestamp();await addDoc(collection(db,'products'),d)}stat('status',id?'Product updated.':'Product added.');reset()}catch(x){stat('status',x.message,true)}};function load(){onSnapshot(collection(db,'products'),s=>{let a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));$('list').innerHTML=a.length?a.map(p=>`<div class="product"><div class="thumb">${p.imageUrl?`<img src="${esc(p.imageUrl)}">`:esc(p.emoji||'🛍️')}</div><div><b>${esc(p.name||'Unnamed')}</b><div class="muted">${esc(p.category||'')} • ${p.active===false?'Hidden':'Live'}</div></div><div class="actions"><button class="secondary" onclick='edit(${JSON.stringify(p)})'>Edit</button><button class="danger" onclick='removeP(${JSON.stringify(p.id)})'>Delete</button></div></div>`).join(''):'<p class="muted">No products yet.</p>'},x=>stat('status',x.message,true))}window.edit=p=>{$('docId').value=p.id;$('name').value=p.name||'';$('description').value=p.description||'';$('category').value=p.category||'';$('buttonText').value=p.buttonText||'Check Price';$('imageUrl').value=p.imageUrl||'';$('priceUrl').value=p.priceUrl||'';$('emoji').value=p.emoji||'🛍️';$('active').value=String(p.active!==false);$('formTitle').textContent='Edit Product';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})};window.removeP=async id=>{if(confirm('Delete this product?'))try{await deleteDoc(doc(db,'products',id));stat('status','Product deleted.')}catch(x){stat('status',x.message,true)}};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
