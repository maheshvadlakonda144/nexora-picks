window.approveProduct=async id=>{
  await updateDoc(doc(db,'products',id),{
    approvalStatus:'approved',
    active:true,
    approvedAt:serverTimestamp()
  });
};

window.rejectProduct=async id=>{
  await updateDoc(doc(db,'products',id),{
    approvalStatus:'rejected',
    active:false,
    rejectedAt:serverTimestamp()
  });
};
