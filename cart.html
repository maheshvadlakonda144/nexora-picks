<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA PICKS | Cart</title>
<meta name="description" content="NEXORA PICKS shopping cart and checkout">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f1f3f6;
  font-family:Arial,Helvetica,sans-serif;
  color:#222;
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  background:#2874f0;
  color:white;
  height:64px;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:14px;
  box-shadow:0 2px 8px #0002;
}

.back{
  font-size:30px;
  text-decoration:none;
  color:white;
  line-height:1;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.cartTitle{
  margin-left:auto;
  font-size:16px;
  font-weight:bold;
}

main{
  max-width:1000px;
  margin:20px auto;
  padding:0 14px;
}

.card{
  background:white;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  overflow:hidden;
}

.title{
  padding:18px;
  border-bottom:1px solid #eee;
  font-size:22px;
  font-weight:800;
}

.cartItem{
  display:flex;
  align-items:center;
  gap:15px;
  padding:18px;
  border-bottom:1px solid #eee;
}

.productImage{
  width:100px;
  height:100px;
  border-radius:10px;
  background:#f5f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}

.productImage img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.emoji{
  font-size:42px;
}

.details{
  flex:1;
  min-width:0;
}

.name{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.seller{
  color:#666;
  font-size:14px;
  margin-bottom:8px;
}

.price{
  font-size:18px;
  font-weight:800;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.qty button{
  width:34px;
  height:34px;
  border:1px solid #ccc;
  background:white;
  border-radius:6px;
  font-size:20px;
  cursor:pointer;
}

.qty span{
  min-width:28px;
  text-align:center;
  font-weight:bold;
}

.remove{
  border:0 !important;
  background:#fff !important;
  color:#d32f2f;
  font-size:14px !important;
  width:auto !important;
  padding:0 8px;
}

.itemTotal{
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
}

.summary{
  margin-top:18px;
  background:white;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  padding:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  color:#555;
}

.total{
  border-top:1px solid #ddd;
  margin-top:8px;
  padding-top:15px;
  font-size:23px;
  font-weight:800;
  color:#111;
}

.checkout{
  margin-top:15px;
  width:100%;
  padding:16px;
  border:0;
  border-radius:8px;
  background:#ff9800;
  color:white;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
}

.checkout:disabled{
  background:#bbb;
}

.empty{
  background:white;
  border-radius:12px;
  padding:60px 20px;
  text-align:center;
  box-shadow:0 2px 8px #0001;
}

.emptyIcon{
  font-size:60px;
}

.empty h2{
  margin:15px 0 8px;
}

.shop{
  display:inline-block;
  margin-top:15px;
  padding:13px 25px;
  border-radius:7px;
  background:#2874f0;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.checkoutBox{
  display:none;
  margin-top:18px;
  background:white;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  padding:20px;
}

.checkoutBox.show{
  display:block;
}

.checkoutBox h2{
  margin-top:0;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.cod{
  background:#e8f5e9;
  border:1px solid #b7dfb9;
  padding:14px;
  border-radius:8px;
  margin:15px 0;
  font-weight:bold;
  color:#18752b;
}

.place{
  width:100%;
  padding:15px;
  border:0;
  border-radius:8px;
  background:#ff5722;
  color:white;
  font-size:18px;
  font-weight:800;
}

.message{
  margin-top:14px;
  font-weight:bold;
  text-align:center;
}

.loginBox{
  background:#fff3cd;
  border:1px solid #ffe08a;
  padding:14px;
  border-radius:8px;
  margin-bottom:15px;
}

.loginBox button{
  margin-top:10px;
  border:0;
  padding:10px 18px;
  border-radius:6px;
  background:#2874f0;
  color:white;
  font-weight:bold;
}

@media(max-width:600px){
  .logo{font-size:21px}
  .cartItem{
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .productImage{
    width:82px;
    height:82px;
  }
  .itemTotal{
    width:100%;
    text-align:right;
  }
}
</style>
</head>

<body>

<header class="header">
  <a class="back" href="index.html">‹</a>
  <div class="logo">NEXORA PICKS</div>
  <div class="cartTitle">🛒 My Cart</div>
</header>

<main>

  <div id="cartArea"></div>

  <div id="checkoutBox" class="checkoutBox">

    <h2>Delivery Details</h2>

    <div id="loginBox" class="loginBox" style="display:none">
      Please login before placing your order.
      <br>
      <button onclick="loginCustomer()">Login / Create Account</button>
    </div>

    <div class="field">
      <label>Full Name</label>
      <input id="custName" type="text" placeholder="Enter your full name">
    </div>

    <div class="field">
      <label>Mobile Number</label>
      <input id="custPhone" type="tel" placeholder="Enter mobile number">
    </div>

    <div class="field">
      <label>Delivery Address</label>
      <textarea id="custAddress" placeholder="House no, street, city, state, PIN code"></textarea>
    </div>

    <div class="cod">
      💵 Cash on Delivery<br>
      Pay when your order is delivered.
    </div>

    <button class="place" onclick="placeOrder()">
      Place COD Order
    </button>

    <div id="message" class="message"></div>

  </div>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",
  authDomain: "nexora-picks-e887f.firebaseapp.com",
  projectId: "nexora-picks-e887f",
  storageBucket: "nexora-picks-e887f.firebasestorage.app",
  messagingSenderId: "621359003619",
  appId: "1:621359003619:web:483add8bfcd0241f4192d",
  measurementId: "G-LSMJ6QLLPW"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let cart = JSON.parse(
  localStorage.getItem("nexora_cart") || "[]"
);

let currentUser = null;


function saveCart(){

  localStorage.setItem(
    "nexora_cart",
    JSON.stringify(cart)
  );

  renderCart();
}


function money(value){

  return "₹" + Number(value || 0).toLocaleString("en-IN");

}


function safe(text){

  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


window.changeQty = function(id, amount){

  const item = cart.find(x => x.id === id);

  if(!item) return;

  const stock = Number(item.stock || 999999);

  item.qty += amount;

  if(item.qty < 1){

    cart = cart.filter(x => x.id !== id);

  }

  if(item.qty > stock){

    item.qty = stock;
    alert("Only " + stock + " items are available.");

  }

  saveCart();

};


window.removeCart = function(id){

  cart = cart.filter(x => x.id !== id);

  saveCart();

};


window.openCheckout = function(){

  if(!cart.length){

    alert("Your cart is empty.");
    return;

  }

  document
    .getElementById("checkoutBox")
    .classList.add("show");

  document
    .getElementById("checkoutBox")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

};


window.loginCustomer = function(){

  window.location.href =
    "index.html#login";

};


function renderCart(){

  const area =
    document.getElementById("cartArea");

  if(!cart.length){

    area.innerHTML = `
      <div class="empty">

        <div class="emptyIcon">🛒</div>

        <h2>Your cart is empty</h2>

        <div>
          Add products to your cart and they will appear here.
        </div>

        <a class="shop" href="index.html">
          Continue Shopping
        </a>

      </div>
    `;

    document
      .getElementById("checkoutBox")
      .classList.remove("show");

    return;

  }


  let subtotal = 0;


  const items = cart.map(item => {

    const price =
      Number(item.price || 0);

    const qty =
      Number(item.qty || 1);

    const total =
      price * qty;

    subtotal += total;


    const image =
      item.imageUrl ||
      item.image ||
      "";


    return `

      <div class="cartItem">

        <div class="productImage">

          ${
            image
            ?
            `<img
              src="${safe(image)}"
              alt="${safe(item.name)}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
            >`
            :
            ""
          }

          <div
            class="emoji"
            style="${image ? "display:none" : "display:block"}"
          >
            ${safe(item.emoji || "🛍️")}
          </div>

        </div>


        <div class="details">

          <div class="name">
            ${safe(item.name || "Product")}
          </div>

          <div class="seller">
            🏪 Seller:
            ${safe(item.sellerName || "NEXORA PICKS")}
          </div>

          <div class="price">
            ${money(price)}
          </div>


          <div class="qty">

            <button
              onclick="changeQty('${safe(item.id)}',-1)"
            >
              −
            </button>

            <span>
              ${qty}
            </span>

            <button
              onclick="changeQty('${safe(item.id)}',1)"
            >
              +
            </button>

            <button
              class="remove"
              onclick="removeCart('${safe(item.id)}')"
            >
              Remove
            </button>

          </div>

        </div>


        <div class="itemTotal">
          ${money(total)}
        </div>

      </div>

    `;

  }).join("");


  area.innerHTML = `

    <div class="card">

      <div class="title">
        🛒 Shopping Cart
      </div>

      ${items}

    </div>


    <div class="summary">

      <div class="row">
        <span>Items</span>
        <span>
          ${cart.reduce((s,x)=>s+Number(x.qty||1),0)}
        </span>
      </div>

      <div class="row">
        <span>Subtotal</span>
        <span>${money(subtotal)}</span>
      </div>

      <div class="row">
        <span>Delivery</span>
        <span>FREE</span>
      </div>

      <div class="row total">
        <span>Total</span>
        <span>${money(subtotal)}</span>
      </div>

      <button
        class="checkout"
        onclick="openCheckout()"
      >
        Proceed to Checkout
      </button>

    </div>

  `;

}


async function placeOrder(){

  const msg =
    document.getElementById("message");


  if(!currentUser){

    msg.style.color = "#d32f2f";
    msg.textContent =
      "Please login before placing your order.";

    document
      .getElementById("loginBox")
      .style.display = "block";

    return;

  }


  if(!cart.length){

    msg.style.color = "#d32f2f";
    msg.textContent =
      "Your cart is empty.";

    return;

  }


  const name =
    document
      .getElementById("custName")
      .value.trim();


  const phone =
    document
      .getElementById("custPhone")
      .value.trim();


  const address =
    document
      .getElementById("custAddress")
      .value.trim();


  if(!name || !phone || !address){

    msg.style.color = "#d32f2f";

    msg.textContent =
      "Please fill all delivery details.";

    return;

  }


  if(phone.length < 10){

    msg.style.color = "#d32f2f";

    msg.textContent =
      "Please enter a valid mobile number.";

    return;

  }


  const total =
    cart.reduce(
      (sum,item)=>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 1),
      0
    );


  msg.style.color = "#2874f0";
  msg.textContent =
    "Placing your order...";


  try{

    const order = {

      customerId: currentUser.uid,

      customer: {
        name: name,
        phone: phone,
        address: address
      },

      items: cart.map(item => ({

        productId: item.id || "",

        name: item.name || "Product",

        price: Number(item.price || 0),

        qty: Number(item.qty || 1),

        sellerId: item.sellerId || "",

        sellerName: item.sellerName || "",

        imageUrl:
          item.imageUrl ||
          item.image ||
          ""

      })),

      total: total,

      paymentMethod: "COD",

      status: "pending",

      createdAt: serverTimestamp()

    };


    const result =
      await addDoc(
        collection(db,"orders"),
        order
      );


    localStorage.setItem(
      "nexora_last_order",
      JSON.stringify({
        ...order,
        orderId: result.id,
        createdAt: new Date().toISOString()
      })
    );


    cart = [];

    saveCart();


    msg.style.color = "#16803c";

    msg.textContent =
      "Order placed successfully! Order ID: " +
      result.id;


    document.getElementById("custName").value = "";
    document.getElementById("custPhone").value = "";
    document.getElementById("custAddress").value = "";


    setTimeout(()=>{

      window.location.href =
        "index.html";

    },3000);


  }catch(error){

    console.error(error);

    msg.style.color = "#d32f2f";

    msg.textContent =
      "Order failed. Please try again.";

  }

}


onAuthStateChanged(auth,user=>{

  currentUser = user;

  const loginBox =
    document.getElementById("loginBox");


  if(user){

    loginBox.style.display = "none";

    const name =
      user.displayName || "";

    if(name &&
       !document.getElementById("custName").value){

      document.getElementById("custName").value =
        name;

    }

  }else{

    loginBox.style.display = "block";

  }

});


renderCart();

</script>

</body>
  </html>
