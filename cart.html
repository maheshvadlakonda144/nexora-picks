<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>My Cart | NEXORA PICKS</title>


<style>

*{
  box-sizing:border-box;
}


body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}


header{
  background:#2874f0;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:15px;
  position:sticky;
  top:0;
  z-index:10;
}


header a{
  color:white;
  text-decoration:none;
  font-size:28px;
  line-height:1;
}


header h1{
  margin:0;
  font-size:24px;
}


.container{
  max-width:900px;
  margin:20px auto;
  padding:0 14px;
}


.cart-box{
  background:white;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 8px #ddd;
}


.cart-title{
  margin-top:0;
}


.cart-item{
  display:flex;
  gap:15px;
  padding:16px 0;
  border-bottom:1px solid #eee;
}


.image-box{
  width:110px;
  height:110px;
  flex-shrink:0;
  background:#f7f7f7;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}


.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}


.fallback{
  font-size:45px;
}


.item-info{
  flex:1;
  min-width:0;
}


.item-name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
  line-height:1.3;
}


.item-price{
  color:#111;
  font-size:18px;
  font-weight:bold;
}


.seller{
  font-size:14px;
  color:#666;
  margin-top:5px;
}


.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}


.qty button{
  width:34px;
  height:34px;
  border:1px solid #ccc;
  background:white;
  border-radius:6px;
  font-size:20px;
  cursor:pointer;
}


.qty button:disabled{
  opacity:.5;
  cursor:not-allowed;
}


.qty-number{
  min-width:25px;
  text-align:center;
}


.remove{
  margin-top:10px;
  border:0;
  background:none;
  color:#d32f2f;
  font-weight:bold;
  cursor:pointer;
  padding:0;
}


.summary{
  margin-top:20px;
  padding-top:15px;
  border-top:2px solid #eee;
}


.row{
  display:flex;
  justify-content:space-between;
  margin:12px 0;
  font-size:17px;
}


.total{
  font-size:24px;
  font-weight:bold;
}


.checkout{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:8px;
  background:#ff6d00;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}


.empty{
  text-align:center;
  padding:60px 20px;
}


.empty h2{
  font-size:25px;
}


.shop{
  display:inline-block;
  margin-top:15px;
  padding:14px 25px;
  background:#2874f0;
  color:white;
  text-decoration:none;
  border-radius:7px;
  font-weight:bold;
}


.stock-warning{
  color:#d32f2f;
  font-size:13px;
  margin-top:6px;
  font-weight:bold;
}


@media(max-width:600px){

  header{
    padding:13px;
  }


  header h1{
    font-size:20px;
  }


  .cart-box{
    padding:14px;
  }


  .cart-item{
    gap:10px;
  }


  .image-box{
    width:90px;
    height:90px;
  }


  .item-name{
    font-size:17px;
  }


  .item-price{
    font-size:16px;
  }


  .qty{
    gap:7px;
  }


  .qty button{
    width:32px;
    height:32px;
  }

}

</style>

</head>


<body>


<header>

  <a href="index.html">
    ‹
  </a>

  <h1>
    NEXORA PICKS
  </h1>

</header>



<div class="container">


  <div class="cart-box">


    <h2 class="cart-title">
      🛒 My Cart
    </h2>


    <div id="cartItems"></div>


    <div id="summary"></div>


  </div>


</div>



<script>


/* =========================
   CART KEY
========================= */

const CART_KEY =
  "nexora_cart";



/* =========================
   GET CART
========================= */

function getCart(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem(
          CART_KEY
        ) || "[]"
      );


    if(!Array.isArray(cart)){

      return [];

    }


    return cart;

  }catch(error){

    return [];

  }

}



/* =========================
   SAVE CART
========================= */

function saveCart(cart){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}



/* =========================
   MONEY
========================= */

function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =========================
   IMAGE
   SUPPORTS imageUrl + image
========================= */

function imageHTML(item){


  const image =
    item.imageUrl ||
    item.image ||
    "";


  const emoji =
    item.emoji ||
    "🛍️";



  if(image){

    return `

      <div class="image-box">

        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(
            item.name || "Product"
          )}"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <div
          class="fallback"
          style="display:none"
        >
          ${escapeHTML(emoji)}
        </div>

      </div>

    `;

  }



  return `

    <div class="image-box">

      <div class="fallback">

        ${escapeHTML(emoji)}

      </div>

    </div>

  `;

}



/* =========================
   RENDER CART
========================= */

function renderCart(){


  const cart =
    getCart();


  const box =
    document.getElementById(
      "cartItems"
    );


  const summary =
    document.getElementById(
      "summary"
    );



  /* EMPTY CART */

  if(!cart.length){


    box.innerHTML = `

      <div class="empty">

        <div style="font-size:60px">
          🛒
        </div>

        <h2>
          Your cart is empty
        </h2>

        <p>
          Add products from
          NEXORA PICKS
          to see them here.
        </p>

        <a
          class="shop"
          href="index.html"
        >
          Continue Shopping
        </a>

      </div>

    `;


    summary.innerHTML = "";


    return;

  }



  let subtotal = 0;



  box.innerHTML =

    cart.map(
      (item,index) => {


        const price =
          Number(item.price) || 0;


        const qty =
          Math.max(
            1,
            Number(item.qty) || 1
          );


        const stock =
          Number(item.stock) || 0;


        const total =
          price * qty;


        subtotal +=
          total;



        const atStockLimit =
          stock > 0 &&
          qty >= stock;



        return `

          <div class="cart-item">


            ${imageHTML(item)}


            <div class="item-info">


              <div class="item-name">

                ${escapeHTML(
                  item.name ||
                  "Product"
                )}

              </div>



              <div class="item-price">

                ${money(price)}

              </div>



              <div class="seller">

                Seller:
                ${escapeHTML(
                  item.sellerName ||
                  "NEXORA Seller"
                )}

              </div>



              ${
                stock > 0
                ?
                `
                <div
                  style="
                    font-size:13px;
                    color:#188038;
                    margin-top:5px;
                  "
                >
                  ${stock} available
                </div>
                `
                :
                ""
              }



              <div class="qty">


                <button
                  onclick="changeQty(${index},-1)"
                  aria-label="Decrease quantity"
                >
                  −
                </button>



                <b class="qty-number">

                  ${qty}

                </b>



                <button
                  onclick="changeQty(${index},1)"
                  ${atStockLimit ? "disabled" : ""}
                  aria-label="Increase quantity"
                >
                  +
                </button>


              </div>



              ${
                atStockLimit
                ?
                `
                <div class="stock-warning">
                  Maximum available quantity reached
                </div>
                `
                :
                ""
              }



              <button
                class="remove"
                onclick="removeItem(${index})"
              >
                Remove
              </button>


            </div>


          </div>

        `;

      }
    ).join("");



  /* =========================
     SUMMARY
  ========================= */

  summary.innerHTML = `

    <div class="summary">


      <div class="row">

        <span>
          Subtotal
        </span>

        <b>
          ${money(subtotal)}
        </b>

      </div>



      <div class="row">

        <span>
          Delivery
        </span>

        <b>
          FREE
        </b>

      </div>



      <div class="row total">

        <span>
          Total
        </span>

        <span>
          ${money(subtotal)}
        </span>

      </div>



      <button
        class="checkout"
        onclick="checkout()"
      >

        Continue to Checkout

      </button>


    </div>

  `;

}



/* =========================
   CHANGE QUANTITY
========================= */

function changeQty(index,change){


  const cart =
    getCart();


  if(!cart[index]){

    return;

  }



  let qty =
    Number(
      cart[index].qty
    ) || 1;



  const stock =
    Number(
      cart[index].stock
    ) || 0;



  qty += change;



  if(qty <= 0){

    cart.splice(
      index,
      1
    );

  }else{


    /* STOCK LIMIT */

    if(
      stock > 0 &&
      qty > stock
    ){

      qty =
        stock;


      alert(
        "Maximum available stock is " +
        stock
      );

    }



    cart[index].qty =
      qty;

  }



  saveCart(cart);

  renderCart();

}



/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){


  const cart =
    getCart();


  if(!cart[index]){

    return;

  }



  cart.splice(
    index,
    1
  );


  saveCart(cart);

  renderCart();

}



/* =========================
   CHECKOUT
========================= */

function checkout(){


  const cart =
    getCart();


  if(!cart.length){

    alert(
      "Your cart is empty."
    );

    return;

  }



  window.location.href =
    "checkout.html";

}



/* =========================
   START
========================= */

renderCart();


</script>


</body>

</html>
