<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Checkout | NEXORA PICKS</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

header{
background:#2874f0;
color:white;
padding:18px;
font-size:22px;
font-weight:bold;
}

header a{
color:white;
text-decoration:none;
margin-right:15px;
}

.wrap{
max-width:700px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:14px;
margin-bottom:18px;
box-shadow:0 2px 10px #00000012;
}

h2{
margin-top:0;
}

.item{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #eee;
}

.total{
font-size:22px;
font-weight:bold;
display:flex;
justify-content:space-between;
padding-top:15px;
}

input,
textarea{
width:100%;
padding:13px;
margin:7px 0;
border:1px solid #ccd3dd;
border-radius:7px;
font-size:16px;
}

button{
width:100%;
border:0;
background:#2874f0;
color:white;
padding:14px;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.error{
color:#d32f2f;
font-weight:bold;
}

.success{
color:#16803c;
font-weight:bold;
}

.empty{
text-align:center;
padding:30px;
}

</style>

</head>

<body>

<header>

<a href="index.html">
‹
</a>

🛒 Checkout

</header>


<div class="wrap">


<div class="box">

<h2>
🛍️ Your Order
</h2>

<div id="items">

Loading...

</div>


<div
class="total"
id="total">

</div>

</div>


<div class="box">

<h2>
📍 Delivery Details
</h2>


<input
id="cname"
placeholder="Full Name"
required>


<input
id="phone"
type="tel"
placeholder="Mobile Number"
required>


<textarea
id="address"
rows="5"
placeholder="House / Street / Area / City / State / PIN"
required>
</textarea>


<h3>
💵 Payment Method
</h3>


<p>
Cash on Delivery (COD)
</p>


<button
id="placeOrderBtn"
onclick="placeOrder()">

📦 Place Order

</button>


<p id="msg"></p>

</div>


</div>


<script type="module">


import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{
getFirestore,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:
"nexora-picks-e887f.firebaseapp.com",

projectId:
"nexora-picks-e887f",

storageBucket:
"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:
"621359003619",

appId:
"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:
"G-LSMJ6QLLPW"

};


const app=
initializeApp(firebaseConfig);


const auth=
getAuth(app);


const db=
getFirestore(app);


const $=
id=>
document.getElementById(id);


let cart=

JSON.parse(

localStorage.getItem(
"nexora_cart"
)

||

"[]"

);


/* RENDER ORDER */

function renderOrder(){


if(!cart.length){


$("items").innerHTML=

`

<div class="empty">

<h3>
🛒 Your cart is empty
</h3>

<p>
Please add products first.
</p>

</div>

`;


$("total").innerHTML=
"";


return;

}


$("items").innerHTML=

cart.map(

item=>`

<div class="item">

<div>

<b>

${escapeHtml(
item.name
)}

</b>

<br>

₹${

Number(
item.price
)

}

×


${

Number(
item.qty
)

}

</div>


<b>

₹${

Number(
item.price
)

*

Number(
item.qty
)

}

</b>

</div>

`

)

.join("");


const total=

cart.reduce(

(sum,item)=>

sum+

(

Number(
item.price
)

*

Number(
item.qty
)

),

0

);


$("total").innerHTML=

`

<span>
Total
</span>

<span>
₹${total}
</span>

`;

}


/* CHECK LOGIN */

onAuthStateChanged(

auth,

user=>{


if(!user){


$("msg").innerHTML=

`

<span class="error">

Please login before placing an order.

</span>

`;


setTimeout(

()=>{

window.location.href=
"index.html";

},

1500

);


}

}

);


/* PLACE ORDER */

window.placeOrder=

async()=>{


const user=
auth.currentUser;


if(!user){


alert(
"Please login first."
);


window.location.href=
"index.html";


return;

}


if(!cart.length){


alert(
"Your cart is empty."
);


return;

}


const name=

$("cname")
.value
.trim();


const phone=

$("phone")
.value
.trim();


const address=

$("address")
.value
.trim();


const msg=
$("msg");


const placeOrderBtn=
$("placeOrderBtn");


if(

!name

||

!phone

||

!address

){


msg.innerHTML=

`

<span class="error">

Please fill all delivery details.

</span>

`;


return;

}


/* CHECK SELLER IDs */

const invalidProduct=

cart.find(

item=>

!item.sellerId

);


if(invalidProduct){


msg.innerHTML=

`

<span class="error">

❌ This product is not connected to a seller. Please remove it and try again.

</span>

`;


return;

}


const total=

cart.reduce(

(sum,item)=>

sum+

(

Number(
item.price
)

*

Number(
item.qty
)

),

0

);


/* PREVENT DOUBLE CLICK */

placeOrderBtn.disabled=
true;


placeOrderBtn.textContent=
"Placing Order...";


try{


msg.innerHTML=

"Placing your order...";


/* CREATE CUSTOMER ORDER */

const customerOrderRef=

await addDoc(

collection(
db,
"orders"
),

{


/* CUSTOMER */

customerId:
user.uid,


customerName:
name,


customerPhone:
phone,


deliveryAddress:
address,


/* PRODUCTS */

items:

cart.map(

item=>
({

productId:
item.id,


name:
item.name,


price:
Number(
item.price
),


qty:
Number(
item.qty
),


sellerId:
item.sellerId

})

),


/* SELLERS */

sellerIds:

[

...new Set(

cart.map(

item=>
item.sellerId

)

)

],


/* TOTAL */

total:
total,


/* PAYMENT */

paymentMethod:
"COD",


paymentStatus:
"pending",


/* STATUS */

status:
"pending",


/* DATE */

createdAt:
serverTimestamp()

}

);


/* GROUP PRODUCTS BY SELLER */

const sellerGroups=
{};


cart.forEach(

item=>{


const sellerId=
item.sellerId;


if(

!sellerGroups[
sellerId
]

){


sellerGroups[
sellerId
]=
[];

}


sellerGroups[
sellerId
].push(

{

productId:
item.id,


name:
item.name,


price:
Number(
item.price
),


qty:
Number(
item.qty
)

}

);


}

);


/* CREATE SEPARATE SELLER ORDERS */

for(

const sellerId

in

sellerGroups

){


const sellerItems=

sellerGroups[
sellerId
];


const sellerTotal=

sellerItems.reduce(

(sum,item)=>

sum+

(

Number(
item.price
)

*

Number(
item.qty
)

),

0

);


await addDoc(

collection(
db,
"sellerOrders"
),

{


/* LINK TO CUSTOMER ORDER */

customerOrderId:
customerOrderRef.id,


/* SELLER */

sellerId:
sellerId,


/* CUSTOMER */

customerId:
user.uid,


customerName:
name,


customerPhone:
phone,


deliveryAddress:
address,


/* PRODUCTS FOR THIS SELLER ONLY */

items:
sellerItems,


/* SELLER ORDER TOTAL */

total:
sellerTotal,


/* PAYMENT */

paymentMethod:
"COD",


paymentStatus:
"pending",


/* DELIVERY STATUS */

status:
"pending",


/* DATE */

createdAt:
serverTimestamp()

}

);


}


/* CLEAR CART */

cart=
[];


localStorage.setItem(

"nexora_cart",

JSON.stringify(
cart
)

);


/* SUCCESS */

msg.innerHTML=

`

<span class="success">

✅ Order placed successfully!

</span>

`;


setTimeout(

()=>{


window.location.href=
"my-orders.html";


},

1500

);


}catch(error){


console.error(
error
);


msg.innerHTML=

`

<span class="error">

❌ ${escapeHtml(
error.message
)}

</span>

`;


placeOrderBtn.disabled=
false;


placeOrderBtn.textContent=
"📦 Place Order";

}

};


/* ESCAPE HTML */

function escapeHtml(
value
){

return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* START */

renderOrder();


</script>

</body>

</html>
