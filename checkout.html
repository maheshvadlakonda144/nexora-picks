<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - NEXORA PICKS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f1f3f6;
  color:#222;
  font-family:Arial,Helvetica,sans-serif;
}

.header{
  background:#2874f0;
  color:#fff;
  padding:18px 16px;
  font-size:26px;
  font-weight:900;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px 14px 40px;
}

.back{
  display:inline-block;
  color:#2874f0;
  font-size:18px;
  font-weight:bold;
  text-decoration:none;
  margin-bottom:15px;
}

.card{
  background:#fff;
  border-radius:10px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 2px 8px #00000015;
}

h2{
  margin:0 0 18px;
  font-size:23px;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #cfd5dd;
  border-radius:6px;
  font-size:16px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#2874f0;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.itemName{
  font-size:17px;
  font-weight:bold;
}

.itemInfo{
  color:#666;
  font-size:14px;
  margin-top:5px;
}

.itemPrice{
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  font-size:17px;
}

.total{
  border-top:1px solid #ddd;
  margin-top:8px;
  padding-top:15px;
  font-size:22px;
  font-weight:900;
}

.cod{
  border:2px solid #2874f0;
  border-radius:8px;
  padding:16px;
  background:#f7fbff;
}

.codTitle{
  font-size:18px;
  font-weight:bold;
}

.codText{
  color:#666;
  margin-top:6px;
}

.place{
  width:100%;
  border:0;
  border-radius:7px;
  padding:16px;
  background:#ff9f00;
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.place:disabled{
  background:#999;
}

.message{
  display:none;
  padding:15px;
  border-radius:7px;
  margin-bottom:15px;
  background:#fff3cd;
  color:#795600;
  font-weight:bold;
}

.success{
  display:none;
  text-align:center;
}

.successIcon{
  font-size:55px;
}

.successButton{
  display:block;
  margin-top:18px;
  padding:14px;
  background:#2874f0;
  color:#fff;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){

  .header{
    font-size:23px;
  }

  .card{
    padding:16px;
  }

}
</style>
</head>

<body>

<div class="header">
  NEXORA PICKS
</div>

<div class="container">

<a href="cart.html" class="back">
  ← Back to Cart
</a>

<div id="loginMessage" class="message">
  🔐 Please login before placing your order.
</div>


<!-- DELIVERY ADDRESS -->

<div class="card">

<h2>📍 Delivery Address</h2>

<label>Full Name</label>
<input
  id="name"
  type="text"
  placeholder="Enter your full name"
>

<label>Mobile Number</label>
<input
  id="mobile"
  type="tel"
  inputmode="numeric"
  maxlength="10"
  placeholder="Enter 10-digit mobile number"
>

<label>House / Flat / Building</label>
<input
  id="house"
  type="text"
  placeholder="House / Flat / Building"
>

<label>Street / Area</label>
<input
  id="street"
  type="text"
  placeholder="Street / Area"
>

<label>Village / Town / City</label>
<input
  id="city"
  type="text"
  placeholder="Village / Town / City"
>

<label>State</label>
<input
  id="state"
  type="text"
  placeholder="State"
>

<label>PIN Code</label>
<input
  id="pincode"
  type="tel"
  inputmode="numeric"
  placeholder="6-digit PIN code"
>
  </div>

<!-- ORDER SUMMARY -->
<div class="card">
    <h2>🛒 Order Summary</h2>

    <div class="summary-row">
        <span>Subtotal</span>
        <strong id="subtotal">₹0</strong>
    </div>

    <div class="summary-row">
        <span>Delivery</span>
        <strong>FREE</strong>
    </div>

    <hr>

    <div class="summary-row total">
        <strong>Total</strong>
        <strong id="total">₹0</strong>
    </div>
</div>

<!-- PAYMENT METHOD -->
<div class="card">
    <h2>💳 Payment Method</h2>

    <div class="payment-option selected">
        💵 <strong>Cash on Delivery</strong>
        <br>
        <span>Pay when your order is delivered.</span>
    </div>
</div>

<!-- PLACE ORDER BUTTON -->
<button class="place-order" onclick="placeOrder()">
    🛍️ Place Order
</button>

</div>
  <script>
function placeOrder() {
    alert("Your order has been placed successfully!");
}
</script>

</body>
</html>
