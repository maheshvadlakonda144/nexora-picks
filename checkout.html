<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | NEXORA PICKS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:18px;
  font-size:25px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:10;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 14px 40px;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#2874f0;
  text-decoration:none;
  font-size:20px;
  font-weight:bold;
}

.box{
  background:white;
  border-radius:15px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 2px 10px #ddd;
}

h2{
  margin-top:0;
  font-size:28px;
}

label{
  display:block;
  font-size:18px;
  font-weight:bold;
  margin-top:18px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:16px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:10px;
}

.cart-product{
  display:flex;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-product img{
  width:80px;
  height:80px;
  object-fit:contain;
  background:#f7f7f7;
  border-radius:8px;
}

.product-info{
  flex:1;
}

.product-name{
  font-size:18px;
  font-weight:bold;
}

.product-price{
  margin-top:8px;
  font-size:17px;
  font-weight:bold;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:14px 0;
  font-size:19px;
}

.total{
  font-size:27px;
  font-weight:bold;
  border-top:2px solid #ddd;
  padding-top:15px;
}

.payment{
  font-size:20px;
  margin-top:10px;
}

.payment strong{
  display:block;
  margin-bottom:5px;
}

.checkout-btn{
  width:100%;
  padding:17px;
  border:0;
  border-radius:10px;
  background:#ff6d00;
  color:white;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

.checkout-btn:active{
  transform:scale(0.98);
}

.empty{
  text-align:center;
  padding:30px;
}

@media(max-width:600px){

  h2{
    font-size:25px;
  }

}

</style>
</head>

<body>

<header>
  NEXORA PICKS
</header>

<div class="container">

<a href="cart.html" class="back">
← Back to Cart
</a>


<div class="box">

<h2>📍 Delivery Address</h2>

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your full name">

<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter 10-digit mobile number">

<label>House / Flat / Building</label>
<input type="text" id="house" placeholder="House / Flat / Building">

<label>Street / Area</label>
<input type="text" id="street" placeholder="Street / Area">

<label>Village / Town / City</label>
<input type="text" id="city" placeholder="Village / Town / City">

<label>State</label>
<input type="text" id="state" placeholder="State">

<label>PIN Code</label>
<input type="text" id="pincode" placeholder="6-digit PIN code">

</div>


<div class="box">

<h2>🛒 Order Summary</h2>

<div id="orderItems"></div>

<div class="row">
<span>Subtotal</span>
<strong id="subtotal">₹0</strong>
</div>

<div class="row">
<span>Delivery</span>
<strong>FREE</strong>
</div>

<div class="row total">
<span>Total</span>
<span id="total">₹0</span>
</div>

</div>


<div class="box">

<h2>💳 Payment Method</h2>

<div class="payment">

<strong>💵 Cash on Delivery</strong>

<span>Pay when your order is delivered.</span>

</div>

</div>


<button class="checkout-btn" onclick="placeOrder()">
🛒 Proceed to Checkout
</button>

</div>


<script>

const CART_KEY = "nexora_cart";


function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem(CART_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}


function money(value){

  return "₹" +
  Number(value || 0).toLocaleString("en-IN");

}


function escapeHTML(value){

  return String(value ?? "")

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function renderOrder(){

  const cart = getCart();

  const orderItems =
  document.getElementById("orderItems");

  let subtotal = 0;


  if(!cart.length){

    orderItems.innerHTML = `

      <div class="empty">

        <p>Your cart is empty.</p>

        <a href="index.html">
        Continue Shopping
        </a>

      </div>

    `;

    document.getElementById("subtotal")
    .textContent = "₹0";

    document.getElementById("total")
    .textContent = "₹0";

    return;

  }


  orderItems.innerHTML =
  cart.map(item => {


    const price =
    Number(item.price) || 0;


    const qty =
    Number(item.qty) || 1;


    const itemTotal =
    price * qty;


    subtotal += itemTotal;


    let image = "";


    if(item.imageUrl){

      image = `

        <img
        src="${escapeHTML(item.imageUrl)}"
        alt="${escapeHTML(item.name)}"
        >

      `;

    }else{

      image = `

        <div style="
        width:80px;
        height:80px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:40px;
        background:#f7f7f7;
        border-radius:8px;
        ">

        ${item.emoji || "🛍️"}

        </div>

      `;

    }


    return `

      <div class="cart-product">

        ${image}

        <div class="product-info">

          <div class="product-name">

            ${escapeHTML(
              item.name || "Product"
            )}

          </div>


          <div style="
          color:#666;
          margin-top:5px
          ">

            Quantity: ${qty}

          </div>


          <div class="product-price">

            ${money(itemTotal)}

          </div>

        </div>

      </div>

    `;

  }).join("");


  document.getElementById("subtotal")
  .textContent =
  money(subtotal);


  document.getElementById("total")
  .textContent =
  money(subtotal);

}


function placeOrder(){


  const cart = getCart();


  if(!cart.length){

    alert("Your cart is empty.");

    window.location.href =
    "index.html";

    return;

  }


  const name =
  document.getElementById("name").value.trim();


  const mobile =
  document.getElementById("mobile").value.trim();


  const house =
  document.getElementById("house").value.trim();


  const city =
  document.getElementById("city").value.trim();


  const state =
  document.getElementById("state").value.trim();


  const pincode =
  document.getElementById("pincode").value.trim();


  if(
    !name ||
    !mobile ||
    !house ||
    !city ||
    !state ||
    !pincode
  ){

    alert(
      "Please fill all required address details."
    );

    return;

  }


  if(
    !/^[0-9]{10}$/.test(mobile)
  ){

    alert(
      "Please enter a valid 10-digit mobile number."
    );

    return;

  }


  if(
    !/^[0-9]{6}$/.test(pincode)
  ){

    alert(
      "Please enter a valid 6-digit PIN code."
    );

    return;

  }


  const order = {

  orderId:

  "NEXORA" +
  Date.now(),

  cart:

  cart,

  address:{

    name:name,

    mobile:mobile,

    house:house,

    street:

    document.getElementById(
      "street"
    ).value.trim(),

    city:city,

    state:state,

    pincode:pincode

  }

};


localStorage.setItem(

  "nexora_last_order",

  JSON.stringify(order)

);


localStorage.removeItem(
  CART_KEY
);


window.location.href =
"order-success.html";

}


renderOrder();

</script>

</body>
</html>
