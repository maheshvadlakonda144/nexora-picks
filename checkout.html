<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | NEXORA PICKS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:18px;
  font-size:25px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:10;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 14px 40px;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#2874f0;
  text-decoration:none;
  font-size:20px;
  font-weight:bold;
}

.box{
  background:white;
  border-radius:15px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 2px 10px #ddd;
}

h2{
  margin-top:0;
  font-size:28px;
}

label{
  display:block;
  font-size:18px;
  font-weight:bold;
  margin-top:18px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:16px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:10px;
}

.order-item{
  display:flex;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.order-item img{
  width:110px;
  height:110px;
  object-fit:contain;
  border-radius:10px;
  background:#f7f7f7;
}

.item-info{
  flex:1;
}

.item-name{
  font-size:20px;
  font-weight:bold;
}

.item-qty{
  margin-top:8px;
  color:#666;
  font-size:18px;
}

.item-price{
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  font-size:20px;
}

.total{
  border-top:2px solid #ddd;
  padding-top:18px;
  font-size:28px;
  font-weight:bold;
}

.payment{
  font-size:22px;
  font-weight:bold;
  margin-bottom:10px;
}

.payment-text{
  font-size:18px;
  color:#555;
}

.checkout{
  width:100%;
  padding:18px;
  border:0;
  border-radius:12px;
  background:#ff6d00;
  color:white;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.checkout:active{
  transform:scale(0.98);
}

.empty{
  text-align:center;
  padding:30px;
  font-size:20px;
  color:#666;
}

</style>

</head>


<body>

<header>
  NEXORA PICKS
</header>


<div class="container">

<a href="cart.html" class="back">
  ← Back to Cart
</a>


<div class="box">

<h2>📍 Delivery Address</h2>


<label>Full Name</label>

<input
  type="text"
  id="name"
  placeholder="Enter your full name"
>


<label>Mobile Number</label>

<input
  type="tel"
  id="mobile"
  placeholder="Enter 10-digit mobile number"
  maxlength="10"
>


<label>House / Flat / Building</label>

<input
  type="text"
  id="house"
  placeholder="House / Flat / Building"
>


<label>Street / Area</label>

<input
  type="text"
  id="street"
  placeholder="Street / Area"
>


<label>Village / Town / City</label>

<input
  type="text"
  id="city"
  placeholder="Village / Town / City"
>


<label>State</label>

<input
  type="text"
  id="state"
  placeholder="State"
>


<label>PIN Code</label>

<input
  type="tel"
  id="pincode"
  placeholder="6-digit PIN code"
  maxlength="6"
>

</div>


<div class="box">

<h2>🛒 Order Summary</h2>

<div id="orderItems"></div>

<div id="summary"></div>

</div>


<div class="box">

<h2>💳 Payment Method</h2>

<div class="payment">
  💵 Cash on Delivery
</div>

<div class="payment-text">
  Pay when your order is delivered.
</div>

</div>


<button
  class="checkout"
  onclick="placeOrder()"
>
  🛒 Proceed to Checkout
</button>


</div>


<script>

/* CART STORAGE KEY */

const CART_KEY = "nexora_cart";


/* GET CART */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem(CART_KEY)
    ) || [];

  }catch(error){

    return [];

  }

}


/* FORMAT MONEY */

function money(amount){

  return "₹" +
  Number(amount || 0)
  .toLocaleString("en-IN");

}


/* ESCAPE HTML */

function escapeHTML(text){

  const div =
  document.createElement("div");

  div.textContent =
  String(text || "");

  return div.innerHTML;

}


/* RENDER ORDER */

function renderOrder(){

  const cart =
  getCart();


  const orderItems =
  document.getElementById(
    "orderItems"
  );


  const summary =
  document.getElementById(
    "summary"
  );


  if(!cart.length){

    orderItems.innerHTML =
    `
      <div class="empty">
        Your cart is empty.
      </div>
    `;


    summary.innerHTML = "";

    return;

  }


  let subtotal = 0;


  orderItems.innerHTML =
  cart.map(function(item){

    const qty =
    Number(item.qty) || 1;


    const price =
    Number(item.price) || 0;


    const total =
    price * qty;


    subtotal += total;


    return `

      <div class="order-item">

        <img
          src="${escapeHTML(item.image || '')}"
          alt="${escapeHTML(item.name || 'Product')}"
        >


        <div class="item-info">

          <div class="item-name">

            ${escapeHTML(
              item.name || "Product"
            )}

          </div>


          <div class="item-qty">

            Quantity: ${qty}

          </div>


          <div class="item-price">

            ${money(total)}

          </div>


        </div>

      </div>

    `;

  }).join("");


  summary.innerHTML =
  `

    <div class="summary-row">

      <span>Subtotal</span>

      <b>${money(subtotal)}</b>

    </div>


    <div class="summary-row">

      <span>Delivery</span>

      <b>FREE</b>

    </div>


    <div class="summary-row total">

      <span>Total</span>

      <span>${money(subtotal)}</span>

    </div>

  `;

}


/* PLACE ORDER */

function placeOrder(){

  const cart =
  getCart();


  if(!cart.length){

    alert(
      "Your cart is empty."
    );

    window.location.href =
    "cart.html";

    return;

  }


  const name =
  document
  .getElementById("name")
  .value
  .trim();


  const mobile =
  document
  .getElementById("mobile")
  .value
  .trim();


  const house =
  document
  .getElementById("house")
  .value
  .trim();


  const street =
  document
  .getElementById("street")
  .value
  .trim();


  const city =
  document
  .getElementById("city")
  .value
  .trim();


  const state =
  document
  .getElementById("state")
  .value
  .trim();


  const pincode =
  document
  .getElementById("pincode")
  .value
  .trim();


  /* CHECK REQUIRED DETAILS */

  if(

    !name ||
    !mobile ||
    !house ||
    !city ||
    !state ||
    !pincode

  ){

    alert(
      "Please fill all required address details."
    );

    return;

  }


  /* MOBILE VALIDATION */

  if(

    !/^[0-9]{10}$/
    .test(mobile)

  ){

    alert(
      "Please enter a valid 10-digit mobile number."
    );

    return;

  }


  /* PIN CODE VALIDATION */

  if(

    !/^[0-9]{6}$/
    .test(pincode)

  ){

    alert(
      "Please enter a valid 6-digit PIN code."
    );

    return;

  }


  /* CALCULATE TOTAL */

  let subtotal = 0;


  cart.forEach(function(item){

    const price =
    Number(item.price) || 0;


    const qty =
    Number(item.qty) || 1;


    subtotal +=
    price * qty;

  });


  /* CREATE ORDER */

  const order = {

    orderId:

    "NEXORA" +
    Date.now(),


    cart:

    cart,


    subtotal:

    subtotal,


    total:

    subtotal,


    paymentMethod:

    "Cash on Delivery",


    address:{

      name:name,

      mobile:mobile,

      house:house,

      street:street,

      city:city,

      state:state,

      pincode:pincode

    }

  };


  /* SAVE ORDER */

  localStorage.setItem(

    "nexora_last_order",

    JSON.stringify(order)

  );


  /* CLEAR CART */

  localStorage.removeItem(
    CART_KEY
  );


  /* REDIRECT TO SUCCESS PAGE */

  window.location.href =
  "order-success.html";

}


/* SHOW ORDER */

renderOrder();


</script>


</body>

</html>
