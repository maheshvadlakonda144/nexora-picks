<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyCPpol_Dmj3yTph_PBG59IbwtUqSpbAqwY",
  authDomain: "nexora-picks-be049.firebaseapp.com",
  projectId: "nexora-picks-be049",
  storageBucket: "nexora-picks-be049.firebasestorage.app",
  messagingSenderId: "325932959084",
  appId: "1:325932959084:web:4fd8252e1ba83f82ee1f49",
  measurementId: "G-KMQZXZZCHJ"
};


/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* VARIABLES */

let products = [];

let cart =
JSON.parse(
  localStorage.getItem("nexora_cart")
  || "[]"
);

let signup = false;


/* SHORTCUT */

const $ = id =>
document.getElementById(id);


/* ESCAPE HTML */

const esc = v =>

String(v ?? "")

.replace(
/[&<>"']/g,

c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c])

);


/* AUTH */

window.openAuth = () => {

$("authModal")
.classList
.add("open");

};


window.closeAuth = () => {

$("authModal")
.classList
.remove("open");

};


window.toggleMode = () => {

signup = !signup;


$("authTitle").textContent =

signup
?
"Create customer account"
:
"Customer Login";


$("authBtn").textContent =

signup
?
"Create account"
:
"Login";


$("modeBtn").textContent =

signup
?
"Already have an account"
:
"Create customer account";


$("fullName")
.style
.display =

signup
?
"block"
:
"none";

};


/* LOGIN / SIGNUP */

window.authAction = async () => {

const m = $("authMsg");

m.textContent = "";


try {


if(signup){


const c =
await createUserWithEmailAndPassword(

auth,

$("email").value.trim(),

$("password").value

);


const n =
$("fullName")
.value
.trim();


if(n){

await updateProfile(
c.user,
{
displayName:n
}
);

}


}else{


await signInWithEmailAndPassword(

auth,

$("email").value.trim(),

$("password").value

);

}


closeAuth();


}catch(e){

m.textContent =
e.message;

}

};


/* AUTH STATE */

onAuthStateChanged(

auth,

u => {

$("account")
.textContent =

u
?
(u.displayName || "Account")
:
"Login";


$("account")
.onclick =

u
?
() => signOut(auth)
:
openAuth;

}

);


/* SAVE CART */

function save(){

localStorage.setItem(

"nexora_cart",

JSON.stringify(cart)

);

updateCount();

renderCart();

}


/* CART COUNT */

function updateCount(){

$("cartCount")
.textContent =

cart.reduce(

(s,x) =>
s + Number(x.qty || 0),

0

);

}


/* ADD TO CART */

window.addToCart = p => {


if(

!Number(p.price)

||

Number(p.stock) <= 0

){

alert(
"This product is not available for purchase."
);

return;

}


let x =

cart.find(
i => i.id === p.id
);


if(x){

x.qty++;

}else{


cart.push({

id:p.id,

name:p.name,

price:Number(p.price),

image:p.imageUrl || p.image || "",

emoji:p.emoji || "🛍️",

sellerId:p.sellerId || "",

qty:1

});

}


save();

alert(
"Added to cart ✓"
);

};


/* BUY NOW */

window.buyNow = p => {

addToCart(p);

openCart();

};


/* CHANGE QUANTITY */

window.changeQty = (id,d) => {


let x =

cart.find(
i => i.id === id
);


if(!x) return;


x.qty += d;


if(x.qty < 1){

cart =
cart.filter(
i => i.id !== id
);

}


save();

};


/* REMOVE */

window.removeItem = id => {

cart =
cart.filter(
i => i.id !== id
);

save();

};


/* MENU */

window.openMenu = () => {

$("drawer")
.classList
.add("open");

};


window.closeMenu = () => {

$("drawer")
.classList
.remove("open");

};


/* CART */

window.openCart = () => {

renderCart();

$("cartModal")
.classList
.add("open");

};


window.closeCart = () => {

$("cartModal")
.classList
.remove("open");

};


/* CHECKOUT */

window.goToCheckout = () => {


if(!cart.length){

alert(
"Your cart is empty."
);

return;

}


closeCart();

window.location.href =
"checkout.html";

};


/* RENDER CART */

function renderCart(){

const box =
$("cartItems");

const foot =
$("cartFoot");


if(!cart.length){

box.innerHTML =
"<p>Your cart is empty.</p>";

foot.innerHTML =
"";

return;

}


box.innerHTML =

cart.map(
x => `

<div class="cartItem">

<div>

${
x.image

?

`<img src="${esc(x.image)}">`

:

`<div style="font-size:40px">
${esc(x.emoji || "🛍️")}
</div>`

}

</div>


<div>

<b>
${esc(x.name)}
</b>


<div>
₹${Number(x.price)}
</div>


<div class="qty">

<button
onclick="changeQty('${esc(x.id)}',-1)">
−
</button>


${Number(x.qty)}


<button
onclick="changeQty('${esc(x.id)}',1)">
+
</button>


<button
onclick="removeItem('${esc(x.id)}')">
Remove
</button>

</div>

</div>


<b>
₹${Number(x.price) * Number(x.qty)}
</b>

</div>

`

)

.join("");


let total =

cart.reduce(

(s,x) =>

s +
Number(x.price) *
Number(x.qty),

0

);


foot.innerHTML = `

<div class="total">

<span>
Total
</span>

<span>
₹${total}
</span>

</div>


<button
class="primary"
onclick="goToCheckout()">

🛒 Continue to Checkout

</button>

`;

}


/* RENDER PRODUCTS */

window.render = () => {


const searchBox =
$("search");


const sortBox =
$("sort");


const grid =
$("grid");


const count =
$("count");


let q =

searchBox.value
.toLowerCase()
.trim();


let sort =
sortBox.value;


let a =

products.filter(

p =>

[

p.name || "",

p.description || "",

p.category || ""

]

.join(" ")

.toLowerCase()

.includes(q)

);


a.sort(

(x,y) => {


if(sort === "az"){

return String(
x.name || ""
)

.localeCompare(

String(
y.name || ""
)

);

}


if(sort === "za"){

return String(
y.name || ""
)

.localeCompare(

String(
x.name || ""
)

);

}


return 0;

}

);


count.textContent =

a.length +

" product" +

(

a.length === 1

?

""

:

"s"

);


grid.innerHTML =

a.length

?

a.map(card).join("")

:

'<div class="empty">No products found.</div>';

};


/* PRODUCT CARD */

function card(p){

const img =
p.imageUrl || "";


const price =
Number(p.price) || 0;


const safeProduct =
encodeURIComponent(
JSON.stringify(p)
);


return `

<article class="card">


<div class="pic">


${

img

?

`<img
src="${esc(img)}"
onerror="
this.style.display='none'
">`

:

""

}


<span
class="emoji"

style="${
img
?
"display:none"
:
""
}"

>

${esc(p.emoji || "🛍️")}

</span>


</div>


<div class="info">


<div class="tag">

${esc(
p.category || "Featured"
)}

</div>


<div class="name">

${esc(
p.name || "Product"
)}

</div>


<div class="desc">

${esc(
p.description || ""
)}

</div>


<div class="price">

₹${price}

</div>


<div class="stock">

${Number(p.stock || 0)}

in stock

</div>


<button
class="details"

onclick="
location.href='product.html?id=${encodeURIComponent(p.id)}'
"

>

View Product

</button>


<div class="actions">


<button
class="add"
data-product="${safeProduct}">

🛒 Add

</button>


<button
class="buy"
data-product="${safeProduct}">

Buy Now

</button>


</div>

</div>

</article>

`;

}


/* PRODUCT BUTTONS */

document.addEventListener(

"click",

e => {


const addButton =
e.target.closest(".add");


const buyButton =
e.target.closest(".buy");


if(addButton){


try{


const product =

JSON.parse(

decodeURIComponent(

addButton.dataset.product

)

);


addToCart(product);


}catch(error){

console.error(error);

}

}


if(buyButton){


try{


const product =

JSON.parse(

decodeURIComponent(

buyButton.dataset.product

)

);


buyNow(product);


}catch(error){

console.error(error);

}

}

}

);


/* LOAD PRODUCTS FROM FIRESTORE */

$("count").textContent =
"Loading products...";


onSnapshot(

collection(
db,
"products"
),

snapshot => {


products =

snapshot.docs

.map(

doc => ({

id:doc.id,

...doc.data()

})

)

.filter(p => {

  const approved =
    p.approvalStatus === "approved" ||
    p.approvalStatus === undefined ||
    p.approvalStatus === null ||
    p.approvalStatus === "";

  const active =
    p.active !== false;

  return approved && active;

});
  
render();

},


error => {


console.error(
"Firestore error:",
error
);


$("count")
.textContent =

"Unable to load products.";


$("grid")
.innerHTML = `

<div class="empty">

<b>Products could not be loaded.</b>

<br><br>

Check your Firebase Firestore Rules
and make sure the "products"
collection exists.

</div>

`;

}

);


/* START */

updateCount();

  </script>
