<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Login | NEXORA PICKS</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.loginBox{
width:100%;
max-width:420px;
background:white;
border-radius:20px;
padding:30px 24px;
box-shadow:0 5px 25px #00000018
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#2874f0;
margin-bottom:10px
}

h1{
text-align:center;
font-size:25px;
margin:10px 0
}

.sub{
text-align:center;
color:#667085;
line-height:1.6;
margin-bottom:25px
}

label{
display:block;
font-weight:bold;
margin-bottom:8px
}

.phoneBox{
display:flex;
border:1px solid #cfd6e4;
border-radius:10px;
overflow:hidden;
margin-bottom:16px
}

.country{
padding:15px 12px;
background:#f4f6f9;
font-weight:bold;
border-right:1px solid #ddd
}

input{
width:100%;
border:0;
outline:0;
font-size:17px;
padding:15px
}

button{
width:100%;
border:0;
border-radius:10px;
padding:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#2874f0;
color:white
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

#otpSection{
display:none
}

.backBtn{
background:#eef2f7;
color:#172033;
margin-top:10px
}

.message{
margin-top:18px;
padding:12px;
border-radius:8px;
text-align:center;
display:none
}

.success{
background:#e8f5e9;
color:#16803c
}

.error{
background:#ffebee;
color:#c62828
}

.loading{
text-align:center;
margin-top:15px;
color:#667085;
display:none
}

#recaptcha-container{
margin-top:10px
}

</style>

</head>


<body>


<div class="loginBox">

<div class="logo">

🛍️ NEXORA PICKS

</div>


<div id="phoneSection">

<h1>Login or Signup</h1>

<p class="sub">

Enter your mobile number to receive a secure OTP.

</p>


<label>

Mobile Number

</label>


<div class="phoneBox">

<div class="country">

+91

</div>


<input
id="phoneNumber"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="Enter 10 digit mobile number">

</div>


<button
id="sendOtpBtn">

Send OTP

</button>


</div>



<div id="otpSection">

<h1>Verify OTP</h1>

<p class="sub">

We sent an OTP to your mobile number.

</p>


<label>

Enter OTP

</label>


<input
id="otp"
type="number"
inputmode="numeric"
maxlength="6"
placeholder="Enter 6 digit OTP"
style="
border:1px solid #cfd6e4;
border-radius:10px;
margin-bottom:16px;
">


<button
id="verifyOtpBtn">

Verify & Login

</button>


<button
class="backBtn"
id="changeNumberBtn">

Change Mobile Number

</button>


</div>


<div
id="message"
class="message">

</div>


<div
id="loading"
class="loading">

Please wait...

</div>


<div id="recaptcha-container">

</div>


</div>



<script type="module">


import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{
getAuth,
RecaptchaVerifier,
signInWithPhoneNumber,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};



const app=initializeApp(firebaseConfig);


const auth=getAuth(app);



let confirmationResult=null;

let recaptchaVerifier=null;



const phoneNumberInput=
document.getElementById("phoneNumber");


const otpInput=
document.getElementById("otp");


const sendOtpBtn=
document.getElementById("sendOtpBtn");


const verifyOtpBtn=
document.getElementById("verifyOtpBtn");


const changeNumberBtn=
document.getElementById("changeNumberBtn");


const phoneSection=
document.getElementById("phoneSection");


const otpSection=
document.getElementById("otpSection");


const message=
document.getElementById("message");


const loading=
document.getElementById("loading");



function showMessage(text,type){

message.innerHTML=text;

message.className=
"message "+type;

message.style.display="block";

}



function hideMessage(){

message.style.display="none";

}



function showLoading(){

loading.style.display="block";

}



function hideLoading(){

loading.style.display="none";

}



function setupRecaptcha(){

if(recaptchaVerifier){

return;

}


recaptchaVerifier=

new RecaptchaVerifier(

auth,

"recaptcha-container",

{

size:"invisible",

callback:()=>{

console.log(
"reCAPTCHA verified"
);

},

"expired-callback":()=>{

showMessage(

"Security verification expired. Please try again.",

"error"

);

}

}

);


recaptchaVerifier.render();

}



onAuthStateChanged(

auth,

user=>{

if(user){

location.href="index.html";

}

}

);



sendOtpBtn.addEventListener(

"click",

async()=>{


hideMessage();


let phone=

phoneNumberInput.value
.replace(/\D/g,"");


if(phone.length!==10){

showMessage(

"Please enter a valid 10 digit mobile number.",

"error"

);

return;

}


const fullPhoneNumber=

"+91"+phone;


try{


sendOtpBtn.disabled=true;

showLoading();


setupRecaptcha();


confirmationResult=

await signInWithPhoneNumber(

auth,

fullPhoneNumber,

recaptchaVerifier

);


phoneSection.style.display="none";

otpSection.style.display="block";


hideLoading();


showMessage(

"OTP sent successfully to +91 "+phone,

"success"

);


otpInput.focus();


}
catch(error){


console.error(
"OTP error:",
error
);


hideLoading();


sendOtpBtn.disabled=false;


showMessage(

error.message,

"error"

);


if(recaptchaVerifier){

recaptchaVerifier.clear();

recaptchaVerifier=null;

}


}

}

);



verifyOtpBtn.addEventListener(

"click",

async()=>{


hideMessage();


const otp=

otpInput.value
.trim();


if(otp.length!==6){

showMessage(

"Please enter the 6 digit OTP.",

"error"

);

return;

}


if(!confirmationResult){

showMessage(

"Please request a new OTP.",

"error"

);

return;

}


try{


verifyOtpBtn.disabled=true;

showLoading();


await confirmationResult.confirm(

otp

);


showMessage(

"Login successful! Redirecting...",

"success"

);


location.href="index.html";


}
catch(error){


console.error(
"OTP verification error:",
error
);


hideLoading();


verifyOtpBtn.disabled=false;


showMessage(

"Invalid OTP. Please check and try again.",

"error"

);


}

}

);



changeNumberBtn.addEventListener(

"click",

()=>{


otpSection.style.display="none";

phoneSection.style.display="block";


otpInput.value="";


confirmationResult=null;


hideMessage();


sendOtpBtn.disabled=false;


}

);


</script>


</body>

  </html>
