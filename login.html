<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Login | NEXORA PICKS</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.loginBox{
width:100%;
max-width:430px;
background:white;
border-radius:20px;
padding:30px 24px;
box-shadow:0 5px 25px #00000018
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#2874f0;
margin-bottom:10px
}

h1{
text-align:center;
font-size:25px;
margin:10px 0
}

.sub{
text-align:center;
color:#667085;
line-height:1.6;
margin-bottom:25px
}

.tabs{
display:flex;
background:#f1f3f6;
padding:5px;
border-radius:12px;
margin-bottom:25px
}

.tab{
width:50%;
border:0;
padding:12px;
background:transparent;
border-radius:9px;
font-weight:bold;
color:#667085;
cursor:pointer
}

.tab.active{
background:#2874f0;
color:white
}

.section{
display:none
}

.section.active{
display:block
}

label{
display:block;
font-weight:bold;
margin-bottom:8px
}

input{
width:100%;
padding:15px;
border:1px solid #cfd6e4;
border-radius:10px;
font-size:16px;
outline:none;
margin-bottom:15px
}

input:focus{
border-color:#2874f0
}

.phoneBox{
display:flex;
border:1px solid #cfd6e4;
border-radius:10px;
overflow:hidden;
margin-bottom:16px
}

.country{
padding:15px 10px;
background:#f4f6f9;
font-weight:bold;
border-right:1px solid #cfd6e4;
white-space:nowrap
}

.phoneBox input{
border:0;
margin:0;
border-radius:0
}

button{
font-size:16px;
cursor:pointer
}

.primary{
width:100%;
border:0;
background:#2874f0;
color:white;
padding:15px;
border-radius:10px;
font-weight:bold;
margin-top:5px
}

.primary:disabled{
opacity:.6;
cursor:not-allowed
}

.secondary{
width:100%;
border:1px solid #2874f0;
background:white;
color:#2874f0;
padding:14px;
border-radius:10px;
font-weight:bold;
margin-top:12px
}

.linkButton{
border:0;
background:none;
color:#2874f0;
font-size:15px;
font-weight:bold;
padding:5px;
cursor:pointer
}

.center{
text-align:center
}

.message{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:15px;
font-size:14px
}

.message.error{
display:block;
background:#fff0f0;
color:#d32f2f
}

.message.success{
display:block;
background:#edfff2;
color:#16833c
}

.divider{
display:flex;
align-items:center;
gap:10px;
margin:20px 0;
color:#98a2b3
}

.divider:before,
.divider:after{
content:"";
height:1px;
background:#e5e7eb;
flex:1
}

.loading{
display:none;
text-align:center;
margin-top:15px;
color:#667085
}

.otpInfo{
text-align:center;
line-height:1.6;
color:#667085;
margin-bottom:20px
}

#otpInput{
letter-spacing:8px;
text-align:center;
font-size:22px;
font-weight:bold
}

.backHome{
display:block;
text-align:center;
margin-top:20px;
color:#2874f0;
text-decoration:none;
font-weight:bold
}

@media(max-width:480px){

body{
padding:12px
}

.loginBox{
padding:25px 18px;
border-radius:16px
}

}

</style>

</head>

<body>

<div class="loginBox">

<div class="logo">
NEXORA PICKS
</div>

<h1>
Welcome
</h1>

<div class="sub">
Login or create an account to continue shopping.
</div>

<div class="tabs">

<button
class="tab active"
id="phoneTab">

📱 Phone

</button>

<button
class="tab"
id="emailTab">

📧 Email

</button>

</div>

<div
id="message"
class="message">

</div>


<!-- PHONE LOGIN -->

<div
id="phoneLogin"
class="section active">

<div
id="phoneSection">

<label>
Mobile Number
</label>

<div class="phoneBox">

<div class="country">
+91
</div>

<input
type="tel"
id="phoneNumber"
placeholder="Enter 10 digit mobile number"
maxlength="10"
inputmode="numeric">

</div>

<div
id="recaptcha-container">

</div>

<button
id="sendOtpBtn"
class="primary">

Send OTP

</button>

<div class="divider">

OR

</div>

<div class="center">

<button
class="linkButton"
id="switchEmail1">

Login with Email

</button>

</div>

</div>


<!-- OTP -->

<div
id="otpSection"
style="display:none">

<div class="otpInfo">

OTP sent to

<br>

<b id="otpPhone"></b>

</div>

<label>
Enter OTP
</label>

<input
type="text"
id="otpInput"
placeholder="------"
maxlength="6"
inputmode="numeric"
autocomplete="one-time-code">

<button
id="verifyOtpBtn"
class="primary">

Verify OTP & Login

</button>

<div
class="center"
style="margin-top:15px">

<button
class="linkButton"
id="changeNumberBtn">

Change Mobile Number

</button>

</div>

</div>

</div>


<!-- EMAIL LOGIN -->

<div
id="emailLogin"
class="section">

<div
id="emailLoginSection">

<label>
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email address"
autocomplete="email">

<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password">

<div
class="center"
style="margin-bottom:12px">

<button
class="linkButton"
id="forgotPasswordBtn">

Forgot Password?

</button>

</div>

<button
id="emailLoginBtn"
class="primary">

Login

</button>

<div class="divider">

OR

</div>

<button
id="createAccountBtn"
class="secondary">

Create New Account

</button>

<div
class="center"
style="margin-top:15px">

<button
class="linkButton"
id="switchPhone1">

Login with Mobile OTP

</button>

</div>

</div>


<!-- CREATE ACCOUNT -->

<div
id="createAccountSection"
style="display:none">

<h2
style="text-align:center">

Create Account

</h2>

<label>
Full Name
</label>

<input
type="text"
id="registerName"
placeholder="Enter your full name"
autocomplete="name">


<label>
Mobile Number
</label>

<div class="phoneBox">

<div class="country">
+91
</div>

<input
type="tel"
id="registerPhone"
placeholder="Enter 10 digit mobile number"
maxlength="10"
inputmode="numeric"
autocomplete="tel">

</div>


<label>
Email Address
</label>

<input
type="email"
id="registerEmail"
placeholder="Enter your email"
autocomplete="email">


<label>
Password
</label>

<input
type="password"
id="registerPassword"
placeholder="Minimum 6 characters"
autocomplete="new-password">


<button
id="registerBtn"
class="primary">

Create Account

</button>


<div
class="center"
style="margin-top:15px">

<button
class="linkButton"
id="backToLoginBtn">

Already have an account? Login

</button>

</div>

</div>

</div>


<div
id="loading"
class="loading">

Please wait...

</div>


<a
href="index.html"
class="backHome">

← Back to Home

</a>

</div>


<script type="module">

import {
initializeApp
}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,

RecaptchaVerifier,

signInWithPhoneNumber,

signInWithEmailAndPassword,

createUserWithEmailAndPassword,

sendPasswordResetEmail,

updateProfile

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyCPpol_Dmj3yTph_PBG59IbwtUqSpbAqwY",
  authDomain: "nexora-picks-be049.firebaseapp.com",
  projectId: "nexora-picks-be049",
  storageBucket: "nexora-picks-be049.firebasestorage.app",
  messagingSenderId: "325932959084",
  appId: "1:325932959084:web:4fd8252e1ba83f82ee1f49",
  measurementId: "G-KMQZXZZCHJ"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* ELEMENTS */

const phoneTab =
document.getElementById("phoneTab");

const emailTab =
document.getElementById("emailTab");

const phoneLogin =
document.getElementById("phoneLogin");

const emailLogin =
document.getElementById("emailLogin");

const phoneSection =
document.getElementById("phoneSection");

const otpSection =
document.getElementById("otpSection");

const phoneNumber =
document.getElementById("phoneNumber");

const sendOtpBtn =
document.getElementById("sendOtpBtn");

const verifyOtpBtn =
document.getElementById("verifyOtpBtn");

const otpInput =
document.getElementById("otpInput");

const otpPhone =
document.getElementById("otpPhone");

const changeNumberBtn =
document.getElementById("changeNumberBtn");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const emailLoginBtn =
document.getElementById("emailLoginBtn");

const forgotPasswordBtn =
document.getElementById("forgotPasswordBtn");

const createAccountBtn =
document.getElementById("createAccountBtn");

const emailLoginSection =
document.getElementById("emailLoginSection");

const createAccountSection =
document.getElementById("createAccountSection");

const registerName =
document.getElementById("registerName");

const registerPhone =
document.getElementById("registerPhone");

const registerEmail =
document.getElementById("registerEmail");

const registerPassword =
document.getElementById("registerPassword");

const registerBtn =
document.getElementById("registerBtn");

const backToLoginBtn =
document.getElementById("backToLoginBtn");

const switchEmail1 =
document.getElementById("switchEmail1");

const switchPhone1 =
document.getElementById("switchPhone1");


let confirmationResult = null;

let recaptchaVerifier = null;


/* MESSAGE */

function showMessage(text,type){

message.textContent = text;

message.className =
"message " + type;

}


function hideMessage(){

message.className =
"message";

message.textContent = "";

}


function showLoading(){

loading.style.display =
"block";

}


function hideLoading(){

loading.style.display =
"none";

}


/* TABS */

function openPhoneLogin(){

hideMessage();

phoneTab.classList.add("active");

emailTab.classList.remove("active");

phoneLogin.classList.add("active");

emailLogin.classList.remove("active");

}


function openEmailLogin(){

hideMessage();

emailTab.classList.add("active");

phoneTab.classList.remove("active");

emailLogin.classList.add("active");

phoneLogin.classList.remove("active");

emailLoginSection.style.display =
"block";

createAccountSection.style.display =
"none";

}


phoneTab.addEventListener(
"click",
openPhoneLogin
);


emailTab.addEventListener(
"click",
openEmailLogin
);


switchEmail1.addEventListener(
"click",
openEmailLogin
);


switchPhone1.addEventListener(
"click",
openPhoneLogin
);


/* RECAPTCHA */

function setupRecaptcha(){

if(recaptchaVerifier){

try{

recaptchaVerifier.clear();

}

catch(error){

console.log(error);

}

}


recaptchaVerifier =
new RecaptchaVerifier(

auth,

"recaptcha-container",

{

size:"invisible"

}

);

}


/* SEND OTP */

sendOtpBtn.addEventListener(

"click",

async()=>{

hideMessage();

const number =
phoneNumber.value.replace(/\D/g,"");


if(number.length !== 10){

showMessage(
"Please enter a valid 10 digit mobile number.",
"error"
);

return;

}


const fullPhoneNumber =
"+91" + number;


try{

sendOtpBtn.disabled =
true;

showLoading();

setupRecaptcha();


confirmationResult =
await signInWithPhoneNumber(

auth,

fullPhoneNumber,

recaptchaVerifier

);


otpPhone.textContent =
fullPhoneNumber;


phoneSection.style.display =
"none";


otpSection.style.display =
"block";


hideLoading();


sendOtpBtn.disabled =
false;


showMessage(
"OTP sent successfully.",
"success"
);


otpInput.focus();

}


catch(error){

console.error(
"OTP Error:",
error
);


hideLoading();


sendOtpBtn.disabled =
false;


showMessage(
error.message,
"error"
);

}

}

);


/* VERIFY OTP */

verifyOtpBtn.addEventListener(

"click",

async()=>{

hideMessage();

const otp =
otpInput.value.trim();


if(otp.length !== 6){

showMessage(
"Please enter the 6 digit OTP.",
"error"
);

return;

}


if(!confirmationResult){

showMessage(
"Please request a new OTP.",
"error"
);

return;

}


try{

verifyOtpBtn.disabled =
true;

showLoading();


await confirmationResult.confirm(
otp
);


showMessage(
"Login successful! Redirecting...",
"success"
);


setTimeout(()=>{

location.href =
"index.html";

},1000);


}


catch(error){

console.error(
"OTP verification error:",
error
);


hideLoading();


verifyOtpBtn.disabled =
false;


showMessage(
"Invalid OTP. Please check and try again.",
"error"
);

}

}

);


/* CHANGE NUMBER */

changeNumberBtn.addEventListener(

"click",

()=>{

otpSection.style.display =
"none";


phoneSection.style.display =
"block";


otpInput.value =
"";


confirmationResult =
null;


hideMessage();


phoneNumber.focus();

}

);


/* EMAIL LOGIN */

emailLoginBtn.addEventListener(

"click",

async()=>{

hideMessage();


const userEmail =
email.value.trim();


const userPassword =
password.value;


if(!userEmail || !userPassword){

showMessage(
"Please enter your email and password.",
"error"
);

return;

}


try{

emailLoginBtn.disabled =
true;

showLoading();


await signInWithEmailAndPassword(

auth,

userEmail,

userPassword

);


showMessage(
"Login successful! Redirecting...",
"success"
);


setTimeout(()=>{

location.href =
"index.html";

},1000);


}


catch(error){

hideLoading();


emailLoginBtn.disabled =
false;


showMessage(
"Incorrect email or password.",
"error"
);

}

}

);


/* FORGOT PASSWORD */

forgotPasswordBtn.addEventListener(

"click",

async()=>{

hideMessage();


const userEmail =
email.value.trim();


if(!userEmail){

showMessage(
"Enter your email address first, then click Forgot Password.",
"error"
);


email.focus();


return;

}


try{

showLoading();


await sendPasswordResetEmail(

auth,

userEmail

);


hideLoading();


showMessage(
"Password reset link sent to your email.",
"success"
);


}


catch(error){

hideLoading();


showMessage(
error.message,
"error"
);

}

}

);


/* CREATE ACCOUNT SCREEN */

createAccountBtn.addEventListener(

"click",

()=>{

hideMessage();


emailLoginSection.style.display =
"none";


createAccountSection.style.display =
"block";

}

);


/* BACK TO LOGIN */

backToLoginBtn.addEventListener(

"click",

()=>{

hideMessage();


createAccountSection.style.display =
"none";


emailLoginSection.style.display =
"block";

}

);


/* REGISTER CUSTOMER */

registerBtn.addEventListener(

"click",

async()=>{

hideMessage();


const name =
registerName.value.trim();


const phone =
registerPhone.value.replace(/\D/g,"");


const userEmail =
registerEmail.value.trim();


const userPassword =
registerPassword.value;


if(
!name ||
!phone ||
!userEmail ||
!userPassword
){

showMessage(
"Please fill all fields.",
"error"
);

return;

}


if(phone.length !== 10){

showMessage(
"Please enter a valid 10 digit mobile number.",
"error"
);

return;

}


if(userPassword.length < 6){

showMessage(
"Password must contain at least 6 characters.",
"error"
);

return;

}


try{

registerBtn.disabled =
true;

showLoading();


const result =
await createUserWithEmailAndPassword(

auth,

userEmail,

userPassword

);


await updateProfile(

result.user,

{

displayName:
name

}

);


/* SAVE PHONE LOCALLY */

localStorage.setItem(

"nexoraCustomerPhone",

"+91" + phone

);


localStorage.setItem(

"nexoraCustomerName",

name

);


showMessage(
"Account created successfully! Redirecting...",
"success"
);


setTimeout(()=>{

location.href =
"index.html";

},1000);


}


catch(error){

hideLoading();


registerBtn.disabled =
false;


showMessage(
error.message,
"error"
);

}

}

);

</script>

</body>

   </html>
