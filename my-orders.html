/* AUTH TIMEOUT */

setTimeout(()=>{

if(!authFinished){

$("userInfo").innerHTML=`

/* LOGIN CHECK */

onAuthStateChanged(

auth,

user=>{

authFinished=true;


if(!user){

$("userInfo").innerHTML=`

class="loginBtn"
onclick="goLogin()">

$("userInfo").innerHTML=

},

error=>{

$("userInfo").innerHTML=`

</b>

/* LOAD ORDERS */

function loadOrders(uid){


if(unsubscribeOrders){

unsubscribeOrders();

}


const q=

query(

collection(db,"orders"),

where(
"customerId",
"==",
uid
)

);


unsubscribeOrders=

onSnapshot(

q,

snap=>{


let orders=

snap.docs.map(

docSnap=>({

id:docSnap.id,

...docSnap.data()

})

);


orders.sort(

(a,b)=>{

const aTime=
a.createdAt?.seconds||0;

const bTime=
b.createdAt?.seconds||0;

return bTime-aTime;

}

);


if(!orders.length){

$("orders").innerHTML=`

<div class="empty">

<h2>
📦 No orders yet
</h2>

<p>
Your placed orders will appear here.
</p>

<button
class="loginBtn"
onclick="location.href='index.html'">

Start Shopping

</button>

</div>

`;

return;

}


$("orders").innerHTML=

orders
.map(showOrder)
.join("");

},

error=>{

console.error("Firestore error:",error);

$("orders").innerHTML=`

<div class="empty">

❌ Unable to load orders.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

);

}


/* SHOW ORDER */

function showOrder(order){

const date=
formatDate(order.createdAt);


const status=

String(
order.status||
"pending"
)
.toLowerCase();


const items=

Array.isArray(order.items)

?
order.items
:
[];


const itemHTML=

items.length

?

items.map(

item=>`

<div class="item">

<div>

<div class="itemName">

${escapeHtml(item.name||"Product")}

</div>

<div>

Quantity:
${Number(item.qty)||1}

</div>

</div>


<div class="itemPrice">

₹${

(

Number(item.price||0)

*

Number(item.qty||1)

)

.toLocaleString("en-IN")

}

</div>

</div>

`

).join("")

:

`<p>No product details available.</p>`;


return `

<div class="order">

<div class="orderHead">

<div>

<b>
Order ID
</b>


<div class="orderId">

${escapeHtml(order.id)}

</div>


<div
style="margin-top:6px">

${date}

</div>

</div>


<div
class="status">

${escapeHtml(

status
.replaceAll("-"," ")
.toUpperCase()

)}

</div>

</div>


<h3>
📦 Products
</h3>


${itemHTML}


${createTracking(status)}


${createCancelButton(
status,
order.id
)}


${createReturnButton(
status,
order
)}


${createRefundButton(
status,
order
)}


${showRequestStatus(order)}


<div class="total">

<span>
Total
</span>


<span>

₹${

Number(order.total||0)

.toLocaleString("en-IN")

}

</span>

</div>


<div
style="margin-top:12px"
class="cod">

💵 ${escapeHtml(
order.paymentMethod||
"Cash on Delivery"
)}

</div>


<div class="info">

<b>
📍 Delivery Details
</b>

<br>

Name:

${escapeHtml(
order.customerName||
""
)}

<br>

Mobile:

${escapeHtml(
order.customerPhone||
""
)}

<br>

Address:

${escapeHtml(
order.deliveryAddress||
""
)}

</div>

</div>

`;

}


/* CANCEL BUTTON */

function createCancelButton(
status,
orderId
){

const cancellableStatuses=[

"pending",
"confirmed"

];


if(
!cancellableStatuses.includes(status)
){

return "";

}


return `

<button
class="cancelBtn"
onclick="openCancelModal('${orderId}')">

❌ Cancel Order

</button>

`;

}


/* RETURN BUTTON */

function createReturnButton(
status,
order
){

if(
status!=="delivered"
){

return "";

}


if(
order.returnStatus
){

return "";

}


return `

<button
class="returnBtn"
onclick="openReturnModal('${order.id}')">

🔄 Request Return

</button>

`;

}


/* REFUND BUTTON */

function createRefundButton(
status,
order
){

if(
order.refundStatus
){

return "";

}


const refundableStatuses=[

"cancelled",
"delivered"

];


if(
!refundableStatuses.includes(status)
){

return "";

}


return `

<button
class="refundBtn"
onclick="openRefundModal('${order.id}')">

💰 Request Refund

</button>

`;

}


/* REQUEST STATUS */

function showRequestStatus(order){

let html="";


if(order.returnStatus){

html+=`

<div class="${
order.returnStatus==="approved"
?
"approvedBox"
:
order.returnStatus==="rejected"
?
"rejectedBox"
:
"requestBox"
}">

🔄 Return Request:
${escapeHtml(order.returnStatus)}

<br>

Reason:
${escapeHtml(order.returnReason||"")}

</div>

`;

}


if(order.refundStatus){

html+=`

<div class="${
order.refundStatus==="approved"
?
"approvedBox"
:
order.refundStatus==="rejected"
?
"rejectedBox"
:
"requestBox"
}">

💰 Refund Request:
${escapeHtml(order.refundStatus)}

<br>

Reason:
${escapeHtml(order.refundReason||"")}

</div>

`;

}


return html;

}

/* ORDER TRACKING */

function createTracking(status){

if(
status==="cancelled"
){

return `

<div class="cancelledBox">

❌ This order has been cancelled.

</div>

`;

}


const steps=[

{
key:"pending",
icon:"🟡",
text:"Order Placed"
},

{
key:"confirmed",
icon:"✅",
text:"Order Confirmed"
},

{
key:"packed",
icon:"📦",
text:"Packed"
},

{
key:"shipped",
icon:"🚚",
text:"Shipped"
},

{
key:"out-for-delivery",
icon:"🚚",
text:"Out for Delivery"
},

{
key:"delivered",
icon:"🎉",
text:"Delivered"
}

];


let current=

steps.findIndex(
step=>step.key===status
);


if(current===-1){

current=0;

}


return `

<div class="tracking">

<div class="trackingTitle">

📍 Order Tracking

</div>


${

steps.map(

(step,index)=>{


let state="";


if(index<current){

state="done";

}


if(index===current){

state="active";

}


return `

<div class="step ${state}">

<div class="stepIcon">

${step.icon}

</div>

<div class="stepText">

${step.text}

</div>

</div>

`;

}

).join("")

}

</div>

`;

}


/* FORMAT DATE */

function formatDate(timestamp){

if(!timestamp){

return "Date unavailable";

}


try{

const date=

timestamp.toDate

?

timestamp.toDate()

:

new Date(timestamp);


return date.toLocaleString(

"en-IN",

{

day:"2-digit",

month:"short",

year:"numeric",

hour:"2-digit",

minute:"2-digit"

}

);

}
catch(e){

return "Date unavailable";

}

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value??"")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}
