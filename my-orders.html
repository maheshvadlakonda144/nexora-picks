<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders | NEXORA PICKS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#172033;
}

header{
  background:#2874f0;
  color:white;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:15px;
  position:sticky;
  top:0;
  z-index:10;
}

header a{
  color:white;
  text-decoration:none;
  font-size:28px;
}

header h1{
  margin:0;
  font-size:24px;
}

.wrap{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.top{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #00000010;
}

.top h2{
  margin:0 0 8px;
}

#loginMsg{
  color:#d32f2f;
  font-weight:bold;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.loginBtn{
  background:#2874f0;
  color:white;
}

.order{
  background:white;
  border-radius:14px;
  margin-bottom:18px;
  padding:20px;
  box-shadow:0 2px 10px #00000010;
}

.orderHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #eee;
  padding-bottom:14px;
  margin-bottom:15px;
}

.orderId{
  font-size:14px;
  color:#687386;
  word-break:break-all;
}

.status{
  background:#fff3cd;
  color:#856404;
  padding:7px 12px;
  border-radius:20px;
  font-weight:bold;
  white-space:nowrap;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #f0f0f0;
}

.itemName{
  font-weight:bold;
}

.itemPrice{
  white-space:nowrap;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:bold;
  margin-top:16px;
}

.info{
  margin-top:18px;
  background:#f7f9fc;
  padding:15px;
  border-radius:10px;
  line-height:1.7;
}

.empty{
  background:white;
  padding:40px 20px;
  text-align:center;
  border-radius:14px;
  color:#667085;
}

.loading{
  text-align:center;
  padding:30px;
}

.cod{
  color:#16803c;
  font-weight:bold;
}

@media(max-width:600px){
  .wrap{padding:12px}
  .order{padding:15px}
  .orderHead{align-items:flex-start}
  .item{font-size:15px}
}
</style>
</head>

<body>

<header>
  <a href="index.html">‹</a>
  <h1>📦 My Orders</h1>
</header>

<div class="wrap">

  <div class="top">
    <h2>My Orders</h2>
    <div id="userInfo">Checking login...</div>
    <div id="loginMsg"></div>
  </div>

  <div id="orders">
    <div class="loading">Loading your orders...</div>
  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",
  authDomain: "nexora-picks-e887f.firebaseapp.com",
  projectId: "nexora-picks-e887f",
  storageBucket: "nexora-picks-e887f.firebasestorage.app",
  messagingSenderId: "621359003619",
  appId: "1:621359003619:web:483add8bfcd0241f4192d",
  measurementId: "G-LSMJ6QLLPW"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);


onAuthStateChanged(auth, async user => {

  if(!user){

    $("userInfo").innerHTML =
      `<button class="loginBtn" onclick="goLogin()">
        Login to view your orders
       </button>`;

    $("orders").innerHTML = `
      <div class="empty">
        🔐 Please login to see your orders.
      </div>
    `;

    return;
  }

  $("userInfo").innerHTML =
    `Logged in as <b>${escapeHtml(user.email || "")}</b>`;

  await loadOrders(user.uid);
});


async function loadOrders(uid){

  try{

    const q = query(
      collection(db,"orders"),
      where("customerId","==",uid)
    );

    const snap = await getDocs(q);

    let orders = snap.docs.map(doc => ({
      id:doc.id,
      ...doc.data()
    }));

    orders.sort((a,b)=>{

      const aTime = a.createdAt?.seconds || 0;
      const bTime = b.createdAt?.seconds || 0;

      return bTime-aTime;
    });

    if(!orders.length){

      $("orders").innerHTML = `
        <div class="empty">
          <h2>📦 No orders yet</h2>
          <p>Your placed orders will appear here.</p>
          <button class="loginBtn"
                  onclick="location.href='index.html'">
            Start Shopping
          </button>
        </div>
      `;

      return;
    }

    $("orders").innerHTML =
      orders.map(showOrder).join("");

  }catch(error){

    console.error(error);

    $("orders").innerHTML = `
      <div class="empty">
        ❌ Unable to load orders.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


function showOrder(order){

  const date = formatDate(order.createdAt);

  const status =
    order.status || "pending";

  const items = Array.isArray(order.items)
    ? order.items
    : [];

  const itemHTML = items.length
    ? items.map(item => `

      <div class="item">

        <div>
          <div class="itemName">
            ${escapeHtml(item.name || "Product")}
          </div>

          <div>
            Quantity:
            ${Number(item.qty) || 1}
          </div>

          <div>
            Seller:
            ${escapeHtml(item.sellerName || "NEXORA Seller")}
          </div>
        </div>

        <div class="itemPrice">
          ₹${(
            Number(item.price || 0) *
            Number(item.qty || 1)
          ).toLocaleString("en-IN")}
        </div>

      </div>

    `).join("")
    : `<p>No product details available.</p>`;


  return `

    <div class="order">

      <div class="orderHead">

        <div>

          <b>Order ID</b>

          <div class="orderId">
            ${escapeHtml(order.id)}
          </div>

          <div style="margin-top:6px">
            ${date}
          </div>

        </div>

        <div class="status">
          ${escapeHtml(status.toUpperCase())}
        </div>

      </div>


      <h3>📦 Products</h3>

      ${itemHTML}


      <div class="total">
        <span>Total</span>
        <span>
          ₹${Number(order.total || 0).toLocaleString("en-IN")}
        </span>
      </div>


      <div style="margin-top:12px"
           class="cod">
        💵 Cash on Delivery
      </div>


      <div class="info">

        <b>📍 Delivery Details</b>

        <br>

        Name:
        ${escapeHtml(order.customerName || "")}

        <br>

        Mobile:
        ${escapeHtml(order.customerPhone || "")}

        <br>

        Address:
        ${escapeHtml(order.deliveryAddress || "")}

      </div>

    </div>

  `;
}


function formatDate(timestamp){

  if(!timestamp){
    return "Date unavailable";
  }

  try{

    const date = timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);

    return date.toLocaleString("en-IN",{
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });

  }catch(e){

    return "Date unavailable";

  }
}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


window.goLogin = function(){

  location.href = "index.html";

};


</script>

</body>
  </html>
