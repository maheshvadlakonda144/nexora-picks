<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
My Orders | NEXORA PICKS
</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033
}

header{
background:#2874f0;
color:white;
padding:18px 20px;
display:flex;
align-items:center;
gap:15px;
position:sticky;
top:0;
z-index:10
}

header a{
color:white;
text-decoration:none;
font-size:28px
}

header h1{
margin:0;
font-size:24px
}

.wrap{
max-width:850px;
margin:auto;
padding:20px
}

.top{
background:white;
border-radius:14px;
padding:20px;
margin-bottom:18px;
box-shadow:0 2px 10px #00000010
}

.top h2{
margin:0 0 8px
}

#loginMsg{
color:#d32f2f;
font-weight:bold
}

button{
border:0;
border-radius:8px;
padding:12px 18px;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.loginBtn{
background:#2874f0;
color:white
}

.order{
background:white;
border-radius:14px;
margin-bottom:18px;
padding:20px;
box-shadow:0 2px 10px #00000010
}

.orderHead{
display:flex;
justify-content:space-between;
gap:10px;
border-bottom:1px solid #eee;
padding-bottom:14px;
margin-bottom:15px
}

.orderId{
font-size:14px;
color:#687386;
word-break:break-all
}

.status{
background:#fff3cd;
color:#856404;
padding:7px 12px;
border-radius:20px;
font-weight:bold;
white-space:nowrap;
text-transform:uppercase
}

.item{
display:flex;
justify-content:space-between;
gap:15px;
padding:10px 0;
border-bottom:1px solid #f0f0f0
}

.itemName{
font-weight:bold
}

.itemPrice{
white-space:nowrap
}

.total{
display:flex;
justify-content:space-between;
font-size:21px;
font-weight:bold;
margin-top:16px
}

.info{
margin-top:18px;
background:#f7f9fc;
padding:15px;
border-radius:10px;
line-height:1.7
}

.empty{
background:white;
padding:40px 20px;
text-align:center;
border-radius:14px;
color:#667085
}

.loading{
text-align:center;
padding:30px
}

.cod{
color:#16803c;
font-weight:bold
}

/* ORDER TRACKING */

.tracking{
margin-top:22px;
padding:18px;
background:#f7f9fc;
border-radius:12px
}

.trackingTitle{
font-size:18px;
font-weight:bold;
margin-bottom:18px
}

.step{
display:flex;
align-items:flex-start;
gap:12px;
margin-bottom:14px;
position:relative
}

.stepIcon{
width:32px;
height:32px;
border-radius:50%;
background:#d9dee7;
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
flex-shrink:0;
position:relative;
z-index:2
}

.step.active .stepIcon{
background:#2874f0;
color:white
}

.step.done .stepIcon{
background:#16803c;
color:white
}

.stepText{
padding-top:6px;
font-weight:bold;
color:#8a94a6
}

.step.active .stepText,
.step.done .stepText{
color:#172033
}

.step:not(:last-child)::after{
content:"";
position:absolute;
left:15px;
top:32px;
height:16px;
width:2px;
background:#d9dee7
}

.step.done:not(:last-child)::after{
background:#16803c
}

.cancelledBox{
margin-top:18px;
padding:15px;
border-radius:10px;
background:#fff0f0;
color:#c62828;
font-weight:bold;
text-align:center
}

/* ORDER ACTIONS */

.orderActions{
margin-top:18px;
display:flex;
gap:10px;
flex-wrap:wrap
}

.cancelBtn{
background:#d32f2f;
color:white
}

.returnBtn{
background:#f57c00;
color:white
}

.refundBox{
margin-top:18px;
padding:15px;
border-radius:10px;
background:#e8f5e9;
color:#176b36;
font-weight:bold
}

.requestBox{
margin-top:18px;
padding:15px;
border-radius:10px;
background:#fff8e1;
color:#8a6500;
font-weight:bold
}

@media(max-width:600px){

.wrap{
padding:12px
}

.order{
padding:15px
}

.orderHead{
align-items:flex-start
}

.item{
font-size:15px
}

.orderActions{
flex-direction:column
}

.orderActions button{
width:100%
}

}

</style>

</head>

<body>

<header>

<a href="index.html">
‹
</a>

<h1>
📦 My Orders
</h1>

</header>

<div class="wrap">

<div class="top">

<h2>
My Orders
</h2>

<div id="userInfo">
Checking login...
</div>

<div id="loginMsg"></div>

</div>

<div id="orders">

<div class="loading">
Loading your orders...
</div>

</div>

</div>

<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import{
getFirestore,
collection,
query,
where,
onSnapshot,
doc,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);

const $=
id=>document.getElementById(id);

let currentUser=null;

onAuthStateChanged(
auth,
user=>{

currentUser=user;

if(!user){

$("userInfo").innerHTML=`

<button
class="loginBtn"
onclick="goLogin()">

Login to view your orders

</button>

`;

$("orders").innerHTML=`

<div class="empty">

🔐 Please login to see your orders.

</div>

`;

return;

}

$("userInfo").innerHTML=

`Logged in as
<b>

${escapeHtml(
user.email||""
)}

</b>`;

loadOrders(
user.uid
);

}

);

/* REAL-TIME ORDERS */

function loadOrders(uid){

const q=

query(

collection(
db,
"orders"
),

where(
"customerId",
"==",
uid
)

);

onSnapshot(

q,

snap=>{

let orders=

snap.docs.map(
doc=>({

id:doc.id,

...doc.data()

})

);

orders.sort(
(a,b)=>{

const aTime=

a.createdAt?.seconds||
0;

const bTime=

b.createdAt?.seconds||
0;

return bTime-aTime;

}

);

if(!orders.length){

$("orders").innerHTML=`

<div class="empty">

<h2>
📦 No orders yet
</h2>

<p>
Your placed orders will appear here.
</p>

<button
class="loginBtn"
onclick="location.href='index.html'">

Start Shopping

</button>

</div>

`;

return;

}

$("orders").innerHTML=

orders
.map(showOrder)
.join("");

},

error=>{

console.error(
error
);

$("orders").innerHTML=`

<div class="empty">

❌ Unable to load orders.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

);

}

/* SHOW ORDER */

function showOrder(order){

const date=

formatDate(
order.createdAt
);

const status=

String(
order.status||
"pending"
)
.toLowerCase();

const items=

Array.isArray(
order.items
)

?
order.items
:
[];

const itemHTML=

items.length

?

items.map(
item=>`

<div class="item">

<div>

<div class="itemName">

${escapeHtml(
item.name||
"Product"
)}

</div>

<div>

Quantity:

${Number(
item.qty
)||1}

</div>

</div>

<div class="itemPrice">

₹${

(

Number(
item.price||
0
)

*

Number(
item.qty||
1
)

)

.toLocaleString(
"en-IN"
)

}

</div>

</div>

`

).join("")

:

`<p>
No product details available.
</p>`;

const actionHTML=

createActions(
order,
status
);

const refundHTML=

createRefund(
order
);

return `

<div class="order">

<div class="orderHead">

<div>

<b>
Order ID
</b>

<div class="orderId">

${escapeHtml(
order.id
)}

</div>

<div
style="margin-top:6px">

${date}

</div>

</div>

<div
class="status">

${escapeHtml(
status.replaceAll(
"-",
" "
)
.toUpperCase()
)}

</div>

</div>

<h3>
📦 Products
</h3>

${itemHTML}

${createTracking(status)}

${actionHTML}

${refundHTML}

<div class="total">

<span>
Total
</span>

<span>

₹${

Number(
order.total||
0
)

.toLocaleString(
"en-IN"
)

}

</span>

</div>

<div
style="margin-top:12px"
class="cod">

${

order.paymentMethod==="online"

?

"💳 Online Payment"

:

"💵 Cash on Delivery"

}

</div>

<div class="info">

<b>
📍 Delivery Details
</b>

<br>

Name:

${escapeHtml(
order.customerName||
""
)}

<br>

Mobile:

${escapeHtml(
order.customerPhone||
""
)}

<br>

Address:

${escapeHtml(
order.deliveryAddress||
""
)}

</div>

</div>

`;

}

/* CANCEL / RETURN BUTTONS */

function createActions(order,status){

let html="";

if(
order.cancelRequested
){

html+=`

<div class="requestBox">

⏳ Cancellation request submitted.
We will review your request.

</div>

`;

}

else if(

status==="pending"||
status==="confirmed"

){

html+=`

<div class="orderActions">

<button
class="cancelBtn"
onclick="cancelOrder('${order.id}')">

❌ Cancel Order

</button>

</div>

`;

}

if(
order.returnRequested
){

html+=`

<div class="requestBox">

🔄 Return request submitted.
We will review your request.

</div>

`;

}

else if(
status==="delivered"
){

html+=`

<div class="orderActions">

<button
class="returnBtn"
onclick="returnOrder('${order.id}')">

🔄 Return Product

</button>

</div>

`;

}

return html;

}

/* REFUND STATUS */

function createRefund(order){

const refundStatus=

String(
order.refundStatus||
""
)
.toLowerCase();

if(!refundStatus){

return "";

}

let message="";

if(
refundStatus==="requested"
){

message="💰 Refund requested";

}

else if(
refundStatus==="initiated"
){

message="💰 Refund initiated";

}

else if(
refundStatus==="processing"
){

message="⏳ Refund processing";

}

else if(
refundStatus==="completed"
){

message="✅ Refund completed";

}

else if(
refundStatus==="rejected"
){

message="❌ Refund rejected";

}

else{

message="💰 Refund status: "+refundStatus;

}

return `

<div class="refundBox">

${message}

</div>

`;

}

/* CANCEL ORDER REQUEST */

window.cancelOrder=
async function(orderId){

if(
!confirm(
"Are you sure you want to cancel this order?"
)
){

return;

}

try{

await updateDoc(

doc(
db,
"orders",
orderId
),

{

cancelRequested:true,

cancelRequestedAt:
serverTimestamp()

}

);

alert(
"Cancellation request submitted successfully."
);

}

catch(error){

console.error(
error
);

alert(
"Unable to submit cancellation request: "+
error.message
);

}

};

/* RETURN ORDER REQUEST */

window.returnOrder=
async function(orderId){

if(
!confirm(
"Do you want to request a return for this product?"
)
){

return;

}

try{

await updateDoc(

doc(
db,
"orders",
orderId
),

{

returnRequested:true,

returnRequestedAt:
serverTimestamp()

}

);

alert(
"Return request submitted successfully."
);

}

catch(error){

console.error(
error
);

alert(
"Unable to submit return request: "+
error.message
);

}

};

/* CREATE ORDER TRACKING */

function createTracking(status){

if(
status==="cancelled"
){

return `

<div class="cancelledBox">

❌ This order has been cancelled.

</div>

`;

}

const steps=[

{
key:"pending",
icon:"🟡",
text:"Order Placed"
},

{
key:"confirmed",
icon:"✅",
text:"Order Confirmed"
},

{
key:"packed",
icon:"📦",
text:"Packed"
},

{
key:"shipped",
icon:"🚚",
text:"Shipped"
},

{
key:"out-for-delivery",
icon:"🚚",
text:"Out for Delivery"
},

{
key:"delivered",
icon:"🎉",
text:"Delivered"
}

];

const current=

steps.findIndex(
step=>

step.key===
status

);

return `

<div class="tracking">

<div class="trackingTitle">

📍 Order Tracking

</div>

${

steps.map(
(step,index)=>{

let state=
"";

if(
index<current
){

state=
"done";

}

if(
index===current
){

state=
"active";

}

return `

<div
class="step
${state}">

<div
class="stepIcon">

${step.icon}

</div>

<div
class="stepText">

${step.text}

</div>

</div>

`;

}

).join("")

}

</div>

`;

}

/* FORMAT DATE */

function formatDate(timestamp){

if(!timestamp){

return "Date unavailable";

}

try{

const date=

timestamp.toDate

?

timestamp.toDate()

:

new Date(
timestamp
);

return date.toLocaleString(

"en-IN",

{

day:"2-digit",

month:"short",

year:"numeric",

hour:"2-digit",

minute:"2-digit"

}

);

}

catch(e){

return "Date unavailable";

}

}

/* ESCAPE HTML */

function escapeHtml(value){

return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

/* LOGIN */

window.goLogin=
function(){

location.href=
"index.html";

};

</script>

</body>

</html>
