<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA AI | NEXORA PICKS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f8;
  color:#202123;
}

/* HEADER */
.header{
  height:60px;
  background:#2874f0;
  color:white;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:15px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
  white-space:nowrap;
}

.aiName{
  font-size:18px;
  font-weight:700;
  border-left:1px solid rgba(255,255,255,.4);
  padding-left:15px;
}

.back{
  margin-left:auto;
  background:white;
  color:#2874f0;
  border:0;
  border-radius:5px;
  padding:9px 14px;
  font-weight:700;
  cursor:pointer;
}

/* LAYOUT */
.app{
  display:flex;
  height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#202123;
  color:white;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.newChat{
  width:100%;
  border:1px solid #565869;
  background:transparent;
  color:white;
  padding:12px;
  border-radius:7px;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

.newChat:hover{
  background:#343541;
}

.sidebarTitle{
  color:#aaa;
  font-size:12px;
  margin:25px 5px 10px;
  text-transform:uppercase;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 150px;
}

.welcome{
  max-width:750px;
  margin:60px auto 20px;
  text-align:center;
}

.robot{
  font-size:55px;
}

.welcome h1{
  margin:10px 0;
  font-size:32px;
}

.welcome p{
  color:#666;
}

/* MESSAGES */
.message{
  max-width:850px;
  margin:0 auto;
  padding:20px 10px;
  display:flex;
  gap:15px;
  line-height:1.6;
  white-space:pre-wrap;
}

.message.user{
  background:#f7f7f8;
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.user .avatar{
  background:#2874f0;
}

.ai .avatar{
  background:#111827;
}

.messageText{
  flex:1;
}

/* INPUT AREA */
.inputArea{
  position:fixed;
  bottom:0;
  left:250px;
  right:0;
  background:linear-gradient(transparent,#f7f7f8 30%);
  padding:25px 20px 20px;
}

.inputBox{
  max-width:850px;
  margin:auto;
  background:white;
  border:1px solid #d9d9e3;
  border-radius:12px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

#userInput{
  flex:1;
  border:0;
  outline:0;
  resize:none;
  font-size:16px;
  padding:10px;
  min-height:44px;
  max-height:140px;
  font-family:inherit;
}

.send{
  width:44px;
  height:44px;
  border:0;
  border-radius:8px;
  background:#2874f0;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.note{
  max-width:850px;
  margin:7px auto 0;
  text-align:center;
  color:#777;
  font-size:11px;
}

/* MOBILE */
@media(max-width:700px){

  .header{
    height:55px;
    padding:0 12px;
  }

  .logo{
    font-size:17px;
  }

  .aiName{
    font-size:16px;
  }

  .sidebar{
    display:none;
  }

  .app{
    height:calc(100vh - 55px);
  }

  .inputArea{
    left:0;
    padding:15px 10px 12px;
  }

  .chat{
    padding:15px 8px 130px;
  }

  .welcome{
    margin:50px auto 20px;
  }

  .welcome h1{
    font-size:27px;
  }

  .message{
    padding:15px 5px;
  }

  .back{
    padding:8px 10px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    NEXORA PICKS
  </div>

  <div class="aiName">
    🤖 NEXORA AI
  </div>

  <button class="back" onclick="location.href='index.html'">
    ← Home
  </button>

</header>


<div class="app">

  <aside class="sidebar">

    <button class="newChat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="sidebarTitle">
      NEXORA AI
    </div>

  </aside>


  <main class="main">

    <div id="chat" class="chat">

      <div id="welcome" class="welcome">

        <div class="robot">
          🤖
        </div>

        <h1>
          Welcome to NEXORA AI
        </h1>

        <p>
          Your AI assistant from NEXORA PICKS.
        </p>

      </div>

    </div>


    <div class="inputArea">

      <div class="inputBox">

        <textarea
          id="userInput"
          placeholder="Message NEXORA AI..."
          rows="1"
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          id="sendBtn"
          class="send"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

      <div class="note">
        NEXORA AI • AI assistant
      </div>

    </div>

  </main>

</div>


<script>

const input = document.getElementById("userInput");
const chat = document.getElementById("chat");
const sendBtn = document.getElementById("sendBtn");

function handleKey(event){

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();

  }

}


function addMessage(text,type){

  document.getElementById("welcome")?.remove();

  const message = document.createElement("div");

  message.className = "message " + type;

  const avatar = document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    type === "user" ? "👤" : "🤖";

  const messageText = document.createElement("div");

  messageText.className = "messageText";

  messageText.textContent = text;

  message.appendChild(avatar);

  message.appendChild(messageText);

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

}


function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";

  sendBtn.disabled = true;

  /*
    AI CONNECTION WILL BE ADDED HERE.

    This page currently provides the
    ChatGPT-style interface only.
  */

  setTimeout(function(){

    addMessage(
      "NEXORA AI is ready. The secure AI model connection needs to be connected to this chat.",
      "ai"
    );

    sendBtn.disabled = false;

  },700);

}


function newChat(){

  chat.innerHTML = `
    <div id="welcome" class="welcome">

      <div class="robot">🤖</div>

      <h1>
        Welcome to NEXORA AI
      </h1>

      <p>
        Your AI assistant from NEXORA PICKS.
      </p>

    </div>
  `;

  input.focus();

}

</script>

</body>
  </html>
