<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA PICKS | Seller Center</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f3f6;font-family:Arial;color:#17202a}header{background:#2874f0;color:#fff;padding:16px;font-weight:900;font-size:22px}main{max-width:900px;margin:auto;padding:18px}.box{background:#fff;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 1px 5px #0001}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd3dd;border-radius:6px}button{border:0;background:#2874f0;color:#fff;padding:12px 16px;border-radius:6px;font-weight:800;cursor:pointer}.secondary{background:#eef4ff;color:#2874f0}.danger{background:#d33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}.thumb{width:60px;height:60px;background:#f5f6f8;display:grid;place-items:center;overflow:hidden;border-radius:6px}.thumb img{width:100%;height:100%;object-fit:cover}.actions{margin-left:auto;display:flex;gap:6px}#app{display:none}.ok{color:#16803c;font-weight:700}.err{color:#d33;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}.actions{margin-left:0}}</style></head><body><header>NEXORA PICKS — SELLER CENTER</header>
<main><div id="login" class="box"><h2>Seller registration / login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="business" placeholder="Business / Seller name"><button onclick="register()">Register as Seller</button> <button class="secondary" onclick="login()">Login</button><button id="completeBtn" class="secondary" style="display:none;margin-top:8px" onclick="completeSellerSetup()">Complete Seller Setup</button><p id="msg"></p></div>
<div id="app"><div class="box"><h2 id="welcome">Seller Dashboard</h2><p id="approval"></p><button class="secondary" onclick="signOut(auth)">Logout</button></div>
<div class="box" id="formBox"><h2 id="formTitle">Add Product</h2><input type="hidden" id="pid"><label>Product name</label><input id="name" placeholder="Wireless Earphones"><label>Description</label><textarea id="description" placeholder="Product details"></textarea><div class="grid"><div><label>Category</label><input id="category" placeholder="Electronics"></div><div><label>Price (₹)</label><input id="price" type="number" min="1"></div><div><label>Stock</label><input id="stock" type="number" min="0"></div><div><label>Old price (optional)</label><input id="oldPrice" type="number" min="0"></div></div><label>Product image URL</label><input id="imageUrl" placeholder="https://..."><label>Emoji fallback</label><input id="emoji" value="🛍️"><label>Active</label><select id="active"><option value="true">Yes</option><option value="false">No</option></select><button onclick="saveProduct()">Save Product</button> <button class="secondary" onclick="resetForm()">Cancel</button><p id="saveMsg"></p></div>
<div class="box"><h2>My Products</h2><div id="list">Loading...</div></div></div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,collection,query,where,onSnapshot,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",authDomain:"nexora-picks-e887f.firebaseapp.com",projectId:"nexora-picks-e887f",storageBucket:"nexora-picks-e887f.firebasestorage.app",messagingSenderId:"621359003619",appId:"1:621359003619:web:483add8bfcd0241f4192d",measurementId:"G-LSMJ6QLLPW"};
const appfb=initializeApp(firebaseConfig),auth=getAuth(appfb),db=getFirestore(appfb),$=id=>document.getElementById(id);let approved=false;let registering=false;let checking=false;
window.register=async()=>{if(registering)return;registering=true;$("msg").textContent="Creating seller account…";try{const email=$("email").value.trim(),password=$("password").value,b=$("business").value.trim();if(!email||!password||password.length<6){$("msg").textContent="Enter email and a password of at least 6 characters.";return}const c=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(c.user,{displayName:b||"Seller"});await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name:b||"Seller",email:c.user.email,role:"seller",approved:false,createdAt:serverTimestamp()});$("msg").textContent="Seller account created. Wait for admin approval.";$("completeBtn").style.display="none";showSeller(c.user); }catch(e){if(e.code==="auth/email-already-in-use")$("msg").textContent="This email is already registered. Tap Login, then Complete Seller Setup if needed.";else $("msg").textContent=e.message}finally{registering=false}};
window.login=async()=>{try{const email=$("email").value.trim(),password=$("password").value;if(!email||!password){$("msg").textContent="Enter email and password.";return}await signInWithEmailAndPassword(auth,email,password);$("msg").textContent=""}catch(e){$("msg").textContent=e.message}};
window.completeSellerSetup=async()=>{const u=auth.currentUser;if(!u){$("msg").textContent="Please login first.";return}try{const b=$("business").value.trim()||u.displayName||"Seller";await updateProfile(u,{displayName:b});await setDoc(doc(db,"users",u.uid),{uid:u.uid,name:b,email:u.email,role:"seller",approved:false,createdAt:serverTimestamp()});$("msg").textContent="Seller profile created. Wait for admin approval.";$("completeBtn").style.display="none";showSeller(u)}catch(e){$("msg").textContent=e.message}};
function showSeller(u,data={approved:false}){approved=data.approved===true;$("login").style.display="none";$("app").style.display="block";$("approval").innerHTML=approved?'<span class="ok">✓ Seller approved. You can sell.</span>':'<span class="err">⏳ Waiting for admin approval. Product publishing is locked.</span>';$("formBox").style.display=approved?"block":"none";$("welcome").textContent=(u.displayName||"Seller")+" — Seller Dashboard";loadProducts(u.uid)}
onAuthStateChanged(auth,async u=>{if(!u){$("login").style.display="block";$("app").style.display="none";$("completeBtn").style.display="none";return}if(registering||checking)return;checking=true;try{const snap=await getDoc(doc(db,"users",u.uid));if(!snap.exists()||snap.data().role!=="seller"){$("login").style.display="block";$("app").style.display="none";$("completeBtn").style.display="inline-block";$("msg").textContent="Your Firebase login exists, but the seller profile is missing. Enter your business name and tap Complete Seller Setup.";return}$("completeBtn").style.display="none";showSeller(u,snap.data())}finally{checking=false}});
function resetForm(){["pid","name","description","category","price","stock","oldPrice","imageUrl"].forEach(id=>$(id).value="");$("emoji").value="🛍️";$("active").value="true";$("formTitle").textContent="Add Product"}
window.saveProduct=async()=>{if(!approved)return;const u=auth.currentUser,id=$("pid").value,d={name:$("name").value.trim(),description:$("description").value.trim(),category:$("category").value.trim(),price:Number($("price").value),stock:Number($("stock").value),oldPrice:Number($("oldPrice").value)||0,imageUrl:$("imageUrl").value.trim(),emoji:$("emoji").value.trim()||"🛍️",active:false,approvalStatus:"pending",sellerId:u.uid,sellerName:u.displayName||"Seller"};if(!d.name||!d.price||d.stock<0){$("saveMsg").textContent="Enter product name, price and stock.";return}try{if(id)await updateDoc(doc(db,"products",id),{...d,approvalStatus:"pending",active:false,submittedAt:serverTimestamp()});else{d.createdAt=serverTimestamp();d.submittedAt=serverTimestamp();await addDoc(collection(db,"products"),d)}$("saveMsg").textContent="Product submitted for Admin approval ✓";resetForm()}catch(e){$("saveMsg").textContent=e.message}};
function loadProducts(uid){onSnapshot(query(collection(db,"products"),where("sellerId","==",uid)),s=>{$("list").innerHTML=s.empty?"<p>No products yet.</p>":s.docs.map(d=>{const p=d.data();return `<div class="item"><div class="thumb">${p.imageUrl?`<img src="${p.imageUrl}">`:p.emoji||"🛍️"}</div><div><b>${p.name}</b><div>₹${p.price} • Stock: ${p.stock}</div><div>${p.approvalStatus==="approved"?"✓ Approved":p.approvalStatus==="rejected"?"✕ Rejected":"⏳ Pending approval"}</div></div><div class="actions"><button class="secondary" onclick='edit(${JSON.stringify({id:d.id,...p})})'>Edit</button><button class="danger" onclick="removeP('${d.id}')">Delete</button></div></div>`}).join("")})}
window.edit=p=>{$("pid").value=p.id;$("name").value=p.name||"";$("description").value=p.description||"";$("category").value=p.category||"";$("price").value=p.price||"";$("stock").value=p.stock??"";$("oldPrice").value=p.oldPrice||"";$("imageUrl").value=p.imageUrl||"";$("emoji").value=p.emoji||"🛍️";$("active").value=String(p.active!==false);$("formTitle").textContent="Edit Product";scrollTo(0,0)};
window.removeP=async id=>{if(confirm("Delete this product?"))await deleteDoc(doc(db,"products",id))};
</script></body></html>
