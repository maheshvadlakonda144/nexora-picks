<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA PICKS | Seller Center</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f1f3f6;
 font-family:Arial,sans-serif;
 color:#17202a
}
header{
 background:#2874f0;
 color:#fff;
 padding:16px;
 font-weight:900;
 font-size:22px
}
main{
 max-width:900px;
 margin:auto;
 padding:18px
}
.box{
 background:#fff;
 border-radius:12px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 1px 5px #0001
}
input,textarea,select{
 width:100%;
 padding:12px;
 margin:6px 0 12px;
 border:1px solid #ccd3dd;
 border-radius:6px
}
button{
 border:0;
 background:#2874f0;
 color:#fff;
 padding:12px 16px;
 border-radius:6px;
 font-weight:800;
 cursor:pointer
}
.secondary{
 background:#eef4ff;
 color:#2874f0
}
.danger{
 background:#d33
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.item{
 border:1px solid #ddd;
 border-radius:8px;
 padding:12px;
 margin:8px 0;
 display:flex;
 gap:10px;
 align-items:center
}
.thumb{
 width:60px;
 height:60px;
 background:#f5f6f8;
 display:grid;
 place-items:center;
 overflow:hidden;
 border-radius:6px
}
.thumb img{
 width:100%;
 height:100%;
 object-fit:cover
}
.actions{
 margin-left:auto;
 display:flex;
 gap:6px
}
#app{display:none}
.ok{
 color:#16803c;
 font-weight:700
}
.err{
 color:#d33;
 font-weight:700
}
.pending{
 color:#d97706;
 font-weight:700
}
@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .item{flex-wrap:wrap}
 .actions{margin-left:0}
}
</style>
</head>

<body>

<header>NEXORA PICKS — SELLER CENTER</header>

<main>

<!-- LOGIN / REGISTRATION -->

<div id="login" class="box">

<h2>Seller Registration / Login</h2>

<input id="email"
       type="email"
       placeholder="Email">

<input id="password"
       type="password"
       placeholder="Password">

<input id="business"
       placeholder="Business / Seller name">

<button onclick="register()">
Register as Seller
</button>

<button class="secondary" onclick="login()">
Login
</button>

<button id="completeBtn"
        class="secondary"
        style="display:none;margin-top:8px"
        onclick="completeSellerSetup()">
Complete Seller Setup
</button>

<p id="msg"></p>

</div>


<!-- SELLER APP -->

<div id="app">

<div class="box">

<h2 id="welcome">
Seller Dashboard
</h2>

<p id="approval"></p>

<button class="secondary" onclick="logout()">
Logout
</button>

</div>


<!-- PRODUCT FORM -->

<div class="box" id="formBox">

<h2 id="formTitle">
Add Product
</h2>

<input type="hidden" id="pid">

<label>Product name</label>
<input id="name"
       placeholder="Wireless Earphones">

<label>Description</label>
<textarea id="description"
          placeholder="Product details"></textarea>

<div class="grid">

<div>
<label>Category</label>
<input id="category"
       placeholder="Electronics">
</div>

<div>
<label>Price (₹)</label>
<input id="price"
       type="number"
       min="1">
</div>

<div>
<label>Stock</label>
<input id="stock"
       type="number"
       min="0">
</div>

<div>
<label>Old price (optional)</label>
<input id="oldPrice"
       type="number"
       min="0">
</div>

</div>

<label>Product image URL</label>

<input id="imageUrl"
       placeholder="https://...">

<label>Emoji fallback</label>

<input id="emoji"
       value="🛍️">

<!-- Seller cannot directly publish -->

<label>Product visibility</label>

<select id="active">
<option value="false">
Hidden until Admin approval
</option>
</select>

<button onclick="saveProduct()">
Submit Product for Approval
</button>

<button class="secondary"
        onclick="resetForm()">
Cancel
</button>

<p id="saveMsg"></p>

</div>


<!-- MY PRODUCTS -->

<div class="box">

<h2>My Products</h2>

<div id="list">
Loading...
</div>

</div>

</div>

</main>


<script type="module">

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut,
 updateProfile
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 getDoc,
 collection,
 query,
 where,
 onSnapshot,
 addDoc,
 updateDoc,
 deleteDoc,
 serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

 apiKey:
 "AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

 authDomain:
 "nexora-picks-e887f.firebaseapp.com",

 projectId:
 "nexora-picks-e887f",

 storageBucket:
 "nexora-picks-e887f.firebasestorage.app",

 messagingSenderId:
 "621359003619",

 appId:
 "1:621359003619:web:483add8bfcd0241f4192d",

 measurementId:
 "G-LSMJ6QLLPW"

};


const appfb = initializeApp(firebaseConfig);

const auth = getAuth(appfb);

const db = getFirestore(appfb);

const $ = id => document.getElementById(id);


let approved = false;
let registering = false;
let checking = false;


/* SELLER REGISTRATION */

window.register = async () => {

 if(registering) return;

 registering = true;

 $("msg").textContent =
 "Creating seller account...";

 try {

  const email =
   $("email").value.trim();

  const password =
   $("password").value;

  const business =
   $("business").value.trim();

  if(!email || !password || password.length < 6){

   $("msg").textContent =
    "Enter email and a password of at least 6 characters.";

   return;
  }


  const c =
   await createUserWithEmailAndPassword(
    auth,
    email,
    password
   );


  await updateProfile(
   c.user,
   {
    displayName:
     business || "Seller"
   }
  );


  await setDoc(
   doc(db,"users",c.user.uid),
   {
    uid:c.user.uid,
    name:business || "Seller",
    email:c.user.email,
    role:"seller",
    approved:false,
    sellerStatus:"pending",
    createdAt:serverTimestamp()
   }
  );


  $("msg").textContent =
   "Seller account created. Wait for Admin approval.";

  $("completeBtn").style.display="none";

  showSeller(c.user,{
   approved:false
  });


 }catch(e){

  if(e.code === "auth/email-already-in-use"){

   $("msg").textContent =
    "This email is already registered. Login and complete seller setup if needed.";

  }else{

   $("msg").textContent =
    e.message;

  }

 }finally{

  registering=false;

 }

};


/* LOGIN */

window.login = async () => {

 try {

  const email =
   $("email").value.trim();

  const password =
   $("password").value;

  if(!email || !password){

   $("msg").textContent =
    "Enter email and password.";

   return;
  }

  await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

  $("msg").textContent="";

 }catch(e){

  $("msg").textContent =
   e.message;

 }

};


/* COMPLETE SELLER PROFILE */

window.completeSellerSetup = async () => {

 const u = auth.currentUser;

 if(!u){

  $("msg").textContent =
   "Please login first.";

  return;
 }

 try {

  const business =
   $("business").value.trim()
   || u.displayName
   || "Seller";


  await updateProfile(
   u,
   {
    displayName:business
   }
  );


  await setDoc(
   doc(db,"users",u.uid),
   {
    uid:u.uid,
    name:business,
    email:u.email,
    role:"seller",
    approved:false,
    sellerStatus:"pending",
    createdAt:serverTimestamp()
   }
  );


  $("msg").textContent =
   "Seller profile created. Wait for Admin approval.";

  $("completeBtn").style.display="none";

  showSeller(u,{
   approved:false
  });

 }catch(e){

  $("msg").textContent =
   e.message;

 }

};


/* SHOW SELLER DASHBOARD */

function showSeller(u,data){

 approved =
  data.approved === true;


 $("login").style.display="none";

 $("app").style.display="block";


 if(approved){

  $("approval").innerHTML =
   '<span class="ok">✓ Seller approved. You can submit products.</span>';

  $("formBox").style.display="block";

 }else{

  $("approval").innerHTML =
   '<span class="pending">⏳ Waiting for Admin approval. Product publishing is locked.</span>';

  $("formBox").style.display="none";

 }


 $("welcome").textContent =
  (u.displayName || "Seller")
  + " — Seller Dashboard";


 loadProducts(u.uid);

}


/* AUTH CHECK */

onAuthStateChanged(
 auth,
 async u => {

  if(!u){

   $("login").style.display="block";

   $("app").style.display="none";

   $("completeBtn").style.display="none";

   return;
  }


  if(registering || checking)
   return;


  checking=true;


  try {

   const snap =
    await getDoc(
     doc(db,"users",u.uid)
    );


   if(
    !snap.exists()
    ||
    snap.data().role !== "seller"
   ){

    $("login").style.display="block";

    $("app").style.display="none";

    $("completeBtn").style.display="inline-block";

    $("msg").textContent =
     "Seller profile is missing. Enter your business name and tap Complete Seller Setup.";

    return;
   }


   $("completeBtn").style.display="none";

   showSeller(
    u,
    snap.data()
   );


  }finally{

   checking=false;

  }

 });


/* RESET FORM */

function resetForm(){

 $("pid").value="";

 $("name").value="";

 $("description").value="";

 $("category").value="";

 $("price").value="";

 $("stock").value="";

 $("oldPrice").value="";

 $("imageUrl").value="";

 $("emoji").value="🛍️";

 $("active").value="false";

 $("formTitle").textContent=
  "Add Product";

}


/* SAVE PRODUCT */

window.saveProduct = async () => {

 if(!approved){

  $("saveMsg").textContent =
   "Admin approval is required.";

  return;
 }


 const u = auth.currentUser;

 if(!u){

  $("saveMsg").textContent =
   "Please login.";

  return;
 }


 const id =
  $("pid").value;


 const d = {

  name:
   $("name").value.trim(),

  description:
   $("description").value.trim(),

  category:
   $("category").value.trim(),

  price:
   Number($("price").value),

  stock:
   Number($("stock").value),

  oldPrice:
   Number($("oldPrice").value) || 0,

  imageUrl:
   $("imageUrl").value.trim(),

  emoji:
   $("emoji").value.trim() || "🛍️",

  /*
   * IMPORTANT:
   * Seller products are ALWAYS
   * submitted as pending.
   */

  active:false,

  approvalStatus:"pending",

  sellerId:u.uid,

  sellerName:
   u.displayName || "Seller",

  submittedAt:
   serverTimestamp()

 };


 if(
  !d.name
  ||
  !d.price
  ||
  d.stock < 0
 ){

  $("saveMsg").textContent =
   "Enter product name, price and stock.";

  return;
 }


 try {

  if(id){

   await updateDoc(
    doc(db,"products",id),
    d
   );

  }else{

   d.createdAt =
    serverTimestamp();

   await addDoc(
    collection(db,"products"),
    d
   );

  }


  $("saveMsg").innerHTML =
   '<span class="ok">Product submitted for Admin approval ✓</span>';

  resetForm();


 }catch(e){

  $("saveMsg").textContent =
   e.message;

 }

};


/* LOAD SELLER PRODUCTS */

function loadProducts(uid){

 onSnapshot(

  query(
   collection(db,"products"),
   where("sellerId","==",uid)
  ),

  s => {

   $("list").innerHTML =
    s.empty
    ?
    "<p>No products yet.</p>"
    :
    s.docs.map(d => {

     const p=d.data();


     let status="⏳ Pending";

     if(p.approvalStatus==="approved")
      status="✓ Approved";

     if(p.approvalStatus==="rejected")
      status="✕ Rejected";


     return `

      <div class="item">

       <div class="thumb">

        ${
         p.imageUrl
         ?
         `<img src="${escapeHtml(p.imageUrl)}">`
         :
         escapeHtml(p.emoji || "🛍️")
        }

       </div>

       <div>

        <b>${escapeHtml(p.name)}</b>

        <div>
         ₹${Number(p.price || 0).toLocaleString("en-IN")}
         • Stock: ${p.stock}
        </div>

        <div class="${
         p.approvalStatus==="approved"
         ?"ok"
         :
         p.approvalStatus==="rejected"
         ?"err"
         :"pending"
        }">

         ${status}

        </div>

       </div>

       <div class="actions">

        <button
         class="secondary"
         onclick='editProduct(${JSON.stringify({
          id:d.id,
          ...p
         })})'>
         Edit
        </button>

        <button
         class="danger"
         onclick="removeProduct('${d.id}')">
         Delete
        </button>

       </div>

      </div>

     `;

    }).join("");

  }

 );

}


/* EDIT */

window.editProduct = p => {

 $("pid").value =
  p.id;

 $("name").value =
  p.name || "";

 $("description").value =
  p.description || "";

 $("category").value =
  p.category || "";

 $("price").value =
  p.price || "";

 $("stock").value =
  p.stock ?? "";

 $("oldPrice").value =
  p.oldPrice || "";

 $("imageUrl").value =
  p.imageUrl || "";

 $("emoji").value =
  p.emoji || "🛍️";

 $("active").value="false";

 $("formTitle").textContent =
  "Edit Product";

 scrollTo(0,0);

};


/* DELETE */

window.removeProduct = async id => {

 if(confirm("Delete this product?")){

  await deleteDoc(
   doc(db,"products",id)
  );

 }

};


/* LOGOUT */

window.logout = async () => {

 await signOut(auth);

};


/* ESCAPE HTML */

function escapeHtml(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
  </html>
