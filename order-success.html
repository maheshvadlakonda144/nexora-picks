<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful | NEXORA PICKS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:18px;
  font-size:26px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:25px 15px 50px;
}

.success-box{
  background:white;
  border-radius:16px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 3px 12px #ddd;
  margin-bottom:20px;
}

.success-icon{
  font-size:75px;
}

.success-box h1{
  color:#2e7d32;
  margin:10px 0;
}

.order-id{
  background:#f5f5f5;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
  font-size:17px;
}

.box{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px #ddd;
}

.box h2{
  margin-top:0;
  font-size:25px;
}

.product{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.product-name{
  font-size:18px;
  font-weight:bold;
}

.product-qty{
  color:#666;
  margin-top:5px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:14px 0;
  font-size:18px;
}

.total{
  border-top:2px solid #ddd;
  padding-top:15px;
  font-size:25px;
  font-weight:bold;
}

.address{
  line-height:1.7;
  font-size:17px;
}

.home-btn{
  display:block;
  width:100%;
  padding:17px;
  text-align:center;
  background:#ff6d00;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-size:20px;
  font-weight:bold;
}

</style>

</head>

<body>

<header>
NEXORA PICKS
</header>


<div class="container">


<div class="success-box">

<div class="success-icon">
🎉
</div>

<h1>Order Placed Successfully!</h1>

<p>
Thank you for shopping with NEXORA PICKS.
</p>

<div class="order-id">

<strong>Order ID:</strong>

<span id="orderId">
NEXORA000000
</span>

</div>

</div>



<div class="box">

<h2>🛒 Order Details</h2>

<div id="orderItems"></div>

<div class="row">

<span>Delivery</span>

<strong>FREE</strong>

</div>

<div class="row total">

<span>Total</span>

<span id="total">
₹0
</span>

</div>

</div>



<div class="box">

<h2>📍 Delivery Address</h2>

<div class="address" id="address">

No address available.

</div>

</div>



<div class="box">

<h2>💵 Payment Method</h2>

<strong>Cash on Delivery</strong>

<p>
Pay when your order is delivered.
</p>

</div>



<a href="index.html" class="home-btn">

🛍️ Continue Shopping

</a>


</div>



<script>

const ORDER_KEY = "nexora_last_order";


function money(value){

  return "₹" +
  Number(value || 0)
  .toLocaleString("en-IN");

}


function escapeHTML(value){

  return String(value ?? "")

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}


function loadOrder(){

  const order = JSON.parse(

    localStorage.getItem(ORDER_KEY)

  );


  if(!order){

    document.getElementById(
      "orderItems"
    ).innerHTML = `

      <p>No recent order found.</p>

    `;

    return;

  }


  document.getElementById(
    "orderId"
  ).textContent =
  order.orderId;


  let total = 0;


  document.getElementById(
    "orderItems"
  ).innerHTML =


  order.cart.map(item => {


    const price =
    Number(item.price) || 0;


    const qty =
    Number(item.qty) || 1;


    const itemTotal =
    price * qty;


    total += itemTotal;


    return `

      <div class="product">

        <div>

          <div class="product-name">

            ${escapeHTML(
              item.name || "Product"
            )}

          </div>

          <div class="product-qty">

            Quantity: ${qty}

          </div>

        </div>


        <strong>

          ${money(itemTotal)}

        </strong>

      </div>

    `;

  }).join("");


  document.getElementById(
    "total"
  ).textContent =
  money(total);


  document.getElementById(
    "address"
  ).innerHTML = `

    <strong>
      ${escapeHTML(order.address.name)}
    </strong>

    <br>

    📱 ${escapeHTML(
      order.address.mobile
    )}

    <br>

    ${escapeHTML(
      order.address.house
    )}

    <br>

    ${escapeHTML(
      order.address.street
    )}

    <br>

    ${escapeHTML(
      order.address.city
    )},

    ${escapeHTML(
      order.address.state
    )}

    -

    ${escapeHTML(
      order.address.pincode
    )}

  `;

}


loadOrder();

</script>

</body>

</html>
