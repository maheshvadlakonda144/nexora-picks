<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA PICKS - Product</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222
}
header{
  background:#2874f0;
  color:white;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10
}
.logo{
  font-size:21px;
  font-weight:bold;
  white-space:nowrap
}
.back{
  font-size:25px;
  cursor:pointer
}
.container{
  max-width:1100px;
  margin:20px auto;
  padding:12px
}
.product{
  background:white;
  border-radius:10px;
  padding:20px;
  display:grid;
  grid-template-columns:45% 55%;
  gap:30px
}
.image-box{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:350px;
  background:#fafafa;
  border-radius:8px
}
.image-box img{
  max-width:100%;
  max-height:400px;
  object-fit:contain
}
.info h1{
  font-size:28px;
  margin-top:0
}
.price{
  font-size:30px;
  font-weight:bold;
  color:#111;
  margin:15px 0
}
.stock{
  color:#168a28;
  font-weight:bold;
  margin:10px 0
}
.seller{
  background:#f1f6ff;
  padding:12px;
  border-radius:8px;
  margin:15px 0
}
.description{
  line-height:1.6;
  color:#555;
  margin:20px 0
}
button{
  border:0;
  padding:15px 25px;
  border-radius:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:5px
}
.cart{
  background:#ff9f00;
  color:white
}
.buy{
  background:#fb641b;
  color:white
}
button:disabled{
  background:#aaa;
  cursor:not-allowed
}
.message{
  padding:15px;
  text-align:center;
  font-size:18px
}

@media(max-width:700px){
  .product{
    grid-template-columns:1fr;
    padding:12px
  }
  .image-box{
    min-height:280px
  }
  .info h1{
    font-size:23px
  }
  .price{
    font-size:26px
  }
}
</style>
</head>

<body>

<header>
  <div class="back" onclick="history.back()">‹</div>
  <div class="logo">NEXORA PICKS</div>
</header>

<div class="container">
  <div id="loading" class="message">Loading product...</div>

  <div id="productBox" class="product" style="display:none">

    <div class="image-box">
      <img id="productImage" src="" alt="Product">
    </div>

    <div class="info">
      <h1 id="productName"></h1>

      <div class="price" id="productPrice"></div>

      <div id="stock" class="stock"></div>

      <div class="seller">
        🏪 <b>Seller:</b>
        <span id="sellerName"></span>
      </div>

      <div>
        📂 <b>Category:</b>
        <span id="category"></span>
      </div>

      <div class="description">
        <h3>Product Details</h3>
        <p id="description"></p>
      </div>

      <button class="cart" id="cartBtn">
        🛒 Add to Cart
      </button>

      <button class="buy" id="buyBtn">
        ⚡ Buy Now
      </button>
    </div>

  </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBb1YMdtjSEyuCBZzuymH5Y7ykU_KSBg",
  authDomain: "nexora-picks-e887f.firebaseapp.com",
  projectId: "nexora-picks-e887f",
  storageBucket: "nexora-picks-e887f.firebasestorage.app",
  messagingSenderId: "621359003619",
  appId: "1:621359003619:web:483add8bfcd0241f4192d",
  measurementId: "G-LSMJ6QLLPW"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


// Get product ID from URL
const params = new URLSearchParams(window.location.search);
const productId = params.get("id");


// Elements
const loading = document.getElementById("loading");
const productBox = document.getElementById("productBox");
const productImage = document.getElementById("productImage");
const productName = document.getElementById("productName");
const productPrice = document.getElementById("productPrice");
const sellerName = document.getElementById("sellerName");
const category = document.getElementById("category");
const description = document.getElementById("description");
const stockText = document.getElementById("stock");
const cartBtn = document.getElementById("cartBtn");
const buyBtn = document.getElementById("buyBtn");


let productData = null;


// Load product
async function loadProduct(){

  if(!productId){
    loading.innerHTML = "❌ Product not found.";
    return;
  }

  try{

    const productRef = doc(db,"products",productId);
    const snap = await getDoc(productRef);

    if(!snap.exists()){
      loading.innerHTML = "❌ Product does not exist.";
      return;
    }

    productData = {
      id:snap.id,
      ...snap.data()
    };


    // Only show approved/active products
    if(
      productData.approvalStatus &&
      productData.approvalStatus !== "approved"
    ){
      loading.innerHTML = "❌ This product is not available.";
      return;
    }

    if(productData.active === false){
      loading.innerHTML = "❌ This product is currently unavailable.";
      return;
    }


    // Product information
    productName.textContent =
      productData.name || "Product";

    productPrice.textContent =
      "₹" + Number(productData.price || 0).toLocaleString("en-IN");

    sellerName.textContent =
      productData.sellerName || "NEXORA Seller";

    category.textContent =
      productData.category || "General";

    description.textContent =
      productData.description ||
      "No product description available.";


    // Image
    if(productData.imageUrl){
      productImage.src = productData.imageUrl;
    }else{
      productImage.src =
        "https://via.placeholder.com/500?text=NEXORA+PICKS";
    }

    productImage.onerror = function(){
      this.src =
        "https://via.placeholder.com/500?text=NEXORA+PICKS";
    };


    // Stock
    const stock = Number(productData.stock || 0);

    if(stock > 0){
      stockText.textContent =
        "✓ In Stock (" + stock + " available)";
    }else{
      stockText.textContent = "❌ Out of Stock";
      cartBtn.disabled = true;
      buyBtn.disabled = true;
    }


    loading.style.display = "none";
    productBox.style.display = "grid";

  }catch(error){

    console.error(error);

    loading.innerHTML =
      "❌ Unable to load product. Please try again.";
  }
}


// Add to existing NEXORA cart
function addToCart(){

  if(!productData) return;

  const stock = Number(productData.stock || 0);

  if(stock <= 0){
    alert("Product is out of stock.");
    return;
  }


  let cart =
    JSON.parse(localStorage.getItem("nexora_cart")) || [];


  const existing =
    cart.find(item => item.id === productData.id);


  if(existing){

    if(existing.qty < stock){
      existing.qty++;
    }else{
      alert("Maximum available stock reached.");
      return;
    }

  }else{

    cart.push({
      id:productData.id,
      name:productData.name || "Product",
      price:Number(productData.price || 0),
      imageUrl:productData.imageUrl || "",
      sellerId:productData.sellerId || "",
      sellerName:productData.sellerName || "",
      qty:1
    });

  }


  localStorage.setItem(
    "nexora_cart",
    JSON.stringify(cart)
  );


  alert("✅ Product added to cart!");
}


// Buy Now
function buyNow(){

  addToCart();

  setTimeout(() => {

    window.location.href =
      "index.html#cart";

  },300);
}


cartBtn.addEventListener("click",addToCart);
buyBtn.addEventListener("click",buyNow);


loadProduct();

</script>

</body>
  </html>
