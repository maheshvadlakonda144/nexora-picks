<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Product | NEXORA PICKS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f1f3f6;
  font-family:Arial,sans-serif;
  color:#17202a;
}

.header{
  background:#2874f0;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky;
  top:0;
  z-index:10;
}

.back{
  color:white;
  text-decoration:none;
  font-size:30px;
  line-height:1;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
}

.product{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 12px #0001;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.photo{
  min-height:480px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.photo img{
  max-width:100%;
  max-height:450px;
  object-fit:contain;
  border-radius:12px;
}

.emoji{
  font-size:130px;
}

.info{
  padding:35px;
}

.category{
  display:inline-block;
  background:#eef4ff;
  color:#2874f0;
  padding:7px 12px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
}

.name{
  font-size:34px;
  margin:18px 0 12px;
  font-weight:800;
  line-height:1.2;
}

.price{
  font-size:32px;
  font-weight:800;
  margin:15px 0;
}

.stock{
  color:#188038;
  font-weight:bold;
  font-size:18px;
  margin:18px 0;
}

.seller{
  background:#f1f5ff;
  padding:16px;
  border-radius:12px;
  margin:20px 0;
  font-size:17px;
}

.detailsTitle{
  font-size:23px;
  font-weight:bold;
  margin-top:25px;
}

.description{
  color:#555;
  font-size:17px;
  line-height:1.6;
  margin-top:10px;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:30px;
}

button{
  border:0;
  border-radius:8px;
  padding:16px 22px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
}

.cart{
  background:#ffb000;
  color:white;
}

.buy{
  background:#ff641f;
  color:white;
}

.message{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:14px;
  font-size:20px;
  box-shadow:0 2px 12px #0001;
}

.message a{
  color:#2874f0;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:700px){

  .header{
    padding:13px;
  }

  .logo{
    font-size:20px;
  }

  .product{
    grid-template-columns:1fr;
  }

  .photo{
    min-height:330px;
  }

  .photo img{
    max-height:300px;
  }

  .info{
    padding:25px;
  }

  .name{
    font-size:28px;
  }

  .price{
    font-size:28px;
  }

  .actions{
    flex-direction:column;
  }

  button{
    width:100%;
  }

}

</style>

</head>


<body>


<header class="header">

  <a
    class="back"
    href="index.html"
    aria-label="Back">

    ‹

  </a>

  <div class="logo">

    NEXORA PICKS

  </div>

</header>



<main class="container">


  <div
    id="loading"
    class="message">

    Loading product...

  </div>



  <div
    id="productBox"
    class="product"
    style="display:none">


    <div class="photo">


      <img
        id="productImage"
        style="display:none"
        alt="Product">


      <div
        id="productEmoji"
        class="emoji">

        🛍️

      </div>


    </div>



    <div class="info">


      <div
        id="category"
        class="category">

        Featured

      </div>



      <div
        id="name"
        class="name">

        Product

      </div>



      <div
        id="price"
        class="price">

        ₹0

      </div>



      <div
        id="stock"
        class="stock">

        ✓ In Stock

      </div>



      <div class="seller">

        🏪 <b>Seller:</b>

        <span id="seller">
          NEXORA PICKS
        </span>

      </div>



      <div class="detailsTitle">

        Product Details

      </div>



      <div
        id="description"
        class="description">

        No description available.

      </div>



      <div class="actions">


        <button
          class="cart"
          id="cartBtn">

          🛒 Add to Cart

        </button>



        <button
          class="buy"
          id="buyBtn">

          ⚡ Buy Now

        </button>


      </div>


    </div>


  </div>


</main>



<script type="module">


/* =========================
   FIREBASE IMPORTS
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

  authDomain:
    "nexora-picks-e887f.firebaseapp.com",

  projectId:
    "nexora-picks-e887f",

  storageBucket:
    "nexora-picks-e887f.firebasestorage.app",

  messagingSenderId:
    "621359003619",

  appId:
    "1:621359003619:web:483add8bfcd0241f4192d",

  measurementId:
    "G-LSMJ6QLLPW"

};



const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);



/* =========================
   GET ELEMENT
========================= */

const $ = id =>
  document.getElementById(id);



/* =========================
   PRODUCT ID
========================= */

const params =
  new URLSearchParams(
    location.search
  );


const productId =
  params.get("id");



/* =========================
   MONEY FORMAT
========================= */

function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}



/* =========================
   ADD PRODUCT TO CART
========================= */

function addToCart(product){


  let cart = [];


  try{

    cart =
      JSON.parse(
        localStorage.getItem(
          "nexora_cart"
        ) || "[]"
      );


    if(!Array.isArray(cart)){

      cart = [];

    }

  }catch(error){

    cart = [];

  }



  const existing =
    cart.find(
      item =>
        item.id === product.id
    );



  if(existing){

    existing.qty =
      Number(existing.qty || 1) + 1;

  }else{


    cart.push({

      id:
        product.id,

      name:
        product.name ||
        product.title ||
        "Product",

      price:
        Number(product.price || 0),

      image:
        product.imageUrl ||
        product.image ||
        "",

      emoji:
        product.emoji ||
        "🛍️",

      sellerName:
        product.sellerName ||
        product.storeName ||
        "NEXORA PICKS",

      qty:1

    });


  }



  localStorage.setItem(

    "nexora_cart",

    JSON.stringify(cart)

  );


  alert(
    "Added to cart 🛒"
  );

}



/* =========================
   SHOW ERROR
========================= */

function showUnavailable(message){

  $("loading").innerHTML =
    message +
    "<br><br>" +
    "<a href='index.html'>" +
    "← Back to Products" +
    "</a>";

}



/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){


  /* -------------------------
     NO PRODUCT ID
  ------------------------- */

  if(!productId){

    showUnavailable(
      "Product not found."
    );

    return;

  }



  try{


    /* -------------------------
       GET PRODUCT DOCUMENT
    ------------------------- */

    const ref =
      doc(
        db,
        "products",
        productId
      );


    const snap =
      await getDoc(ref);



    /* -------------------------
       PRODUCT NOT FOUND
    ------------------------- */

    if(!snap.exists()){

      showUnavailable(
        "Product not found."
      );

      return;

    }



    /* -------------------------
       PRODUCT DATA
    ------------------------- */

    const p = {

      id:
        snap.id,

      ...snap.data()

    };



    /* =========================
       IMPORTANT APPROVAL CHECK
       
       ONLY:
       approvalStatus = approved
       AND
       active = true
       
       PRODUCTS ARE DISPLAYED
    ========================= */

    if(
      p.approvalStatus !==
        "approved" ||
      p.active !== true
    ){

      showUnavailable(
        "This product is currently unavailable."
      );

      return;

    }



    /* -------------------------
       PRODUCT INFORMATION
    ------------------------- */

    const name =
      p.name ||
      p.title ||
      "Product";


    const price =
      Number(
        p.price || 0
      );


    const stock =
      Number(
        p.stock || 0
      );


    /* Supports both image fields */

    const image =
      p.imageUrl ||
      p.image ||
      "";


    const emoji =
      p.emoji ||
      "🛍️";


    const seller =
      p.sellerName ||
      p.storeName ||
      "NEXORA PICKS";


    const category =
      p.category ||
      "Featured";


    const description =
      p.description ||
      "No product description available.";



    /* -------------------------
       PAGE TITLE
    ------------------------- */

    document.title =
      name +
      " | NEXORA PICKS";



    /* -------------------------
       DISPLAY PRODUCT
    ------------------------- */

    $("category").textContent =
      category;


    $("name").textContent =
      name;


    $("price").textContent =
      money(price);


    $("seller").textContent =
      seller;


    $("description").textContent =
      description;



    /* =========================
       STOCK
    ========================= */

    if(stock > 0){


      $("stock").textContent =
        "✓ In Stock (" +
        stock +
        " available)";


      $("stock").style.color =
        "#188038";


      $("cartBtn").disabled =
        false;


      $("buyBtn").disabled =
        false;


      $("cartBtn").style.opacity =
        "1";


      $("buyBtn").style.opacity =
        "1";


    }else{


      $("stock").textContent =
        "✕ Out of Stock";


      $("stock").style.color =
        "#d93025";


      $("cartBtn").disabled =
        true;


      $("buyBtn").disabled =
        true;


      $("cartBtn").style.opacity =
        ".5";


      $("buyBtn").style.opacity =
        ".5";


    }



    /* =========================
       PRODUCT IMAGE
    ========================= */

    if(image){


      $("productImage").src =
        image;


      $("productImage").alt =
        name;


      $("productImage").style.display =
        "block";


      $("productEmoji").style.display =
        "none";



      /* IMAGE ERROR FALLBACK */

      $("productImage").onerror =
        function(){


          this.style.display =
            "none";


          $("productEmoji").textContent =
            emoji;


          $("productEmoji").style.display =
            "block";


        };


    }else{


      $("productEmoji").textContent =
        emoji;


      $("productEmoji").style.display =
        "block";


      $("productImage").style.display =
        "none";


    }



    /* =========================
       ADD TO CART BUTTON
    ========================= */

    $("cartBtn").onclick =
      function(){


        if(stock <= 0){

          return;

        }


        addToCart(p);


      };



    /* =========================
       BUY NOW BUTTON
    ========================= */

    $("buyBtn").onclick =
      function(){


        if(stock <= 0){

          return;

        }


        addToCart(p);


        /*
          Your current marketplace
          uses cart.html for checkout.
        */

        location.href =
          "cart.html";


      };



    /* -------------------------
       SHOW PRODUCT
    ------------------------- */

    $("loading").style.display =
      "none";


    $("productBox").style.display =
      "grid";


  }catch(error){


    console.error(
      "Product loading error:",
      error
    );


    $("loading").innerHTML =
      "Unable to load product.<br><br>" +

      "<a href='index.html'>" +
      "← Back to Products" +
      "</a>";


  }

}



/* =========================
   START
========================= */

loadProduct();


</script>


</body>

</html>
