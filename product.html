<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Product | NEXORA PICKS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f1f3f6;
font-family:Arial,sans-serif;
color:#17202a
}

.top{
background:#2874f0;
color:white;
padding:12px 16px;
position:sticky;
top:0;
z-index:10
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
gap:15px
}

.logo{
font-size:22px;
font-weight:900
}

.logo b{
color:#ffe500
}

.back{
background:white;
color:#2874f0;
border:0;
padding:9px 14px;
border-radius:5px;
font-weight:800
}

.wrap{
max-width:1100px;
margin:25px auto;
padding:0 15px
}

.product{
background:white;
border-radius:14px;
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px
}

.photo{
height:450px;
background:#f7f8fa;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.photo img{
width:100%;
height:100%;
object-fit:contain
}

.emoji{
font-size:100px
}

.category{
color:#2874f0;
font-weight:800;
text-transform:uppercase;
font-size:13px
}

h1{
font-size:32px;
margin:10px 0
}

.description{
color:#667085;
line-height:1.6;
font-size:16px
}

.price{
font-size:30px;
font-weight:900;
margin:18px 0
}

.stock{
color:#16803c;
font-weight:700;
margin-bottom:18px
}

.seller{
background:#f7f8fa;
padding:14px;
border-radius:8px;
margin:15px 0
}

button.action{
width:100%;
border:0;
padding:14px;
border-radius:7px;
font-weight:900;
font-size:16px;
margin-top:10px;
cursor:pointer
}

.cart{
background:#eaf2ff;
color:#2874f0
}

.buy{
background:#ff7a00;
color:white
}

.message{
margin-top:12px;
font-weight:700
}

@media(max-width:700px){
.product{
grid-template-columns:1fr
}

.photo{
height:330px
}

h1{
font-size:26px
}
}
</style>
</head>

<body>

<header class="top">

<div class="nav">

<button class="back" onclick="history.back()">
← Back
</button>

<div class="logo">
NEXORA <b>PICKS</b>
</div>

</div>

</header>

<main class="wrap">

<div id="loading">
Loading product...
</div>

<div id="productBox"></div>

</main>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{
getFirestore,
doc,
getDoc
}
from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",
authDomain:"nexora-picks-e887f.firebaseapp.com",
projectId:"nexora-picks-e887f",
storageBucket:"nexora-picks-e887f.firebasestorage.app",
messagingSenderId:"621359003619",
appId:"1:621359003619:web:483add8bfcd0241f4192d",
measurementId:"G-LSMJ6QLLPW"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const id=new URLSearchParams(location.search).get("id");

const box=document.getElementById("productBox");
const loading=document.getElementById("loading");

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));

let product=null;

async function loadProduct(){

if(!id){

loading.textContent="Product not found.";
return;
}

try{

const snap=await getDoc(doc(db,"products",id));

if(!snap.exists()){

loading.textContent="Product not found.";
return;
}

product={
id:snap.id,
...snap.data()
};

loading.style.display="none";

const img=product.imageUrl||"";
const price=Number(product.price)||0;
const stock=Number(product.stock)||0;

box.innerHTML=`

<div class="product">

<div class="photo">

${img?

`<img src="${esc(img)}"
alt="${esc(product.name||"Product")}"
onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`

:""}

<span class="emoji" style="${img?"display:none":""}">
${product.emoji||"🛍️"}
</span>

</div>

<div>

<div class="category">
${esc(product.category||"Featured")}
</div>

<h1>
${esc(product.name||"Product")}
</h1>

<div class="description">
${esc(product.description||"No description available.")}
</div>

<div class="price">
₹${price}
</div>

<div class="stock">
${stock>0?stock+" in stock":"Out of stock"}
</div>

<div class="seller">
<b>Sold by</b><br>
${esc(product.sellerName||"NEXORA PICKS Seller")}
</div>

<button class="action cart"
onclick="addCart()"
${stock<=0?"disabled":""}>
🛒 Add to Cart
</button>

<button class="action buy"
onclick="buyNow()"
${stock<=0?"disabled":""}>
Buy Now
</button>

<div class="message" id="message"></div>

</div>

</div>
`;

}catch(e){

loading.textContent="Unable to load product.";

console.error(e);

}

}

window.addCart=()=>{

if(!product)return;

let cart=JSON.parse(
localStorage.getItem("nexora_cart")||"[]"
);

let item=cart.find(x=>x.id===product.id);

if(item){

item.qty++;

}else{

cart.push({
id:product.id,
name:product.name,
price:Number(product.price)||0,
image:product.imageUrl||"",
emoji:product.emoji||"🛍️",
sellerId:product.sellerId,
qty:1
});

}

localStorage.setItem(
"nexora_cart",
JSON.stringify(cart)
);

document.getElementById("message").textContent=
"Added to cart ✓";

};

window.buyNow=()=>{

addCart();

setTimeout(()=>{
location.href="index.html";
},500);

};

loadProduct();

</script>

</body>
</html>
