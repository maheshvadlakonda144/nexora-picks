<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Seller Dashboard | NEXORA PICKS</title>

<style>

*{
box-sizing:border-box;
}

:root{
--primary:#ff5a3c;
--dark:#172033;
--muted:#667085;
--bg:#f4f6f9;
--white:#ffffff;
--border:#e5e7eb;
--green:#16803c;
--orange:#d97706;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--dark);
}

header{
background:var(--dark);
color:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
position:sticky;
top:0;
z-index:100;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo h1{
margin:0;
font-size:20px;
}

.logo span{
font-size:13px;
color:#cbd5e1;
}

.logoutBtn{
background:transparent;
color:white;
border:1px solid #475569;
border-radius:8px;
padding:10px 16px;
font-weight:bold;
cursor:pointer;
font-size:14px;
}

.logoutBtn:hover{
background:#ffffff10;
}

.wrap{
max-width:1100px;
margin:auto;
padding:24px 18px 40px;
}

.loading,
.empty{
text-align:center;
padding:35px 15px;
color:var(--muted);
}

.hero{
background:linear-gradient(135deg,#ff5a3c,#ff7a3d);
color:white;
padding:28px;
border-radius:16px;
margin-bottom:20px;
}

.hero h2{
margin:0 0 8px;
font-size:26px;
}

.hero p{
margin:0;
opacity:.95;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.stat{
background:white;
border:1px solid var(--border);
border-radius:14px;
padding:20px;
}

.statLabel{
color:var(--muted);
font-size:14px;
margin-bottom:10px;
}

.statNumber{
font-size:28px;
font-weight:bold;
color:var(--dark);
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.actionBtn{
border:0;
border-radius:8px;
padding:13px 18px;
font-size:15px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
}

.primaryBtn{
background:var(--primary);
color:white;
}

.secondaryBtn{
background:white;
color:var(--dark);
border:1px solid var(--border);
}

.section{
background:white;
border:1px solid var(--border);
border-radius:14px;
margin-bottom:20px;
overflow:hidden;
}

.sectionHead{
padding:20px;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.sectionHead h2{
margin:0;
font-size:19px;
}

.product{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding:16px 20px;
border-bottom:1px solid var(--border);
}

.product:last-child{
border-bottom:0;
}

.productLeft{
display:flex;
align-items:center;
gap:14px;
min-width:0;
}

.productImageBox{
width:60px;
height:60px;
border-radius:10px;
background:#f1f3f6;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
flex-shrink:0;
}

.productImage{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.productInfo{
min-width:0;
}

.productName{
font-weight:bold;
font-size:16px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.productDetails{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:7px;
font-size:14px;
color:var(--muted);
}

.productPrice{
font-weight:bold;
color:var(--dark);
}

.badge{
display:inline-block;
padding:7px 11px;
border-radius:20px;
font-size:12px;
font-weight:bold;
white-space:nowrap;
}

.approved{
background:#dcfce7;
color:var(--green);
}

.pending{
background:#fef3c7;
color:var(--orange);
}

.order{
padding:18px 20px;
border-bottom:1px solid var(--border);
}

.order:last-child{
border-bottom:0;
}

.orderTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:10px;
}

.orderId{
font-size:13px;
color:var(--muted);
word-break:break-all;
margin-top:5px;
}

.status{
padding:6px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
background:#fef3c7;
color:#92400e;
white-space:nowrap;
}

.orderTotal{
font-size:15px;
}

@media(max-width:700px){

.wrap{
padding:16px 12px 30px;
}

header{
padding:14px;
}

.logo h1{
font-size:17px;
}

.logo span{
display:none;
}

.hero{
padding:22px 18px;
}

.hero h2{
font-size:22px;
}

.stats{
grid-template-columns:1fr;
gap:10px;
}

.stat{
padding:16px;
}

.product{
padding:15px;
align-items:flex-start;
flex-direction:column;
}

.productLeft{
width:100%;
}

.badge{
margin-left:74px;
}

.actions{
display:grid;
grid-template-columns:1fr;
}

.actionBtn{
width:100%;
}

.sectionHead{
padding:18px 15px;
}

.order{
padding:16px 15px;
}

}

</style>

</head>

<body>


<header>

<div class="logo">

<div>
<h1>NEXORA PICKS</h1>
<span>Seller Dashboard</span>
</div>

</div>


<button
class="logoutBtn"
onclick="logoutSeller()">

Logout

</button>

</header>


<div class="wrap">

<div id="dashboard">

<div class="loading">

Loading your dashboard...

</div>

</div>

</div>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{
getFirestore,
collection,
query,
where,
doc,
getDoc,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};


const app=
initializeApp(firebaseConfig);


const auth=
getAuth(app);


const db=
getFirestore(app);


const dashboard=
document.getElementById("dashboard");


let currentSeller=null;


/* CHECK SELLER LOGIN */

onAuthStateChanged(
auth,
async user=>{


if(!user){

location.href="seller-register.html";

return;

}


try{


const sellerRef=
doc(
db,
"sellers",
user.uid
);


const sellerSnap=
await getDoc(
sellerRef
);


if(!sellerSnap.exists()){


dashboard.innerHTML=

`

<div class="section">

<div class="empty">

<h2>
Seller Account Not Found
</h2>

<p>
This account is not registered as a seller.
</p>

<br>

<a
href="seller-register.html"
class="actionBtn primaryBtn">

Register as Seller

</a>

</div>

</div>

`;


return;

}


const sellerData=
sellerSnap.data();


const sellerApproved=

sellerData.status==="approved" &&

sellerData.sellerVerified===true;


/* UNAPPROVED SELLER */

if(!sellerApproved){


let title=
"Waiting for Admin Approval";


let message=
"Your seller application is being reviewed. You will get dashboard access after approval.";


if(
sellerData.status==="rejected"
){

title=
"Seller Application Rejected";


message=
"Your seller application was rejected. Please contact NEXORA PICKS support.";

}


dashboard.innerHTML=

`

<div class="section">

<div class="empty">

<h2>
${title}
</h2>

<p>
${message}
</p>

<br>

<p>

Status:

<b>

${escapeHtml(

String(
sellerData.status||
"pending"
).toUpperCase()

)}

</b>

</p>

<br>

<button
class="actionBtn secondaryBtn"
onclick="logoutSeller()">

Logout

</button>

</div>

</div>

`;


return;

}


/* APPROVED SELLER */

currentSeller={

id:user.uid,

...sellerData

};


/* SHOW DASHBOARD */

showDashboard();


/* LOAD DATA */

loadProducts(
user.uid
);


loadOrders(
user.uid
);


}
catch(error){


console.error(error);


dashboard.innerHTML=

`

<div class="section">

<div class="empty">

<h2>
Unable to load dashboard
</h2>

<p>
Please refresh and try again.
</p>

</div>

</div>

`;


}


}
);



/* SHOW DASHBOARD */

function showDashboard(){


const sellerName=

currentSeller.storeName||

currentSeller.name||

currentSeller.fullName||

"Seller";


dashboard.innerHTML=

`

<div class="hero">

<h2>

Welcome, ${escapeHtml(sellerName)}

</h2>

<p>

Manage your products and customer orders from one place.

</p>

</div>


<div class="stats">


<div class="stat">

<div class="statLabel">

Total Products

</div>

<div
class="statNumber"
id="productCount">

0

</div>

</div>


<div class="stat">

<div class="statLabel">

Live Products

</div>

<div
class="statNumber"
id="liveProductCount">

0

</div>

</div>


<div class="stat">

<div class="statLabel">

Total Orders

</div>

<div
class="statNumber"
id="orderCount">

0

</div>

</div>


</div>


<div class="actions">


<a
href="add-product.html"
class="actionBtn primaryBtn">

Add Product

</a>


<a
href="seller-products.html"
class="actionBtn secondaryBtn">

My Products

</a>


<a
href="seller-orders.html"
class="actionBtn secondaryBtn">

Manage Orders

</a>


</div>


<div class="section">

<div class="sectionHead">

<h2>
Recent Products
</h2>

</div>


<div id="productsList">

<div class="loading">

Loading products...

</div>

</div>

</div>


<div class="section">

<div class="sectionHead">

<h2>
Recent Orders
</h2>

</div>


<div id="ordersList">

<div class="loading">

Loading orders...

</div>

</div>

</div>

`;


}



/* LOAD PRODUCTS */

function loadProducts(sellerId){


const productsQuery=

query(

collection(
db,
"products"
),

where(
"sellerId",
"==",
sellerId
)

);


onSnapshot(

productsQuery,

snap=>{


const products=

snap.docs.map(
productDoc=>({

id:productDoc.id,

...productDoc.data()

})
);


const count=
document.getElementById(
"productCount"
);


if(count){

count.textContent=
products.length;

}


const liveProducts=

products.filter(
product=>

product.active===true||

product.status==="approved"||

product.approvalStatus==="approved"
);


const liveCount=
document.getElementById(
"liveProductCount"
);


if(liveCount){

liveCount.textContent=
liveProducts.length;

}


const list=
document.getElementById(
"productsList"
);


if(!list){

return;

}


if(!products.length){


list.innerHTML=

`

<div class="empty">

No products added yet.

<br><br>

<a
href="add-product.html"
class="actionBtn primaryBtn">

Add Your First Product

</a>

</div>

`;


return;

}


/* SHOW PRODUCTS */

list.innerHTML=

products

.slice(
0,
5
)

.map(
product=>{


const image=

product.image||

product.imageUrl||

product.productImage||

product.productImageUrl||

product.imageURL||

"";


const emoji=

product.emoji||

product.emojiFallback||

"🛍️";


const isApproved=

product.active===true||

product.status==="approved"||

product.approvalStatus==="approved";


const productName=

product.name||

product.productName||

"Product";


const productPrice=

Number(

product.price||

product.productPrice||

0

).toLocaleString(
"en-IN"
);


const productStock=

Number(

product.stock||

product.quantity||

0

);


return `

<div class="product">


<div class="productLeft">


<div
class="productImageBox">

${
image
?

`

<img
class="productImage"
src="${escapeHtml(image)}"
alt="${escapeHtml(productName)}"
onerror="this.remove()">

`

:

emoji

}

</div>


<div
class="productInfo">


<div class="productName">

${escapeHtml(productName)}

</div>


<div class="productDetails">

<span class="productPrice">

₹${productPrice}

</span>


<span>

Stock: ${productStock}

</span>

</div>


</div>


</div>


<div
class="badge ${

isApproved

?

"approved"

:

"pending"

}">

${

isApproved

?

"Live"

:

"Pending"

}

</div>


</div>

`;

}

)

.join("");


},

error=>{


console.error(error);


const list=
document.getElementById(
"productsList"
);


if(list){

list.innerHTML=

`

<div class="empty">

Unable to load products.

</div>

`;

}


}

);


}



/* LOAD ORDERS */

function loadOrders(sellerId){


const ordersQuery=

query(

collection(
db,
"orders"
),

where(
"sellerId",
"==",
sellerId
)

);


onSnapshot(

ordersQuery,

snap=>{


const orders=

snap.docs.map(
orderDoc=>({

id:orderDoc.id,

...orderDoc.data()

})
);


const count=
document.getElementById(
"orderCount"
);


if(count){

count.textContent=
orders.length;

}


const list=
document.getElementById(
"ordersList"
);


if(!list){

return;

}


if(!orders.length){


list.innerHTML=

`

<div class="empty">

No customer orders yet.

</div>

`;


return;

}


list.innerHTML=

orders

.slice(
0,
5
)

.map(
order=>{


const total=

Number(

order.total||

order.totalAmount||

0

).toLocaleString(
"en-IN"
);


return `

<div class="order">


<div class="orderTop">


<div>


<b>

Order

</b>


<div class="orderId">

${escapeHtml(order.id)}

</div>


</div>


<div class="status">

${escapeHtml(

String(

order.status||

"pending"

).toUpperCase()

)}

</div>


</div>


<div class="orderTotal">

Total:

<b>

₹${total}

</b>

</div>


</div>

`;

}

)

.join("");


},

error=>{


console.error(error);


const list=
document.getElementById(
"ordersList"
);


if(list){

list.innerHTML=

`

<div class="empty">

Unable to load orders.

</div>

`;

}


}

);


}



/* LOGOUT */

window.logoutSeller=

async function(){


await signOut(
auth
);


location.href=
"index.html";


};



/* ESCAPE HTML */

function escapeHtml(value){


return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);


}

</script>

</body>

  </html>
