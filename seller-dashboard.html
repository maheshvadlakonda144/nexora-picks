<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>NEXORA PICKS | Seller Center</title>


<style>

/* =========================
   RESET
========================= */

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f7;
color:#172033;
}


/* =========================
   HEADER
========================= */

header{
background:#142238;
color:white;
padding:22px 0;
}

.headerContainer{
max-width:1100px;
margin:auto;
padding:0 25px;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.logoBox{
display:flex;
flex-direction:column;
}

.logo{
font-size:30px;
font-weight:800;
letter-spacing:1px;
}

.logoSub{
font-size:19px;
color:#dce5f2;
margin-top:3px;
}

.userArea{
display:flex;
align-items:center;
gap:18px;
}

.userInfo{
display:flex;
align-items:center;
gap:10px;
}

.userAvatar{
width:52px;
height:52px;
border-radius:50%;
background:#e7eef8;
color:#142238;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

.userName{
font-size:18px;
font-weight:bold;
}

.approvedSeller{
color:#74d38d;
font-size:15px;
margin-top:4px;
}

.logoutBtn{
background:white;
color:#172033;
border:0;
border-radius:10px;
padding:15px 25px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}


/* =========================
   MAIN
========================= */

.wrap{
max-width:1100px;
margin:auto;
padding:28px 25px 40px;
}


/* =========================
   LOADING
========================= */

.loading,
.empty{
text-align:center;
padding:45px 20px;
color:#667085;
}


/* =========================
   WELCOME HERO
========================= */

.welcomeHero{
background:
linear-gradient(
135deg,
#fff6ef,
#f4f5ff,
#ffe4e1
);

border-radius:18px;
padding:30px;
margin-bottom:24px;

display:flex;
align-items:center;
justify-content:space-between;
gap:20px;

box-shadow:
0 8px 25px
rgba(20,34,56,.08);
}

.welcomeText h2{
font-size:34px;
margin:0 0 10px;
}

.welcomeText p{
font-size:18px;
color:#586273;
line-height:1.6;
margin:0;
max-width:500px;
}

.approvalBox{
background:
rgba(255,255,255,.75);

padding:22px;
border-radius:15px;

display:flex;
align-items:center;
gap:15px;

min-width:260px;
}

.approvalIcon{
width:48px;
height:48px;
border-radius:50%;
background:#1ca35c;
color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;
font-weight:bold;
}

.approvalTitle{
font-size:18px;
font-weight:bold;
margin-bottom:5px;
}

.approvalText{
font-size:14px;
color:#667085;
line-height:1.5;
}


/* =========================
   STATS
========================= */

.stats{
display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

margin-bottom:32px;
}

.statCard{
background:white;
border-radius:16px;
padding:25px;

box-shadow:
0 5px 20px
rgba(20,34,56,.08);
}

.statIcon{
font-size:42px;
margin-bottom:15px;
}

.statNumber{
font-size:38px;
font-weight:800;
margin-bottom:8px;
}

.statLabel{
font-size:16px;
color:#667085;
}


/* =========================
   QUICK ACTIONS
========================= */

.sectionTitle{
font-size:28px;
margin:
0 0 20px;
}

.quickActions{
display:grid;

grid-template-columns:
repeat(3,1fr);

gap:20px;

margin-bottom:35px;
}

.quickCard{
border-radius:16px;
padding:28px 20px;

text-align:center;

text-decoration:none;

box-shadow:
0 5px 20px
rgba(20,34,56,.08);

transition:.2s;
}

.quickCard:hover{
transform:
translateY(-3px);
}

.quickIcon{
font-size:42px;
margin-bottom:15px;
}

.quickTitle{
font-size:21px;
font-weight:bold;
margin-bottom:8px;
}

.quickText{
font-size:15px;
color:#586273;
line-height:1.4;
}

.addProduct{
background:
linear-gradient(
135deg,
#ff5d3d,
#ff7553
);

color:white;
}

.addProduct .quickText{
color:#fff;
}

.myProducts{
background:
linear-gradient(
135deg,
#e6efff,
#d8e5fa
);

color:#172033;
}

.orders{
background:
linear-gradient(
135deg,
#d9f5e6,
#c9efda
);

color:#172033;
}


/* =========================
   SECTION
========================= */

.sectionHeader{
display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:16px;
}

.sectionHeader h2{
margin:0;
font-size:27px;
}

.viewAll{
color:#2864b4;
font-weight:bold;
text-decoration:none;
font-size:16px;
}


/* =========================
   RECENT PRODUCTS
========================= */

.productsBox{
background:white;
border-radius:17px;

padding:8px 20px;

margin-bottom:35px;

box-shadow:
0 5px 20px
rgba(20,34,56,.08);
}

.productRow{
display:grid;

grid-template-columns:
75px
1fr
110px
130px;

align-items:center;

gap:20px;

padding:18px 0;

border-bottom:
1px solid #edf0f5;
}

.productRow:last-child{
border-bottom:0;
}

.productImageBox{
width:70px;
height:70px;

background:#f2f4f8;

border-radius:12px;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;

font-size:30px;
}

.productImage{
width:100%;
height:100%;
object-fit:cover;
}

.productName{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.productMeta{
font-size:15px;
color:#667085;
}

.productPrice{
font-size:20px;
font-weight:bold;
}

.statusApproved{
justify-self:end;

background:#ddf5e6;

color:#287647;

padding:9px 16px;

border-radius:25px;

font-size:14px;
font-weight:bold;
}

.statusPending{
justify-self:end;

background:#fff3cd;

color:#856404;

padding:9px 16px;

border-radius:25px;

font-size:14px;
font-weight:bold;
}


/* =========================
   ORDERS
========================= */

.ordersBox{
background:white;

border-radius:17px;

padding:35px 20px;

text-align:center;

box-shadow:
0 5px 20px
rgba(20,34,56,.08);

margin-bottom:30px;
}

.emptyOrderIcon{
width:80px;
height:80px;

margin:auto auto 15px;

border-radius:50%;

background:#edf1f7;

display:flex;
align-items:center;
justify-content:center;

font-size:40px;
}

.ordersBox h3{
font-size:22px;
margin:10px 0;
}

.ordersBox p{
color:#667085;
margin:0;
font-size:16px;
}


/* =========================
   ORDER ROW
========================= */

.orderRow{
padding:18px 0;
border-bottom:1px solid #edf0f5;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.orderRow:last-child{
border-bottom:0;
}

.orderId{
font-size:14px;
color:#667085;
margin-top:5px;
word-break:break-all;
}

.orderAmount{
font-size:18px;
font-weight:bold;
}

.orderStatus{
background:#fff3cd;
color:#856404;
padding:8px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}


/* =========================
   FOOTER
========================= */

footer{
text-align:center;

padding-top:25px;

border-top:
1px solid #d8dee8;

color:#667085;

font-size:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

.stats{
grid-template-columns:
repeat(2,1fr);
}

.quickActions{
grid-template-columns:
1fr;
}

.welcomeHero{
flex-direction:column;
align-items:flex-start;
}

.approvalBox{
width:100%;
}

}


@media(max-width:600px){

header{
padding:17px 0;
}

.headerContainer{
padding:0 15px;
}

.logo{
font-size:22px;
}

.logoSub{
font-size:15px;
}

.userInfo{
display:none;
}

.logoutBtn{
padding:11px 16px;
font-size:14px;
}

.wrap{
padding:20px 14px;
}

.welcomeHero{
padding:22px;
}

.welcomeText h2{
font-size:27px;
}

.welcomeText p{
font-size:16px;
}

.stats{
gap:12px;
}

.statCard{
padding:18px;
}

.statNumber{
font-size:30px;
}

.statIcon{
font-size:32px;
}

.sectionTitle{
font-size:25px;
}

.productRow{
grid-template-columns:
60px
1fr;

gap:12px;
}

.productImageBox{
width:60px;
height:60px;
}

.productPrice{
grid-column:
2;

font-size:18px;
}

.statusApproved,
.statusPending{
grid-column:
2;

justify-self:start;
}

}

</style>

</head>


<body>


<header>

<div class="headerContainer">


<div class="logoBox">

<div class="logo">

NEXORA PICKS

</div>

<div class="logoSub">

Seller Center

</div>

</div>


<div class="userArea">


<div class="userInfo">

<div class="userAvatar">

👤

</div>


<div>

<div
class="userName"
id="sellerName">

Seller

</div>


<div class="approvedSeller">

Approved Seller

</div>

</div>

</div>


<button
class="logoutBtn"
onclick="logoutSeller()">

Logout

</button>


</div>


</div>

</header>



<div class="wrap">


<div id="dashboard">

<div class="loading">

Loading seller dashboard...

</div>

</div>


</div>



<script type="module">


/* =========================
   FIREBASE IMPORTS
========================= */

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{
getFirestore,
collection,
query,
where,
doc,
getDoc,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig={

apiKey:
"AizaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:
"nexora-picks-e887f.firebaseapp.com",

projectId:
"nexora-picks-e887f",

storageBucket:
"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:
"621359003619",

appId:
"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:
"G-LSMJ6QLLPW"

};


/* IMPORTANT:
   Your original API key starts with AIza.
   Replace the apiKey above with your exact original API key.
*/


const app=
initializeApp(
firebaseConfig
);


const auth=
getAuth(app);


const db=
getFirestore(app);


const dashboard=
document.getElementById(
"dashboard"
);


let currentSeller=null;

let productsData=[];

let ordersData=[];


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(

auth,

async user=>{


if(!user){

location.href=
"seller-register.html";

return;

}


try{


const sellerRef=

doc(
db,
"sellers",
user.uid
);


const sellerSnap=

await getDoc(
sellerRef
);


/* SELLER NOT FOUND */

if(!sellerSnap.exists()){


dashboard.innerHTML=

`

<div class="ordersBox">

<div class="emptyOrderIcon">

❌

</div>

<h3>

Seller Account Not Found

</h3>

<p>

This account is not registered as a seller.

</p>

<br>

<a
href="seller-register.html"
class="quickCard addProduct"
style="display:inline-block;padding:15px 25px;">

Register as Seller

</a>

</div>

`;


return;

}


const sellerData=
sellerSnap.data();


const sellerApproved=

sellerData.status==="approved" &&

sellerData.sellerVerified===true;


/* UNAPPROVED SELLER */

if(!sellerApproved){


dashboard.innerHTML=

`

<div class="ordersBox">

<div class="emptyOrderIcon">

⏳

</div>

<h3>

Waiting for Admin Approval

</h3>

<p>

Your seller application is waiting for approval.

</p>

</div>

`;


return;

}


/* APPROVED SELLER */

currentSeller={

id:user.uid,

...sellerData

};


showDashboard();


document.getElementById(
"sellerName"
).textContent=

currentSeller.storeName||

currentSeller.name||

"Seller";


loadProducts(
user.uid
);


loadOrders(
user.uid
);


}catch(error){


console.error(error);


dashboard.innerHTML=

`

<div class="ordersBox">

<h3>

❌ Unable to load dashboard

</h3>

<p>

${escapeHtml(
error.message
)}

</p>

</div>

`;


}


}

);


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard(){


const sellerName=

currentSeller.storeName||

currentSeller.name||

"Seller";


dashboard.innerHTML=

`


<!-- WELCOME -->

<div class="welcomeHero">


<div class="welcomeText">

<h2>

Welcome, ${escapeHtml(sellerName)}! 👋

</h2>

<p>

Your seller account is approved.
Start managing your business with NEXORA PICKS.

</p>

</div>


<div class="approvalBox">


<div class="approvalIcon">

✓

</div>


<div>

<div class="approvalTitle">

Seller Approved

</div>


<div class="approvalText">

You can now manage your products and orders.

</div>

</div>


</div>


</div>



<!-- STATS -->

<div class="stats">


<div class="statCard">

<div class="statIcon">

📦

</div>


<div
class="statNumber"
id="productCount">

0

</div>


<div class="statLabel">

Total Products

</div>

</div>



<div class="statCard">

<div class="statIcon">

🟢

</div>


<div
class="statNumber"
id="liveProductCount">

0

</div>


<div class="statLabel">

Live Products

</div>

</div>



<div class="statCard">

<div class="statIcon">

🛒

</div>


<div
class="statNumber"
id="orderCount">

0

</div>


<div class="statLabel">

Total Orders

</div>

</div>



<div class="statCard">

<div class="statIcon">

₹

</div>


<div
class="statNumber"
id="salesCount">

₹0

</div>


<div class="statLabel">

Total Sales

</div>

</div>


</div>



<!-- QUICK ACTIONS -->

<h2 class="sectionTitle">

Quick Actions

</h2>


<div class="quickActions">


<a
href="add-product.html"
class="quickCard addProduct">

<div class="quickIcon">

➕

</div>


<div class="quickTitle">

Add Product

</div>


<div class="quickText">

List a new product

</div>

</a>



<a
href="seller-products.html"
class="quickCard myProducts">

<div class="quickIcon">

📦

</div>


<div class="quickTitle">

My Products

</div>


<div class="quickText">

View and manage your products

</div>

</a>



<a
href="seller-orders.html"
class="quickCard orders">

<div class="quickIcon">

🛒

</div>


<div class="quickTitle">

Orders

</div>


<div class="quickText">

View customer orders

</div>

</a>


</div>



<!-- RECENT PRODUCTS -->

<div class="sectionHeader">


<h2>

Recent Products

</h2>


<a
href="seller-products.html"
class="viewAll">

View All →

</a>


</div>


<div
class="productsBox"
id="productsList">

Loading products...

</div>



<!-- RECENT ORDERS -->

<div class="sectionHeader">


<h2>

Recent Orders

</h2>


<a
href="seller-orders.html"
class="viewAll">

View All →

</a>


</div>


<div
class="ordersBox"
id="ordersList">

Loading orders...

</div>


<footer>

© 2026 NEXORA PICKS.
All rights reserved.

</footer>


`;

}



/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts(
sellerId
){


const productsQuery=

query(

collection(
db,
"products"
),

where(
"sellerId",
"==",
sellerId
)

);


onSnapshot(

productsQuery,

snap=>{


productsData=

snap.docs.map(

productDoc=>({

id:
productDoc.id,

...productDoc.data()

})

);


updateProducts();


},

error=>{


console.error(error);


const list=

document.getElementById(
"productsList"
);


if(list){

list.innerHTML=

`

<div class="empty">

Unable to load products.

</div>

`;

}


}

);


}


/* =========================
   UPDATE PRODUCTS
========================= */

function updateProducts(){


const productCount=

document.getElementById(
"productCount"
);


const liveProductCount=

document.getElementById(
"liveProductCount"
);


if(productCount){

productCount.textContent=

productsData.length;

}


const liveProducts=

productsData.filter(

product=>

product.active===true||

product.status==="approved"||

product.approvalStatus==="approved"

);


if(liveProductCount){

liveProductCount.textContent=

liveProducts.length;

}


const list=

document.getElementById(
"productsList"
);


if(!list){

return;

}


if(!productsData.length){


list.innerHTML=

`

<div class="empty">

📦 No products yet.

<br><br>

<a
href="add-product.html"
class="viewAll">

Add your first product →

</a>

</div>

`;


return;

}


list.innerHTML=


productsData

.slice(
0,
5
)

.map(

product=>{


const image=

product.image||

product.imageUrl||

product.productImage||

product.productImageUrl||

"";


const name=

product.name||

product.productName||

"Product";


const category=

product.category||

"Other";


const stock=

Number(

product.stock||

product.quantity||

0

);


const price=

Number(

product.price||

product.productPrice||

0

);


const isApproved=

product.active===true||

product.status==="approved"||

product.approvalStatus==="approved";


return `


<div class="productRow">


<div class="productImageBox">


${
image
?

`

<img
class="productImage"
src="${escapeHtml(image)}"
alt="${escapeHtml(name)}"
onerror="
this.style.display='none';
this.parentElement.innerHTML='📦';
">

`

:

`📦`

}


</div>



<div>


<div class="productName">

${escapeHtml(name)}

</div>


<div class="productMeta">

${escapeHtml(category)}

•

Stock: ${stock}

</div>


</div>



<div class="productPrice">

₹${price.toLocaleString("en-IN")}

</div>



<div
class="${
isApproved
?
"statusApproved"
:
"statusPending"
}">


${
isApproved
?
"Approved"
:
"Pending"
}


</div>


</div>


`;


}

)

.join("");


}



/* =========================
   LOAD ORDERS
========================= */

function loadOrders(
sellerId
){


const ordersQuery=

query(

collection(
db,
"orders"
),

where(
"sellerId",
"==",
sellerId
)

);


onSnapshot(

ordersQuery,

snap=>{


ordersData=

snap.docs.map(

orderDoc=>({

id:
orderDoc.id,

...orderDoc.data()

})

);


updateOrders();


},

error=>{


console.error(error);


const list=

document.getElementById(
"ordersList"
);


if(list){

list.innerHTML=

`

<div class="empty">

Unable to load orders.

</div>

`;

}


}

);


}


/* =========================
   UPDATE ORDERS
========================= */

function updateOrders(){


const orderCount=

document.getElementById(
"orderCount"
);


const salesCount=

document.getElementById(
"salesCount"
);


if(orderCount){

orderCount.textContent=

ordersData.length;

}


let totalSales=0;


ordersData.forEach(

order=>{

totalSales+=

Number(

order.total||

order.totalAmount||

0

);

}

);


if(salesCount){

salesCount.textContent=

"₹"+

totalSales.toLocaleString(
"en-IN"
);

}


const list=

document.getElementById(
"ordersList"
);


if(!list){

return;

}


/* NO ORDERS */

if(!ordersData.length){


list.innerHTML=

`

<div class="emptyOrderIcon">

🛒

</div>


<h3>

No orders yet

</h3>


<p>

Your customer orders will appear here.

</p>


`;


return;

}


/* SHOW ORDERS */

list.innerHTML=

ordersData

.slice(
0,
5
)

.map(

order=>{


const total=

Number(

order.total||

order.totalAmount||

0

);


return `


<div class="orderRow">


<div>


<b>

Order

</b>


<div class="orderId">

${escapeHtml(order.id)}

</div>


</div>


<div class="orderAmount">

₹${total.toLocaleString("en-IN")}

</div>


<div class="orderStatus">

${escapeHtml(

String(

order.status||

"pending"

).toUpperCase()

)}

</div>


</div>


`;


}

)

.join("");


}



/* =========================
   LOGOUT
========================= */

window.logoutSeller=

async function(){


try{


await signOut(
auth
);


location.href=
"index.html";


}catch(error){


alert(
"Logout failed: "+
error.message
);


}


};


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){


return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);


}
