<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Seller Dashboard | NEXORA PICKS
</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033
}

header{
background:#2874f0;
color:white;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

header h1{
margin:0;
font-size:22px
}

.logoutBtn{
background:white;
color:#2874f0;
border:0;
border-radius:8px;
padding:10px 14px;
font-weight:bold;
cursor:pointer
}

.wrap{
max-width:1000px;
margin:auto;
padding:20px
}

.loading{
text-align:center;
padding:40px
}

.welcome{
background:linear-gradient(
135deg,
#2874f0,
#1557b0
);
color:white;
padding:25px;
border-radius:15px;
margin-bottom:20px
}

.welcome h2{
margin:0 0 8px
}

.stats{
display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(180px,1fr)
);
gap:15px;
margin-bottom:20px
}

.stat{
background:white;
padding:20px;
border-radius:14px;
box-shadow:
0 2px 10px #00000010
}

.statNumber{
font-size:30px;
font-weight:bold;
color:#2874f0;
margin-top:8px
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px
}

.actionBtn{
border:0;
border-radius:8px;
padding:14px 18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
text-decoration:none
}

.primaryBtn{
background:#2874f0;
color:white
}

.secondaryBtn{
background:white;
color:#172033;
border:1px solid #ddd
}

.section{
background:white;
padding:20px;
border-radius:14px;
margin-bottom:20px;
box-shadow:
0 2px 10px #00000010
}

.sectionHead{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:15px
}

.sectionHead h2{
margin:0
}

.product{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
padding:15px 0;
border-bottom:1px solid #eee
}

.product:last-child{
border-bottom:0
}

.productName{
font-weight:bold
}

.productPrice{
color:#2874f0;
font-weight:bold;
margin-top:5px
}

.order{
padding:15px 0;
border-bottom:1px solid #eee
}

.order:last-child{
border-bottom:0
}

.orderTop{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:8px
}

.orderId{
font-size:13px;
color:#667085;
word-break:break-all
}

.status{
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
background:#fff3cd;
color:#856404
}

.empty{
text-align:center;
padding:30px;
color:#667085
}

@media(max-width:600px){

.wrap{
padding:12px
}

header h1{
font-size:18px
}

.product{
align-items:flex-start;
flex-direction:column
}

}

</style>

</head>

<body>


<header>

<h1>
🏪 Seller Dashboard
</h1>

<button
class="logoutBtn"
onclick="logoutSeller()">

Logout

</button>

</header>


<div class="wrap">

<div id="dashboard">

<div class="loading">

Loading seller dashboard...

</div>

</div>

</div>


<script type="module">


import{

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{

getAuth,

onAuthStateChanged,

signOut

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{

getFirestore,

doc,

getDoc,

collection,

query,

where,

onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};


const app=

initializeApp(
firebaseConfig
);


const auth=

getAuth(
app
);


const db=

getFirestore(
app
);


const dashboard=

document.getElementById(
"dashboard"
);


let currentSeller=null;


/* CHECK SELLER LOGIN */

onAuthStateChanged(

auth,

async user=>{


if(!user){

location.href=

"seller-register.html";

return;

}


const sellerRef=

doc(

db,

"sellers",

user.uid

);


const sellerSnap=

await getDoc(
sellerRef
);


/* CHECK IF SELLER */

if(!sellerSnap.exists()){

await signOut(
auth
);

alert(

"This account is not registered as a seller."

);

location.href=

"seller-register.html";

return;

}


currentSeller={

id:user.uid,

...sellerSnap.data()

};


showDashboard();


loadProducts(
user.uid
);


loadOrders(
user.uid
);

}

);


/* SHOW DASHBOARD */

function showDashboard(){


dashboard.innerHTML=`

<div class="welcome">

<h2>

Welcome, ${escapeHtml(
currentSeller.storeName||
currentSeller.name
)}

</h2>

<div>

Manage your products and customer orders.

</div>

</div>


<div class="stats">

<div class="stat">

<div>
📦 Products
</div>

<div
class="statNumber"
id="productCount">

0

</div>

</div>


<div class="stat">

<div>
🛒 Orders
</div>

<div
class="statNumber"
id="orderCount">

0

</div>

</div>

</div>


<div class="actions">

<a
href="add-product.html"
class="actionBtn primaryBtn">

➕ Add Product

</a>


<a
href="seller-products.html"
class="actionBtn secondaryBtn">

📦 My Products

</a>


<a
href="seller-orders.html"
class="actionBtn secondaryBtn">

🛒 Manage Orders

</a>

</div>


<div class="section">

<div class="sectionHead">

<h2>

📦 Recent Products

</h2>

</div>


<div
id="productsList">

Loading products...

</div>

</div>


<div class="section">

<div class="sectionHead">

<h2>

🛒 Recent Orders

</h2>

</div>


<div
id="ordersList">

Loading orders...

</div>

</div>

`;


}


/* LOAD PRODUCTS */

function loadProducts(
sellerId
){


const productsQuery=

query(

collection(
db,
"products"
),

where(

"sellerId",

"==",

sellerId

)

);


onSnapshot(

productsQuery,

snap=>{


const products=

snap.docs.map(

productDoc=>({

id:productDoc.id,

...productDoc.data()

})

);


const count=

document.getElementById(
"productCount"
);


if(count){

count.textContent=

products.length;

}


const list=

document.getElementById(
"productsList"
);


if(!list){

return;

}


if(!products.length){

list.innerHTML=`

<div class="empty">

No products yet.

<br><br>

<a
href="add-product.html"
class="actionBtn primaryBtn">

➕ Add Your First Product

</a>

</div>

`;

return;

}


list.innerHTML=

products
.slice(
0,
5
)
.map(

product=>`

<div class="product">

<div>

<div
class="productName">

${escapeHtml(
product.name||
"Product"
)}

</div>


<div
class="productPrice">

₹${

Number(
product.price||
0
).toLocaleString(
"en-IN"
)

}

</div>

</div>


<div>

Stock:

${

Number(
product.stock||
0
)

}

</div>

</div>

`

)
.join("");

}

);

}


/* LOAD SELLER ORDERS */

function loadOrders(
sellerId
){


const ordersQuery=

query(

collection(
db,
"orders"
),

where(

"sellerId",

"==",

sellerId

)

);


onSnapshot(

ordersQuery,

snap=>{


const orders=

snap.docs.map(

orderDoc=>({

id:orderDoc.id,

...orderDoc.data()

})

);


const count=

document.getElementById(
"orderCount"
);


if(count){

count.textContent=

orders.length;

}


const list=

document.getElementById(
"ordersList"
);


if(!list){

return;

}


if(!orders.length){

list.innerHTML=`

<div class="empty">

No customer orders yet.

</div>

`;

return;

}


list.innerHTML=

orders
.slice(
0,
5
)
.map(

order=>`

<div class="order">

<div class="orderTop">

<div>

<b>

Order

</b>

<div
class="orderId">

${escapeHtml(
order.id
)}

</div>

</div>


<div
class="status">

${escapeHtml(

String(

order.status||
"pending"

)
.toUpperCase()

)}

</div>

</div>


<div>

Total:

<b>

₹${

Number(
order.total||
0
).toLocaleString(
"en-IN"
)

}

</b>

</div>

</div>

`

)
.join("");

}

);

}


/* LOGOUT */

window.logoutSeller=

async function(){

await signOut(
auth
);

location.href=

"index.html";

};


/* ESCAPE HTML */

function escapeHtml(
value
){

return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


</script>

</body>

</html>
