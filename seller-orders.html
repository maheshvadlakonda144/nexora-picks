<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NEXORA PICKS — Seller Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#17202a;
}

header{
  background:#2874f0;
  color:white;
  padding:18px 16px;
  font-size:22px;
  font-weight:800;
}

main{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.box{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 10px #00000012;
}

h1,h2,h3,h4{
  margin-top:0;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
}

.back{
  background:#eef2f7;
  color:#17202a;
  margin-bottom:15px;
}

.order{
  border:1px solid #dfe4ea;
  border-radius:12px;
  padding:16px;
  margin:15px 0;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
}

.pending{
  background:#fff3cd;
  color:#856404;
}

.accepted{
  background:#dbeafe;
  color:#1d4ed8;
}

.packed{
  background:#ede9fe;
  color:#6d28d9;
}

.shipped{
  background:#cffafe;
  color:#0e7490;
}

.delivered{
  background:#dcfce7;
  color:#15803d;
}

.cancelled{
  background:#fee2e2;
  color:#b91c1c;
}

.product{
  background:#f7f9fc;
  padding:12px;
  border-radius:9px;
  margin:8px 0;
}

.total{
  font-size:20px;
  font-weight:800;
  margin-top:15px;
}

.muted{
  color:#68717d;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#68717d;
}

.error{
  color:#c62828;
  font-weight:700;
}

.actionBox{
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #e5e7eb;
}

.actionTitle{
  font-weight:800;
  margin-bottom:10px;
}

.actionButtons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.acceptBtn{
  background:#2874f0;
  color:white;
}

.packBtn{
  background:#7c3aed;
  color:white;
}

.shipBtn{
  background:#0891b2;
  color:white;
}

.deliverBtn{
  background:#16a34a;
  color:white;
}

.cancelBtn{
  background:#dc2626;
  color:white;
}

.trackingBox{
  margin-top:12px;
}

.trackingBox input{
  width:100%;
  padding:12px;
  border:1px solid #ccd3dd;
  border-radius:8px;
  margin:5px 0 10px;
}

.saveTracking{
  background:#17202a;
  color:white;
  width:100%;
}

.timeline{
  margin-top:18px;
  padding:14px;
  background:#f8fafc;
  border-radius:10px;
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  margin:10px 0;
  color:#9ca3af;
  font-weight:700;
}

.step.active{
  color:#17202a;
}

.step.done{
  color:#16a34a;
}

.dot{
  width:24px;
  height:24px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#e5e7eb;
  font-size:13px;
}

.step.active .dot{
  background:#2874f0;
  color:white;
}

.step.done .dot{
  background:#16a34a;
  color:white;
}

@media(max-width:600px){

header{
  font-size:18px;
}

.actionButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.actionButtons button{
  width:100%;
}

}

</style>
</head>

<body>

<header>
📦 NEXORA PICKS — SELLER ORDERS
</header>

<main>

<button
class="back"
onclick="location.href='nexora-seller.html'">

← Seller Dashboard

</button>


<div class="box">

<h2>
📦 Customer Orders
</h2>

<p class="muted">
Manage customer orders, packing and delivery status.
</p>

<div id="sellerInfo"></div>

</div>


<div class="box">

<div id="orders">
Loading orders...
</div>

</div>

</main>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{
getFirestore,
collection,
query,
where,
onSnapshot,
doc,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};


const app=
initializeApp(firebaseConfig);


const auth=
getAuth(app);


const db=
getFirestore(app);


const $=
id=>document.getElementById(id);


let currentSellerId="";


function esc(v){

return String(v??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#39;"

}[c]));

}


function getStatusClass(status){

const s=
String(status||"pending")
.toLowerCase();

return s;

}


function statusLabel(status){

const s=
String(status||"pending")
.toLowerCase();

const labels={

pending:"Pending",

accepted:"Accepted",

packed:"Packed",

shipped:"Shipped",

delivered:"Delivered",

cancelled:"Cancelled"

};

return labels[s]||"Pending";

}


function statusLevel(status){

const s=
String(status||"pending")
.toLowerCase();

const levels={

pending:1,

accepted:2,

packed:3,

shipped:4,

delivered:5

};

return levels[s]||1;

}


onAuthStateChanged(
auth,

user=>{

if(!user){

$("orders").innerHTML=

`
<p class="error">
Please login as a seller first.
</p>
`;

return;

}


currentSellerId=
user.uid;


$("sellerInfo").innerHTML=

`
<b>Seller:</b>
${esc(
user.displayName||"Seller"
)}
`;


loadOrders(
user.uid
);

}

);


function loadOrders(sellerId){


const q=

query(

collection(db,"orders"),

where(
"sellerIds",
"array-contains",
sellerId
)

);


onSnapshot(

q,

snapshot=>{


if(snapshot.empty){

$("orders").innerHTML=

`
<div class="empty">

<h3>
📭 No orders yet
</h3>

<p>
Customer orders for your products
will appear here.
</p>

</div>
`;

return;

}


let orders=[];


snapshot.forEach(docSnap=>{

orders.push({

id:docSnap.id,

...docSnap.data()

});

});


orders.sort(
(a,b)=>{

const ta=
a.createdAt?.seconds||0;

const tb=
b.createdAt?.seconds||0;

return tb-ta;

}
);


$("orders").innerHTML=

orders.map(order=>{


const myItems=

(order.items||[])

.filter(
item=>
item.sellerId===sellerId
);


const myTotal=

myItems.reduce(

(sum,item)=>

sum+

(Number(item.price)||0)

*

(Number(item.qty)||0),

0

);


const date=

order.createdAt?.seconds

?

new Date(

order.createdAt.seconds*1000

)

.toLocaleString()

:

"Recently";


const status=

String(
order.status||"pending"
)
.toLowerCase();


const level=

statusLevel(
status
);


return`

<div class="order">


<h3>

Order #

${esc(
order.id.slice(0,8)
)}

</h3>


<span
class="status ${getStatusClass(status)}">

${statusLabel(status)}

</span>


<p class="muted">

${esc(date)}

</p>


<hr>


<p>

<b>
Customer:
</b>

${esc(
order.customerName||"Customer"
)}

</p>


<p>

<b>
Mobile:
</b>

${esc(
order.customerPhone||""
)}

</p>


<p>

<b>
Delivery address:
</b>

<br>

${esc(
order.deliveryAddress||""
)}

</p>


<h4>
🛍️ Your Products
</h4>


${
myItems.length

?

myItems.map(
item=>`

<div class="product">

<b>

${esc(
item.name
)}

</b>

<br>

₹${Number(
item.price
)||0}

×

${Number(
item.qty
)||0}

=

<b>

₹${
(Number(item.price)||0)
*
(Number(item.qty)||0)
}

</b>

</div>

`
)
.join("")

:

""

}


<div class="total">

Your order value:

₹${myTotal}

</div>


<p>

<b>
Payment:
</b>

${esc(
order.paymentMethod||"COD"
)}

</p>


${
order.trackingNumber

?

`

<p>

<b>
Tracking Number:
</b>

${esc(
order.trackingNumber
)}

</p>

`

:

""

}


<div class="timeline">


<div class="step ${level>1?"done":level===1?"active":""}">

<div class="dot">

${level>1?"✓":"1"}

</div>

Pending

</div>


<div class="step ${level>2?"done":level===2?"active":""}">

<div class="dot">

${level>2?"✓":"2"}

</div>

Accepted

</div>


<div class="step ${level>3?"done":level===3?"active":""}">

<div class="dot">

${level>3?"✓":"3"}

</div>

Packed

</div>


<div class="step ${level>4?"done":level===4?"active":""}">

<div class="dot">

${level>4?"✓":"4"}

</div>

Shipped

</div>


<div class="step ${level===5?"done":""}">

<div class="dot">

${level===5?"✓":"5"}

</div>

Delivered

</div>


</div>


${
status!=="delivered"

&&

status!=="cancelled"

?

`

<div class="actionBox">


<div class="actionTitle">

Update Order Status

</div>


<div class="actionButtons">


${
status==="pending"

?

`

<button
class="acceptBtn"

onclick="updateOrderStatus(
'${order.id}',
'accepted'
)">

✓ Accept Order

</button>

`

:

""
}


${
status==="accepted"

?

`

<button
class="packBtn"

onclick="updateOrderStatus(
'${order.id}',
'packed'
)">

📦 Mark Packed

</button>

`

:

""
}


${
status==="packed"

?

`

<button
class="shipBtn"

onclick="showTracking(
'${order.id}'
)">

🚚 Ship Order

</button>

`

:

""
}


${
status==="shipped"

?

`

<button
class="deliverBtn"

onclick="updateOrderStatus(
'${order.id}',
'delivered'
)">

✓ Mark Delivered

</button>

`

:

""
}


<button
class="cancelBtn"

onclick="updateOrderStatus(
'${order.id}',
'cancelled'
)">

Cancel

</button>


</div>


${
status==="packed"

?

`

<div
class="trackingBox"
id="tracking-${order.id}">

</div>

`

:

""
}


</div>

`

:

status==="delivered"

?

`

<div class="actionBox">

<b>
🎉 Order completed successfully.
</b>

</div>

`

:

`

<div class="actionBox">

<b>
❌ Order cancelled.
</b>

</div>

`

}


</div>

`;

})
.join("");

},

error=>{

$("orders").innerHTML=

`
<p class="error">

Unable to load orders:

${esc(
error.message
)}

</p>
`;

}

);

}


window.updateOrderStatus=
async(
orderId,
newStatus
)=>{


try{


await updateDoc(

doc(
db,
"orders",
orderId
),

{

status:newStatus,

statusUpdatedAt:
serverTimestamp()

}

);


}catch(error){

alert(
"Unable to update order: "
+
error.message
);

}

};


window.showTracking=
orderId=>{


const box=

document.getElementById(
"tracking-"+orderId
);


if(!box)return;


box.innerHTML=

`

<input

id="trackingInput-${orderId}"

placeholder="Enter courier tracking number">

<button

class="saveTracking"

onclick="shipOrder(
'${orderId}'
)">

🚚 Confirm Shipment

</button>

`;

};


window.shipOrder=
async orderId=>{


const input=

document.getElementById(
"trackingInput-"+orderId
);


const tracking=

input.value.trim();


if(!tracking){

alert(
"Please enter a tracking number."
);

return;

}


try{


await updateDoc(

doc(
db,
"orders",
orderId
),

{

status:"shipped",

trackingNumber:
tracking,

shippedAt:
serverTimestamp(),

statusUpdatedAt:
serverTimestamp()

}

);


}catch(error){

alert(
"Unable to ship order: "
+
error.message
);

}

};

</script>

</body>
</html>
