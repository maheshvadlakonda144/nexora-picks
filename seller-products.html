<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>My Products | NEXORA PICKS</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

header{
background:#2874f0;
color:white;
padding:18px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.headerLeft{
display:flex;
align-items:center;
gap:15px;
}

header a{
color:white;
text-decoration:none;
font-size:28px;
}

header h1{
margin:0;
font-size:22px;
}

.addBtn{
background:white;
color:#2874f0;
text-decoration:none;
padding:10px 14px;
border-radius:8px;
font-weight:bold;
font-size:15px;
}

.wrap{
max-width:1000px;
margin:auto;
padding:20px;
}

.loading,
.empty{
text-align:center;
padding:40px 20px;
color:#667085;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}

.product{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 10px #00000010;
}

.productImageBox{
width:100%;
height:200px;
background:#f7f9fc;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.productImage{
width:100%;
height:100%;
object-fit:contain;
}

.noImage{
font-size:55px;
}

.productInfo{
padding:16px;
}

.productName{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.productCategory{
color:#667085;
font-size:14px;
margin-bottom:10px;
}

.description{
color:#667085;
font-size:14px;
line-height:1.5;
margin-bottom:12px;
}

.price{
font-size:20px;
font-weight:bold;
color:#2874f0;
margin-bottom:8px;
}

.stock{
margin-bottom:10px;
font-weight:bold;
}

.stock.low{
color:#d93025;
}

.stock.good{
color:#16803c;
}

.status{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-bottom:15px;
}

.status.approved{
background:#e8f5e9;
color:#16803c;
}

.status.pending{
background:#fff3cd;
color:#856404;
}

.status.rejected{
background:#ffebee;
color:#c62828;
}

.buttons{
display:flex;
gap:10px;
}

.editBtn,
.deleteBtn{
flex:1;
border:0;
border-radius:8px;
padding:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.editBtn{
background:#2874f0;
color:white;
}

.deleteBtn{
background:#e53935;
color:white;
}

.deleteBtn:disabled{
opacity:0.6;
cursor:not-allowed;
}

@media(max-width:600px){

.wrap{
padding:12px;
}

header h1{
font-size:18px;
}

.addBtn{
padding:9px 10px;
font-size:13px;
}

}

</style>

</head>

<body>

<header>

<div class="headerLeft">

<a href="seller-dashboard.html">
‹
</a>

<h1>
📦 My Products
</h1>

</div>

<a
href="add-product.html"
class="addBtn">

➕ Add Product

</a>

</header>


<div class="wrap">

<div
id="productsList"
class="loading">

Loading your products...

</div>

</div>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{
getFirestore,
collection,
query,
where,
onSnapshot,
doc,
deleteDoc,
getDoc,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};


const app=
initializeApp(firebaseConfig);


const auth=
getAuth(app);


const db=
getFirestore(app);


const productsList=
document.getElementById(
"productsList"
);


let currentUser=null;


/* CHECK SELLER LOGIN */

onAuthStateChanged(

auth,

async user=>{

if(!user){

location.href=
"seller-register.html";

return;

}


currentUser=user;


try{


const sellerQuery=

query(

collection(
db,
"sellers"
),

where(
"userId",
"==",
user.uid
)

);


const sellerSnapshot=

await getDocs(
sellerQuery
);


const sellerRef=

doc(
db,
"sellers",
user.uid
);


const sellerDoc=

await getDoc(
sellerRef
);


if(
sellerSnapshot.empty
&&
!sellerDoc.exists()
){

alert(
"Only registered sellers can access this page."
);

location.href=
"seller-register.html";

return;

}


loadProducts(
user.uid
);


}catch(error){

console.error(error);


productsList.className=
"empty";


productsList.innerHTML=

`

❌ Unable to verify seller account.

<br><br>

${escapeHtml(
error.message
)}

`;

}

}

);


/* LOAD PRODUCTS */

function loadProducts(
sellerId
){

const productsQuery=

query(

collection(
db,
"products"
),

where(
"sellerId",
"==",
sellerId
)

);


onSnapshot(

productsQuery,

snap=>{


const products=

snap.docs.map(

productDoc=>({

id:
productDoc.id,

...productDoc.data()

})

);


if(!products.length){

productsList.className=
"empty";


productsList.innerHTML=

`

<h2>
📦 No Products Yet
</h2>

<p>
Start selling by adding your first product.
</p>

<br>

<a
href="add-product.html"
class="addBtn"
style="
background:#2874f0;
color:white;
display:inline-block;
">

➕ Add Product

</a>

`;

return;

}


productsList.className=
"products";


productsList.innerHTML=

products.map(

product=>{


const stock=

Number(
product.stock||0
);


const status=

String(
product.approvalStatus||
product.status||
"approved"
).toLowerCase();


const imageUrl=

product.image||
product.imageUrl||
product.productImage||
product.productImageUrl||
"";


let statusText=
"✓ Approved";


if(
status==="pending"
){

statusText=
"⏳ Pending Approval";

}


if(
status==="rejected"
){

statusText=
"✕ Rejected";

}


return `

<div class="product">


<div class="productImageBox">

${
imageUrl
?

`<img
class="productImage"
src="${escapeHtml(imageUrl)}"
alt="${escapeHtml(product.name||product.productName||'Product')}"
onerror="
this.style.display='none';
this.parentElement.innerHTML='<div class=\\'noImage\\'>📦</div>';
"
>`

:

`<div class="noImage">📦</div>`

}

</div>


<div class="productInfo">


<div class="productName">

${escapeHtml(
product.name||
product.productName||
"Product"
)}

</div>


<div class="productCategory">

📂 ${escapeHtml(
product.category||
"Other"
)}

</div>


<div class="description">

${escapeHtml(
product.description||
""
)}

</div>


<div class="price">

₹${

Number(
product.price||0
).toLocaleString(
"en-IN"
)

}

</div>


<div
class="stock ${stock<=5?'low':'good'}">

📊 Stock: ${stock}

</div>


<div
class="status ${escapeHtml(status)}">

${escapeHtml(
statusText
)}

</div>


<div class="buttons">


<button
class="editBtn"
onclick="editProduct('${product.id}')">

✏️ Edit

</button>


<button
class="deleteBtn"
onclick="deleteProduct('${product.id}',this)">

🗑 Delete

</button>


</div>

</div>

</div>

`;

}

).join("");

},

error=>{


console.error(error);


productsList.className=
"empty";


productsList.innerHTML=

`

❌ Unable to load products.

<br><br>

${escapeHtml(
error.message
)}

`;

}

);

}


/* EDIT PRODUCT */

window.editProduct=

function(productId){

location.href=

"edit-product.html?id="+
encodeURIComponent(
productId
);

};


/* DELETE PRODUCT */

window.deleteProduct=

async function(
productId,
button
){


if(!currentUser){

alert(
"Please login again."
);

return;

}


const confirmDelete=

confirm(
"Are you sure you want to permanently delete this product?"
);


if(!confirmDelete){

return;

}


try{


/* DISABLE BUTTON */

if(button){

button.disabled=true;

button.textContent=
"Deleting...";

}


/* GET PRODUCT FIRST */

const productRef=

doc(
db,
"products",
productId
);


const productSnap=

await getDoc(
productRef
);


/* PRODUCT NOT FOUND */

if(!productSnap.exists()){

alert(
"Product not found or already deleted."
);

return;

}


/* CHECK PRODUCT OWNER */

const productData=

productSnap.data();


if(
productData.sellerId
&&
productData.sellerId
!==currentUser.uid
){

alert(
"You do not have permission to delete this product."
);

return;

}


/* DELETE PRODUCT */

await deleteDoc(
productRef
);


alert(
"✅ Product deleted successfully."
);


/* REALTIME LIST AUTOMATICALLY UPDATES */


}catch(error){


console.error(
"Delete error:",
error
);


let message=
error.message;


/* FIRESTORE PERMISSION ERROR */

if(
error.code===
"permission-denied"
){

message=

"Firestore permission denied. Update your Firebase Firestore security rules to allow sellers to delete their own products.";

}


alert(
"❌ Unable to delete product: "+
message
);


if(button){

button.disabled=false;

button.textContent=
"🗑 Delete";

}

}

};


/* ESCAPE HTML */

function escapeHtml(value){

return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

</script>

</body>

</html>
