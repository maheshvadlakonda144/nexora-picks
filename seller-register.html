<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Registration | NEXORA PICKS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#172033;
}

header{
    background:#172033;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:22px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:650px;
    margin:30px auto;
    padding:20px;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.progress-container{
    width:100%;
    height:8px;
    background:#e5e7eb;
    border-radius:10px;
    margin-bottom:30px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:33%;
    background:#ff5a3c;
    transition:0.3s;
}

.step{
    display:none;
}

.step.active{
    display:block;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    gap:10px;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.next-btn,
.submit-btn{
    background:#ff5a3c;
    color:white;
}

.prev-btn{
    background:#e5e7eb;
    color:#172033;
}

.success{
    text-align:center;
    padding:30px;
}

.success h2{
    color:#16a34a;
}

</style>

</head>

<body>

<header>
    <h1>NEXORA PICKS</h1>
    <p>Seller Registration</p>
</header>

<div class="container">

<div class="form-box">

<div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
</div>


<!-- STEP 1 -->

<div class="step active" id="step1">

<h2>Basic Information</h2>

<label>Full Name</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
required>

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="Enter your phone number"
required>

<div class="buttons">

<button
type="button"
class="next-btn"
onclick="nextStep(2)">
Next
</button>

</div>

</div>


<!-- STEP 2 -->

<div class="step" id="step2">

<h2>Business Information</h2>

<label>Store Name</label>

<input
type="text"
id="storeName"
placeholder="Enter your store name"
required>

<label>Business Category</label>

<select id="category" required>

<option value="">Select Category</option>

<option>Electronics</option>
<option>Fashion</option>
<option>Beauty</option>
<option>Home & Kitchen</option>
<option>Other</option>

</select>

<label>Business Address</label>

<textarea
id="address"
placeholder="Enter your business address"
rows="4"
required></textarea>

<div class="buttons">

<button
type="button"
class="prev-btn"
onclick="prevStep(1)">
Back
</button>

<button
type="button"
class="next-btn"
onclick="nextStep(3)">
Next
</button>

</div>

</div>


<!-- STEP 3 -->

<div class="step" id="step3">

<h2>Bank Details</h2>

<label>Account Holder Name</label>

<input
type="text"
id="accountName"
placeholder="Enter account holder name"
required>

<label>Bank Account Number</label>

<input
type="text"
id="accountNumber"
placeholder="Enter account number"
required>

<label>IFSC Code</label>

<input
type="text"
id="ifsc"
placeholder="Enter IFSC code"
required>

<div class="buttons">

<button
type="button"
class="prev-btn"
onclick="prevStep(2)">
Back
</button>

<button
type="button"
class="submit-btn"
onclick="submitRegistration()">
Submit Registration
</button>

</div>

</div>


<!-- SUCCESS -->

<div class="step" id="successStep">

<div class="success">

<h2>Registration Successful! 🎉</h2>

<p>
Your seller registration has been submitted successfully.
</p>

<p>
We will review your information and contact you soon.
</p>

<button
type="button"
class="next-btn"
onclick="window.location.href='index.html'">
Go to Home
</button>

</div>

</div>

</div>

</div>


<script>

let currentStep = 1;


function nextStep(step){

    if(step === 2){

        const fullName =
        document.getElementById("fullName").value.trim();

        const email =
        document.getElementById("email").value.trim();

        const phone =
        document.getElementById("phone").value.trim();

        if(!fullName || !email || !phone){

            alert("Please fill all required fields.");

            return;
        }

    }


    if(step === 3){

        const storeName =
        document.getElementById("storeName").value.trim();

        const category =
        document.getElementById("category").value;

        const address =
        document.getElementById("address").value.trim();

        if(!storeName || !category || !address){

            alert("Please fill all required fields.");

            return;
        }

    }


    document
    .getElementById("step" + currentStep)
    .classList
    .remove("active");


    document
    .getElementById("step" + step)
    .classList
    .add("active");


    currentStep = step;


    updateProgress(step);


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function prevStep(step){

    document
    .getElementById("step" + currentStep)
    .classList
    .remove("active");


    document
    .getElementById("step" + step)
    .classList
    .add("active");


    currentStep = step;


    updateProgress(step);


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function updateProgress(step){

    const progressBar =
    document.getElementById("progressBar");


    if(step === 1){

        progressBar.style.width = "33%";

    }

    else if(step === 2){

        progressBar.style.width = "66%";

    }

    else if(step === 3){

        progressBar.style.width = "100%";

    }

}


function submitRegistration(){

    const accountName =
    document
    .getElementById("accountName")
    .value
    .trim();


    const accountNumber =
    document
    .getElementById("accountNumber")
    .value
    .trim();


    const ifsc =
    document
    .getElementById("ifsc")
    .value
    .trim();


    if(!accountName || !accountNumber || !ifsc){

        alert("Please fill all bank details.");

        return;
    }


    document
    .getElementById("step3")
    .classList
    .remove("active");


    document
    .getElementById("successStep")
    .classList
    .add("active");


    document
    .getElementById("progressBar")
    .style.width = "100%";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

</script>

</body>

</html>
