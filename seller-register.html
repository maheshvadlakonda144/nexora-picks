<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>
Become a Seller | NEXORA PICKS
</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

header{
background:#2874f0;
color:white;
padding:18px 20px;
display:flex;
align-items:center;
gap:15px;
position:sticky;
top:0;
z-index:10;
}

header a{
color:white;
text-decoration:none;
font-size:28px;
}

header h1{
margin:0;
font-size:23px;
}

.container{
max-width:650px;
margin:auto;
padding:20px 15px 40px;
}

.card{
background:white;
border-radius:16px;
padding:22px;
box-shadow:0 3px 15px #00000012;
}

.card h2{
margin-top:0;
margin-bottom:8px;
}

.subtitle{
color:#687386;
line-height:1.5;
margin-bottom:25px;
}

.sectionTitle{
font-size:18px;
font-weight:bold;
margin-top:25px;
margin-bottom:15px;
padding-bottom:10px;
border-bottom:1px solid #eee;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
textarea,
select{
width:100%;
padding:13px;
border:1px solid #d5d9e0;
border-radius:9px;
font-size:16px;
margin-bottom:18px;
outline:none;
font-family:Arial,sans-serif;
}

input:focus,
textarea:focus,
select:focus{
border-color:#2874f0;
box-shadow:0 0 0 3px #2874f020;
}

textarea{
resize:vertical;
min-height:100px;
}

.checkboxBox{
display:flex;
gap:10px;
align-items:flex-start;
margin:10px 0 20px;
}

.checkboxBox input{
width:auto;
margin-top:4px;
}

.checkboxBox label{
font-weight:normal;
line-height:1.5;
margin:0;
}

button{
width:100%;
border:none;
border-radius:9px;
padding:15px;
background:#2874f0;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
margin-top:18px;
padding:14px;
border-radius:9px;
display:none;
font-weight:bold;
line-height:1.5;
}

.success{
display:block;
background:#e8f7ed;
color:#16803c;
}

.error{
display:block;
background:#fff0f0;
color:#c62828;
}

.pending{
display:block;
background:#fff8e1;
color:#856404;
}

.loginBox{
background:white;
border-radius:16px;
padding:30px 20px;
text-align:center;
box-shadow:0 3px 15px #00000012;
}

.loginBox button{
margin-top:15px;
}

.note{
font-size:14px;
color:#687386;
line-height:1.5;
margin-top:12px;
}

</style>

</head>

<body>


<header>

<a href="index.html">
‹
</a>

<h1>
🏪 Become a Seller
</h1>

</header>


<div class="container">


<!-- LOGIN REQUIRED -->

<div
id="loginRequired"
style="display:none">

<div class="loginBox">

<h2>
🔐 Login Required
</h2>

<p>
Please login before registering as a seller.
</p>

<button
onclick="goLogin()">

Login Now

</button>

</div>

</div>



<!-- SELLER FORM -->

<div
id="sellerFormContainer"
style="display:none">

<div class="card">

<h2>
Sell on NEXORA PICKS
</h2>

<p class="subtitle">

Create your seller account. After registration,
your application will be reviewed by the admin.

</p>


<form id="sellerForm">


<div class="sectionTitle">

👤 Personal Information

</div>


<label>
Full Name
</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
required>


<label>
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
readonly>


<label>
Mobile Number
</label>

<input
type="tel"
id="phone"
placeholder="Enter mobile number"
pattern="[0-9]{10}"
maxlength="10"
required>



<div class="sectionTitle">

🏪 Store Information

</div>


<label>
Store Name
</label>

<input
type="text"
id="storeName"
placeholder="Enter your store name"
required>


<label>
Business Category
</label>

<select
id="businessCategory"
required>

<option value="">
Select category
</option>

<option>
Electronics
</option>

<option>
Fashion
</option>

<option>
Beauty & Personal Care
</option>

<option>
Home & Kitchen
</option>

<option>
Mobiles & Accessories
</option>

<option>
Books
</option>

<option>
Sports
</option>

<option>
Grocery
</option>

<option>
Other
</option>

</select>


<label>
Business Address
</label>

<textarea
id="businessAddress"
placeholder="Enter your business address"
required></textarea>



<div class="sectionTitle">

🧾 Business Details

</div>


<label>
PAN Number
</label>

<input
type="text"
id="panNumber"
placeholder="Enter PAN number">


<label>
GST Number
</label>

<input
type="text"
id="gstNumber"
placeholder="Enter GST number (if available)">



<div class="sectionTitle">

🏦 Bank Details

</div>


<label>
Account Holder Name
</label>

<input
type="text"
id="accountHolder"
placeholder="Enter account holder name"
required>


<label>
Bank Name
</label>

<input
type="text"
id="bankName"
placeholder="Enter bank name"
required>


<label>
Account Number
</label>

<input
type="text"
id="accountNumber"
placeholder="Enter bank account number"
required>


<label>
IFSC Code
</label>

<input
type="text"
id="ifscCode"
placeholder="Enter IFSC code"
required>



<div class="checkboxBox">

<input
type="checkbox"
id="agreement"
required>


<label
for="agreement">

I confirm that the information provided is correct
and I agree to the NEXORA PICKS seller terms and conditions.

</label>

</div>



<button
type="submit"
id="submitBtn">

🚀 Submit Seller Application

</button>


<div
id="message"
class="message">

</div>


</form>

</div>

</div>


</div>



<script type="module">


import{

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import{

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import{

getFirestore,

doc,

getDoc,

setDoc,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



const firebaseConfig={

apiKey:"AIzaSyBb1YMdtjSEyuCBZzuymElH5Y7ykU_KSBg",

authDomain:"nexora-picks-e887f.firebaseapp.com",

projectId:"nexora-picks-e887f",

storageBucket:"nexora-picks-e887f.firebasestorage.app",

messagingSenderId:"621359003619",

appId:"1:621359003619:web:483add8bfcd0241f4192d",

measurementId:"G-LSMJ6QLLPW"

};



const app=

initializeApp(
firebaseConfig
);



const auth=

getAuth(
app
);



const db=

getFirestore(
app
);



const $=

id=>
document.getElementById(
id
);



let currentUser=null;



/* CHECK LOGIN */

onAuthStateChanged(

auth,

async user=>{


if(!user){


$("loginRequired").style.display=

"block";


$("sellerFormContainer").style.display=

"none";


return;

}



currentUser=

user;



$("loginRequired").style.display=

"none";


$("sellerFormContainer").style.display=

"block";



$("email").value=

user.email||"";



try{


/*
IMPORTANT:
SELLER DOCUMENT ID =
FIREBASE USER UID
*/


const sellerRef=

doc(

db,

"sellers",

user.uid

);



const sellerSnap=

await getDoc(
sellerRef
);



if(

sellerSnap.exists()

){


const seller=

sellerSnap.data();



let statusMessage="";


if(

seller.status==="approved"

){


statusMessage=

`

<div class="message success">

🎉 Your seller account has been approved!

<br><br>

<button
onclick="goSellerDashboard()">

Open Seller Dashboard

</button>

</div>

`;


}


else if(

seller.status==="rejected"

){


statusMessage=

`

<div class="message error">

❌ Your seller application was rejected.

Please contact support.

</div>

`;


}


else{


statusMessage=

`

<div class="message pending">

⏳ Your seller application is under review.

Please wait for admin approval.

</div>

`;


}



$("sellerForm").innerHTML=

`

<div class="sectionTitle">

🏪 Seller Application

</div>


${statusMessage}


<p class="note">

<b>
Store:
</b>

${escapeHtml(
seller.storeName||
""
)}

</p>


<p class="note">

<b>
Status:
</b>

${escapeHtml(
seller.status||
"pending"
).toUpperCase()}

</p>

`;



return;

}


}catch(error){


console.error(
error
);


}


}

);



/* SUBMIT SELLER FORM */

$("sellerForm").addEventListener(

"submit",

async function(event){


event.preventDefault();



if(

!currentUser

){


return;

}



const submitBtn=

$("submitBtn");



submitBtn.disabled=

true;



submitBtn.innerText=

"Submitting...";



$("message").className=

"message";


$("message").style.display=

"none";



try{


const sellerData={



/* USER ID */

userId:

currentUser.uid,



/* PERSONAL */

email:

currentUser.email||"",


fullName:

$("fullName").value.trim(),


phone:

$("phone").value.trim(),



/* STORE */

storeName:

$("storeName").value.trim(),


businessCategory:

$("businessCategory").value,


businessAddress:

$("businessAddress").value.trim(),



/* BUSINESS */

panNumber:

$("panNumber").value.trim().toUpperCase(),


gstNumber:

$("gstNumber").value.trim().toUpperCase(),



/* BANK */

accountHolder:

$("accountHolder").value.trim(),


bankName:

$("bankName").value.trim(),


accountNumber:

$("accountNumber").value.trim(),


ifscCode:

$("ifscCode").value.trim().toUpperCase(),



/* SELLER STATUS */

status:

"pending",


sellerVerified:

false,



/* DATES */

createdAt:

serverTimestamp(),


updatedAt:

serverTimestamp()

};



/*
IMPORTANT FIX

USE USER UID AS DOCUMENT ID
*/


await setDoc(

doc(

db,

"sellers",

currentUser.uid

),

sellerData

);



$("message").innerHTML=

`

🎉 Seller application submitted successfully!

<br><br>

⏳ Your application is now under admin review.

`;



$("message").className=

"message success";



/* DISABLE FORM */

document
.querySelectorAll(

"#sellerForm input, #sellerForm textarea, #sellerForm select, #sellerForm button"

)

.forEach(

element=>{


element.disabled=

true;


}

);



}catch(error){


console.error(
error
);



$("message").innerHTML=

"❌ Unable to submit application: "
+
escapeHtml(
error.message
);



$("message").className=

"message error";



submitBtn.disabled=

false;



submitBtn.innerText=

"🚀 Submit Seller Application";



}


}

);



/* LOGIN */

window.goLogin=

function(){


location.href=

"index.html";


};



/* SELLER DASHBOARD */

window.goSellerDashboard=

function(){


location.href=

"seller-dashboard.html";


};



/* ESCAPE HTML */

function escapeHtml(value){


return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);


}


</script>


</body>

  </html>
